<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top Interview 150 — Học theo nhóm</title>
<style>
:root{
  --bg:#0d1017; --panel:#141926; --panel2:#1a2130; --ink:#eaf0f8; --mut:#8f9ab2;
  --line:#242c3e; --acc:#7aa2ff; --acc2:#38d3f0; --ok:#3ddc97; --warn:#ffb454; --bad:#ff6b81;
  --inksoft:#c9d2e3;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);background-image:radial-gradient(#1d2434 1px,transparent 1px);background-size:26px 26px;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
a{color:var(--acc)}
a:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--acc2);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 90px}
.hero{padding:10px 0 20px;border-bottom:1px solid var(--line);margin-bottom:26px}
.chip{display:inline-block;padding:3px 12px;border-radius:999px;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);color:var(--mut);background:var(--panel);margin:2px 6px 0 0}
.hero h1{font-size:27px;margin:10px 0 8px;text-wrap:balance}
.hero p{color:var(--mut);margin:6px 0 0;max-width:850px}

/* ---------- index / toc ---------- */
.grp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:16px 0 28px}
.grp{text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px 12px;display:flex;gap:10px;align-items:center;transition:border-color .15s}
.grp:hover{border-color:var(--acc)}
.grp .ic{font-size:20px}
.grp b{font-size:14px}
.grp small{display:block;color:var(--mut);font-size:11.5px}

/* ---------- problem ---------- */
section.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 26px;margin:30px 0;scroll-margin-top:16px}
.sec-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-top h2{margin:0;font-size:21px;text-wrap:balance}
.tag{font-size:12px;letter-spacing:.04em;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.tag.easy{color:#a7f3d0;border-color:#14532d;background:#052e16}
.tag.medium{color:#fde68a;border-color:#78350f;background:#2c1a05}
.tag.hard{color:#fecaca;border-color:#7f1d1d;background:#2a0a0a}
.stmt{color:var(--inksoft);margin:12px 0 4px;line-height:1.7}
.ex{color:var(--mut);font-size:14px}
code{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0b0e16;border:1px solid var(--line);border-radius:6px;padding:1px 5px;color:var(--acc2)}
.idea{background:#101a2e;border-left:3px solid var(--acc2);border-radius:0 12px 12px 0;padding:11px 15px;margin:13px 0;font-size:14.5px;color:var(--inksoft)}

/* ---------- solution ---------- */
.sol{border-top:1px dashed var(--line);margin-top:22px;padding-top:18px}
.sol h4{font-size:16px;margin:0 0 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;text-wrap:balance}
.sol h5{font-size:14.5px;margin:14px 0 6px;color:var(--acc2)}
.meta{font-size:13px;color:var(--mut)}
.pill{display:inline-block;padding:3px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:12.5px;margin-right:8px;margin-bottom:4px}
.pill b{color:var(--acc)}
pre.code{background:#0b0e16;border:1px solid var(--line);border-radius:13px;padding:14px 16px;overflow-x:auto;font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:9px 0}
pre.code .k{color:#c792ea} pre.code .f{color:#82aaff} pre.code .n{color:#f78c6c}
pre.code .s{color:#c3e88d} pre.code .c{color:#5c6478;font-style:italic} pre.code .o{color:#89ddff}
.steps-desc{color:var(--mut);font-size:14px;margin:8px 0}

/* ---------- static steps ---------- */
.steps{display:flex;flex-direction:column;gap:7px;margin:10px 0}
.step-line{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:13.5px;color:var(--inksoft)}
.step-line .sno{color:var(--acc2);font-weight:700;font-variant-numeric:tabular-nums;min-width:22px}

/* ---------- interactive player ---------- */
.run{border:1px solid var(--line);border-radius:13px;background:var(--panel2);padding:13px 15px;margin:11px 0}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:5px 11px;font-size:14px;transition:.12s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.sp{font-size:13px;color:var(--mut);margin-right:6px;font-variant-numeric:tabular-nums}
.rng{flex:1;min-width:130px;accent-color:var(--acc)}
.note{font-size:14px;color:var(--inksoft);margin:0 0 9px;min-height:21px}
.note.fin{color:var(--ok)}
.cells-wrap{position:relative;padding:13px 4px 4px;min-height:56px}
.cells{display:flex;gap:7px;flex-wrap:wrap}
.cell{position:relative;width:42px;height:40px;border:1.5px solid #39415c;border-radius:9px;background:#141828;display:grid;place-items:center;transition:background .18s,border-color .18s;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.cell.dead{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(255,255,255,.05) 6px 12px);border-style:dashed;color:#5b6377}
.cell.keep{background:#153a2b;border-color:#2f7d5a;color:#d1fae5}
.cell.rd{background:#4a2c10;border-color:var(--warn);animation:pulse .5s}
.cell.wr{background:#1a2f5c;border-color:var(--acc);animation:pulse .5s}
.cell.sw{background:#4c1120;border-color:var(--bad)}
.cell.act{background:#33250a;border-color:var(--warn)}
.ci{position:absolute;bottom:-15px;left:0;right:0;text-align:center;font-size:10px;color:#5b6377;font-variant-numeric:tabular-nums}
/* ---------- player v2: mat / node (ll/tree) / stack / hash / set / aux ---------- */
.run:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
/* mat */
.cells.mat{flex-direction:column;gap:6px;flex-wrap:nowrap;width:max-content}
.mrow{display:flex;gap:6px}
.cell.mcell{width:38px;height:34px;font-size:13px;border-radius:6px}
.cell.tail{border-style:dashed;color:#7d8aa5}
.cell.colored{background:#12402c;border-color:var(--ok)}
/* stack */
.cells.stack{flex-direction:column-reverse;align-items:center;gap:6px;width:78px;border:1.5px solid #39415c;border-top:none;border-radius:0 0 10px 10px;padding:10px 8px 7px;background:#0f1522;min-height:66px}
.cell.scol{width:56px;height:34px;font-size:13px;border-radius:6px}
.cell.top{border-color:var(--warn)}
.topb{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--warn);margin-top:3px;text-transform:uppercase}
.stack-row{display:flex;gap:12px;align-items:stretch}
.stack-ptrs{display:flex;flex-direction:column-reverse;justify-content:flex-start;gap:6px;padding:10px 0 7px}
.sph{min-height:40px;display:flex;align-items:center}
.ptr-tag{font-size:10.5px;font-weight:700;color:var(--acc2);background:#0b1e2b;border:1px solid #1e5a6f;border-radius:4px;padding:1px 6px;white-space:nowrap}
/* ll + tree: node dùng chung */
.cells.tree,.cells.ll{display:block}
.tbox{position:relative;overflow-x:auto;padding:14px 0 20px}
.tgrid{position:relative;display:grid;margin:0 auto}
.tgrid svg{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
.llrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.node{position:relative;min-width:46px;height:40px;padding:0 8px;border:1.5px solid #39415c;border-radius:9px;background:#141828;display:grid;place-items:center;transition:background .18s,border-color .18s;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.node.rd{background:#4a2c10;border-color:var(--warn);animation:pulse .5s}
.node.wr{background:#1a2f5c;border-color:var(--acc);animation:pulse .5s}
.node.sw{background:#4c1120;border-color:var(--bad)}
.node.act{background:#33250a;border-color:var(--warn)}
.node.tnd{width:44px;height:44px;min-width:44px;border-radius:50%;justify-self:center;align-self:center}
.nid{position:absolute;bottom:-15px;left:0;right:0;text-align:center;font-size:9.5px;color:#5b6377;font-variant-numeric:tabular-nums}
.nstate{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:9px;background:#1b2740;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--acc2);white-space:nowrap;z-index:2}
.arrow{color:var(--mut);font-size:16px;font-weight:700;padding:0 2px;align-self:center}
/* hash */
.cells.hash{flex-direction:column;gap:5px;width:max-content}
.hpair{display:flex;align-items:center;gap:8px;border:1px solid #2a3550;border-radius:8px;background:#101828;padding:2px 4px;transition:background .18s,border-color .18s}
.hpair.rd{background:#4a2c10;border-color:var(--warn);animation:pulse .5s}
.hpair.wr{background:#1a2f5c;border-color:var(--acc);animation:pulse .5s}
.hpair.sw{background:#4c1120;border-color:var(--bad)}
.hk{min-width:42px;text-align:center;font-weight:700;color:var(--acc);font-size:12.5px;background:#16203a;border-radius:6px;padding:2px 6px}
.hv{font-weight:600;font-size:13.5px;padding:2px 7px;font-variant-numeric:tabular-nums;min-width:24px;color:var(--inksoft)}
/* set */
.cells.set{gap:6px;flex-wrap:wrap}
.sbadge{border:1px solid #3a4560;border-radius:999px;background:#101828;padding:4px 13px;font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums}
.sbadge.rd{background:#4a2c10;border-color:var(--warn);animation:pulse .5s}
.sbadge.wr{background:#1a2f5c;border-color:var(--acc);animation:pulse .5s}
.sbadge.sw{background:#4c1120;border-color:var(--bad)}
/* aux */
.aux{display:flex;align-items:center;gap:9px;margin-top:8px;flex-wrap:wrap}
.alabel{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.acells{display:flex;gap:5px}
.acell{min-width:30px;height:26px;border:1px solid #3a4560;border-radius:6px;background:#121a2a;display:grid;place-items:center;font-size:12.5px;font-weight:600;padding:0 7px;font-variant-numeric:tabular-nums;transition:background .18s,border-color .18s}
.acell.rd{background:#4a2c10;border-color:var(--warn)}
.acell.wr{background:#1a2f5c;border-color:var(--acc)}
.acell.sw{background:#4c1120;border-color:var(--bad)}
.note .result{color:var(--acc2);font-weight:700}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
.ptrs{position:absolute;inset:0;pointer-events:none}
.ptr{position:absolute;top:1px;font-size:11px;font-weight:700;color:var(--acc2);transform:translateX(-50%);background:#0b1e2b;border:1px solid #1e5a6f;border-radius:5px;padding:1px 6px;white-space:nowrap}
@media (max-width:640px){.wrap{padding:14px 10px 70px}section.card{padding:16px 12px}.cell{width:36px;height:34px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* code pane + dòng đang chạy */
pre.code.pane{position:relative;margin:8px 0;border-left:3px solid var(--acc2);font-size:12.5px;max-height:180px;overflow-y:auto}
pre.code .curline{background:rgba(122,162,255,.14);box-shadow:inset 3px 0 0 var(--acc);border-radius:3px}
pre.code.pane .curline{background:rgba(122,162,255,.16)}
/* region (khung vùng hoạt động) */
.region{position:absolute;border:2px dashed var(--acc2);border-radius:8px;pointer-events:none;opacity:.55;transition:all .15s;z-index:2}

/* badge đọc/ghi trên node cây */
.nst{position:absolute;top:-9px;right:-12px;font-size:9px;font-weight:700;background:#0b1e2b;border:1px solid #1e5a6f;border-radius:4px;padding:0 4px;color:var(--acc2);z-index:4;display:none}
.node.rd .nst{display:block;border-color:var(--warn);color:var(--warn);background:#33250a}
.node.wr .nst{display:block;border-color:var(--acc);color:var(--acc);background:#0b1e2b}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
  <div>
    <span class="chip">Top Interview 150</span>
    <span class="chip" id="grpChip"></span>
    <span class="chip">Python · tiếng Việt</span>
  </div>
  <h1 id="grpTitle"></h1>
  <p id="grpDesc"></p>
</header>
<nav class="toc" id="toc"></nav>
<main id="content"></main>
<footer id="foot"></footer>
</div>

<script>
"use strict";
/*
 * traces150.js — trace animation cho các bài ngoài 6 bài gốc (Top Interview 150).
 * Nguyên tắc như traces.js: mỗi hàm nhận input, trả mảng step {note, cells, array, read, write, swap, ptr, ptrNames, end}.
 * Bước 1 làm quen với 4 thuật toán kinh điển.
 */
'use strict';

function at150(arr, i) { return { target: [i], value: arr[i] }; }

/* ============ 121 Best Time to Buy and Sell Stock ============ */
function trace_stock(input) {
  const { prices } = input;
  const steps = [];
  let buy = prices[0], profit = 0;
  const push = (note, patch, end) => {
    const cells = prices.map((v, idx) => ({ value: v, keep: idx === 0 ? false : false }));
    steps.push(Object.assign({ note, cells, array: prices.slice() }, patch, end ? { end: true, answer: profit } : {}));
  };
  push(`init: buy = prices[0] = ${buy}, max profit = 0. Duyệt từ ngày 1.`, { ptr: { buy: 0, i: 0 } });
  for (let i = 1; i < prices.length; i++) {
    if (prices[i] < buy) {
      buy = prices[i];
      push(`prices[${i}] = ${prices[i]} < buy ${prices[i - 1] > prices[i] ? '(giảm so với trước)' : ''} → cập nhật buy = ${prices[i]} (mua rẻ hơn, bỏ qua mức lời cũ chưa tốt hơn).`,
        { read: at150(prices, i), ptr: { buy: i, i }, ptrNames: ['buy', 'i'] });
    } else {
      const p = prices[i] - buy;
      const better = p > profit;
      profit = Math.max(profit, p);
      push(`prices[${i}] = ${prices[i]} ≥ buy ${buy} → lời nếu bán ở đây = ${p}. ${better ? 'Cập nhật max profit = ' + p + '!' : 'Chưa hơn max profit hiện tại (' + profit + ').'}`,
        { read: at150(prices, i), ptr: { buy: i, i }, ptrNames: ['buy', 'i'] });
    }
  }
  push(`Xong: max profit = ${profit} (mua ở ${buy}, các ngày sau là nơi bán tối ưu).`, {}, true);
  return steps;
}

/* ============ 122 Best Time to Buy and Sell Stock II ============ */
function trace_stock_ii(input) {
  const { prices } = input;
  const steps = [];
  let profit = 0, last = prices[0];
  const push = (note, patch, end) => {
    const cells = prices.map((v) => ({ value: v }));
    steps.push(Object.assign({ note, cells, array: prices.slice() }, patch, end ? { end: true, answer: profit } : {}));
  };
  push(`init: profit = 0, last = prices[0] = ${last}.`, { ptr: { last: 0, i: 0 } });
  for (let i = 1; i < prices.length; i++) {
    if (prices[i] > last) {
      profit += prices[i] - last;
      push(`prices[${i}] = ${prices[i]} > ${last} → gom ${prices[i] - last} (bán ngay lập tức). profit = ${profit}.`,
        { read: at150(prices, i), ptr: { last: i, i }, ptrNames: ['last', 'i'] });
    } else {
      push(`prices[${i}] = ${prices[i]} ≤ ${last} → không giao dịch (chờ giá lên).`,
        { read: at150(prices, i), ptr: { last: i, i }, ptrNames: ['last', 'i'] });
    }
    last = prices[i];
  }
  push(`Xong: tổng lợi nhuận ${profit} — cộng dồn MỌI bước tăng liên tiếp.`, {}, true);
  return steps;
}

/* ============ 15 3Sum ============ */
function trace_3sum(input) {
  const { nums } = input;
  const a = nums.slice().sort((x, y) => x - y);
  const res = [];
  const steps = [];
  const push = (note, patch, end) => {
    const cells = a.map((v) => ({ value: v }));
    steps.push(Object.assign({ note, cells, array: a.slice() }, patch, end ? { end: true, answer: res.length + ' bộ ba' } : {}));
  };
  push('Sắp xếp mảng để dùng hai con trỏ.', {});
  for (let i = 0; i < a.length - 2; i++) {
    if (i > 0 && a[i] === a[i - 1]) { push(`a[${i}] = ${a[i]} trùng a[${i - 1}] → bỏ qua để tránh bộ ba trùng.`, { ptr: { i }, ptrNames: ['i'] }); continue; }
    let lo = i + 1, hi = a.length - 1;
    push(`Cố định a[${i}] = ${a[i]}; lo = ${lo}, hi = ${hi}. Tìm cặp (lo, hi) sao cho tổng = 0.`, { ptr: { i, lo, hi }, ptrNames: ['i', 'lo', 'hi'] });
    while (lo < hi) {
      const s = a[i] + a[lo] + a[hi];
      if (s === 0) {
        res.push([a[i], a[lo], a[hi]]);
        push(`tổng ${a[i]} + ${a[lo]} + ${a[hi]} = 0 → ghi nhận bộ ba.`, { read: [at150(a, i), at150(a, lo), at150(a, hi)], ptr: { i, lo, hi }, ptrNames: ['i', 'lo', 'hi'] });
        const x = a[lo], y = a[hi];
        while (lo < hi && a[lo] === x) lo++;
        while (lo < hi && a[hi] === y) hi--;
        push(`Nhảy qua các giá trị trùng (lo → ${lo}, hi → ${hi}) để không lặp bộ ba.`, { ptr: { i, lo, hi }, ptrNames: ['i', 'lo', 'hi'] });
      } else if (s < 0) {
        lo++;
        push(`tổng = ${s} < 0 → tăng lo lên ${lo} (cần tổng lớn hơn).`, { read: [at150(a, lo - 1)], ptr: { i, lo, hi }, ptrNames: ['i', 'lo', 'hi'] });
      } else {
        hi--;
        push(`tổng = ${s} > 0 → giảm hi xuống ${hi} (cần tổng nhỏ hơn).`, { read: [at150(a, hi + 1)], ptr: { i, lo, hi }, ptrNames: ['i', 'lo', 'hi'] });
      }
    }
  }
  push(`Xong: ${res.length} bộ ba`, {}, true);
  return steps;
}

/* ============ 11 Container With Most Water ============ */
function trace_container(input) {
  const { height } = input;
  const steps = [];
  let l = 0, r = height.length - 1, best = 0;
  const push = (note, patch, end) => {
    const cells = height.map((v) => ({ value: v }));
    steps.push(Object.assign({ note, cells, array: height.slice() }, patch, end ? { end: true, answer: best } : {}));
  };
  push(`Hai con trỏ: l = ${l}, r = ${r}. Diện tích = chiều cao thấp hơn × khoảng cách.`, { ptr: { l, r }, ptrNames: ['l', 'r'] });
  while (l < r) {
    const w = r - l;
    const area = Math.min(height[l], height[r]) * w;
    best = Math.max(best, area);
    const goLeft = height[l] < height[r];
    push(`Cặp (${l}, ${r}): diện tích = ${Math.min(height[l], height[r])} × ${w} = ${area} → best = ${best}. ${goLeft ? 'Cạnh trái thấp hơn → dịch l++' : 'Cạnh phải thấp hơn → dịch r--'} (giữ cạnh cao hơn để còn triển vọng).`,
      { read: [at150(height, l), at150(height, r)], ptr: { l: l + (goLeft ? 1 : 0), r: r - (goLeft ? 0 : 1) }, ptrNames: ['l', 'r'] });
    if (goLeft) l++; else r--;
  }
  push(`Xong: thể tích nước tối đa = ${best}.`, {}, true);
  return steps;
}

/* ============ 3 Longest Substring Without Repeating Characters ============ */
function trace_longest_substr(input) {
  const { s } = input;
  const steps = [];
  let l = 0, best = 0;
  const seen = new Map();
  const push = (note, patch, end) => {
    const cells = s.split('').map((v) => ({ value: v }));
    steps.push(Object.assign({ note, cells, array: s.split('') }, patch, end ? { end: true, answer: best } : {}));
  };
  push(`Cửa sổ [l, r): ký tự trong cửa sổ đều là duy nhất. best = 0.`, { ptr: { l, r: 0 }, ptrNames: ['l', 'r'] });
  for (let r = 0; r < s.length; r++) {
    const c = s[r];
    if (seen.has(c) && seen.get(c) >= l) {
      const old = l;
      l = seen.get(c) + 1;
      push(`Gặp '${c}' đã xuất hiện ở vị trí ${seen.get(c)} (đang trong cửa sổ) → dịch l từ ${old} lên ${l}.`,
        { read: at150(s.split(''), r), ptr: { l, r }, ptrNames: ['l', 'r'] });
    }
    seen.set(c, r);
    best = Math.max(best, r - l + 1);
    push(`Thêm '${c}' vào cửa sổ [${l}, ${r}]. best = ${best} (đoạn dài nhất không trùng).`,
      { read: at150(s.split(''), r), ptr: { l, r }, ptrNames: ['l', 'r'] });
  }
  push(`Xong: độ dài lớn nhất = ${best}.`, {}, true);
  return steps;
}

/* ============ 209 Minimum Size Subarray Sum ============ */
function trace_min_subarray(input) {
  const { nums, target } = input;
  const steps = [];
  let l = 0, sum = 0, best = Infinity;
  const push = (note, patch, end) => {
    const cells = nums.map((v) => ({ value: v }));
    steps.push(Object.assign({ note, cells, array: nums.slice() }, patch, end ? { end: true, answer: best === Infinity ? 0 : best } : {}));
  };
  push(`Cửa sổ [l, r): sum = tổng trong cửa sổ. Mở rộng r khi sum < ${target}, thu hẹp l khi sum ≥ ${target}.`, { ptr: { l, r: 0 }, ptrNames: ['l', 'r'] });
  for (let r = 0; r < nums.length; r++) {
    sum += nums[r];
    push(`Thêm nums[${r}] = ${nums[r]} → sum = ${sum}.`, { read: at150(nums, r), ptr: { l, r }, ptrNames: ['l', 'r'] });
    while (sum >= target && l <= r) {
      const len = r - l + 1;
      best = Math.min(best, len);
      const removed = nums[l];
      push(`sum ${sum} ≥ ${target} → cửa sổ [${l}, ${r}] dài ${len} hợp lệ. best = ${best}. Thu hẹp l (bỏ ${removed}).`,
        { read: at150(nums, l), ptr: { l: l + 1, r }, ptrNames: ['l', 'r'] });
      sum -= removed;
      l++;
    }
  }
  push(`Xong: chiều dài ngắn nhất = ${best === Infinity ? 0 : best}.`, {}, true);
  return steps;
}

/* ============ 238 Product of Array Except Self ============ */
function trace_product_except_self(input) {
  const { nums } = input;
  const steps = [];
  const n = nums.length;
  const res = new Array(n).fill(1);
  const push = (note, patch, end) => {
    const cells = nums.map((v) => ({ value: v }));
    steps.push(Object.assign({ note, cells, array: nums.slice(), aux: { label: 'ans', values: res.slice() } }, patch, end ? { end: true, answer: res.slice() } : {}));
  };
  push('Ý tưởng: ans[i] = tích các phần tử bên trái × tích các phần tử bên phải. Duyệt 2 lần.', { aux: { label: 'ans', values: res.slice() } });
  let left = 1;
  for (let i = 0; i < n; i++) {
    res[i] = left;
    push(`Lượt trái: ans[${i}] = tích các phần tử nhỏ hơn ${i} = ${left}.`, { read: at150(nums, i), aux: { label: 'ans', values: res.slice() } });
    left *= nums[i];
  }
  let right = 1;
  for (let i = n - 1; i >= 0; i--) {
    res[i] *= right;
    push(`Lượt phải: ans[${i}] *= tích các phần tử lớn hơn ${i} = ${right} → ${res[i]}.`, { read: at150(nums, i), aux: { label: 'ans', values: res.slice() } });
    right *= nums[i];
  }
  push(`Xong: ans = ${res.join(', ')}. Mỗi ans[i] = tích mọi phần tử trừ nums[i] — O(1) phụ.`, {}, true);
  return steps;
}

/* ============ 125 Valid Palindrome ============ */
function trace_valid_palindrome(input) {
  const { s } = input;
  const text = s.toLowerCase().replace(/[^a-z0-9]/g, '');
  const steps = [];
  const push = (note, patch, end) => {
    const cells = text.split('').map((v) => ({ value: v }));
    steps.push(Object.assign({ note, cells, array: text.split('') }, patch, end ? { end: true, answer: true } : {}));
  };
  push(`Lọc chuỗi: giữ chữ & số, viết thường → '${text}'. Giờ kiểm tra palindrome bằng hai con trỏ.`,
    { ptr: { l: 0, r: text.length - 1 }, ptrNames: ['l', 'r'] });
  let l = 0, r = text.length - 1;
  while (l < r) {
    if (text[l] !== text[r]) {
      push(`'${text[l]}' ≠ '${text[r]}' → KHÔNG phải palindrome.`, { read: [at150(text.split(''), l), at150(text.split(''), r)], ptr: { l, r }, ptrNames: ['l', 'r'] }, true);
      steps[steps.length - 1].answer = false;
      return steps;
    }
    push(`'${text[l]}' = '${text[r]}' → tiếp tục thu hẹp.`, { read: [at150(text.split(''), l), at150(text.split(''), r)], ptr: { l: l + 1, r: r - 1 }, ptrNames: ['l', 'r'] });
    l++; r--;
  }
  push('Hai con trỏ gặp nhau → chuỗi là palindrome.', {}, true);
  return steps;
}

/* ============ 392 Is Subsequence ============ */
function trace_is_subsequence(input) {
  const { s, t } = input;
  const steps = [];
  let i = 0, j = 0;
  const push = (note, patch, end) => {
    const cells = t.split('').map((v) => ({ value: v }));
    steps.push(Object.assign({ note, cells, array: t.split('') }, patch, end ? { end: true, answer: i === s.length } : {}));
  };
  push(`Tìm ${s.length ? "mọi ký tự của '"+s+"'" : 'chuỗi rỗng'} trong '${t}' theo thứ tự. i = con trỏ s, j = con trỏ t.`,
    { ptr: { i, j }, ptrNames: ['i', 'j'] });
  while (i < s.length && j < t.length) {
    if (s[i] === t[j]) {
      push(`s[${i}] = '${s[i]}' trùng t[${j}] → khớp! i++, j++.`, { read: at150(t.split(''), j), ptr: { i: i + 1, j: j + 1 }, ptrNames: ['i', 'j'] });
      i++; j++;
    } else {
      push(`s[${i}] = '${s[i]}' ≠ t[${j}] = '${t[j]}' → chỉ tăng j (bỏ qua ký tự trong t).`,
        { read: at150(t.split(''), j), ptr: { i, j: j + 1 }, ptrNames: ['i', 'j'] });
      j++;
    }
  }
  push(i === s.length ? `Đã khớp toàn bộ '${s}' → subsequence.` : `Hết t trước khi khớp hết → không phải subsequence.`, {}, true);
  return steps;
}

/* ============ 167 Two Sum II - Input Array Is Sorted ============ */
function trace_two_sum_ii(input) {
  const { numbers, target } = input;
  const steps = [];
  let l = 0, r = numbers.length - 1;
  const push = (note, patch, end) => {
    const cells = numbers.map((v) => ({ value: v }));
    steps.push(Object.assign({ note, cells, array: numbers.slice() }, patch, end ? { end: true, answer: [l + 1, r + 1] } : {}));
  };
  push(`Mảng đã sắp tăng → bắt đầu l = 0, r = ${r}. Tổng hiện tại: ${numbers[l] + numbers[r]}.`, { ptr: { l, r }, ptrNames: ['l', 'r'] });
  while (l < r) {
    const s = numbers[l] + numbers[r];
    if (s === target) {
      push(`Tổng ${numbers[l]} + ${numbers[r]} = ${target} → đáp án 1-indexed: [${l + 1}, ${r + 1}].`,
        { read: [at150(numbers, l), at150(numbers, r)], ptr: { l, r }, ptrNames: ['l', 'r'] }, true);
      return steps;
    } else if (s < target) {
      l++;
      push(`Tổng ${s} < ${target} → tăng l lên ${l} (cần tổng lớn hơn; mảng tăng nên chỉ còn hướng này).`,
        { read: [at150(numbers, l - 1)], ptr: { l, r }, ptrNames: ['l', 'r'] });
    } else {
      r--;
      push(`Tổng ${s} > ${target} → giảm r xuống ${r}.`,
        { read: [at150(numbers, r + 1)], ptr: { l, r }, ptrNames: ['l', 'r'] });
    }
  }
  push('Không tìm thấy cặp.', {}, true);
  return steps;
}

},{"value":2},{"value":3},{"value":5},{"value":6}],"write":{"dest":5,"value":6},"ptr":{"i":3,"j":3,"w":6},"aux":{"label":"left","values":[1,2,3]},"explain":"Dốc nốt 6 vào nums1[5]."},{"note":"Xong! Ba mảng đã được trộn đúng thứ tự — kết quả là phần trộn của left và nums2.","array":[1,2,2,3,5,6],"cells":[{"value":1},{"value":2},{"value":2},{"value":3},{"value":5},{"value":6}],"end":true,"explain":"Xong: 3 mảng đã trộn — kết quả là hợp của left và nums2."}],"anim":true},{"name":"Nối + sort","time":"O((m+n)·log(m+n))","space":"O(1)","idea":"Đổ nums2 vào đuôi nums1 rồi gọi sort(). Ngắn nhất, đúng tuyệt đối — nhưng không dùng được sự đã sắp của hai nửa.","code":"def merge(nums1, m, nums2, n):\n    nums1[m:] = nums2[:n]\n    nums1.sort()","static":["Đổ toàn bộ nums2 vào phần đuôi nums1 đang chứa 0: nums1[m:] = nums2[:n]","Lúc này nums1 = [1,2,3,2,5,6] — gồm m phần tử cũ + n phần tử mới","Gọi nums1.sort() để sắp xếp lại toàn bộ m+n phần tử","Kết quả: nums1 = [1,2,2,3,5,6] — đã gộp và sắp xếp đúng","Độ phức tạp O((m+n)·log(m+n)) — đơn giản nhưng không dùng được tính 'đã sắp' của hai nửa"],"_pno":"88","steps":[{"note":"Nối nums2 vào sau phần thật của nums1 (các ô xám là ô trống được “lấp đầy”): nums1[m:] = nums2[:n].","array":[1,2,3,2,5,6],"cells":[{"value":1,"dead":null,"write":0},{"value":2,"dead":null,"write":0},{"value":3,"dead":null,"write":0},{"value":2,"dead":"#393f55","write":1},{"value":5,"dead":"#393f55","write":1},{"value":6,"dead":"#393f55","write":1}],"explain":"Nối nums2 vào sau phần thật nums1 (đổ vào các ô trống): nums1 = [1,2,3,2,5,6]."},{"note":"Gọi nums1.sort() — ngôn ngữ tự sắp toàn bộ (Python: Timsort, O((m+n)·log(m+n))).","array":[1,2,3,2,5,6],"cells":[{"value":1,"dead":null,"write":0},{"value":2,"dead":null,"write":0},{"value":3,"dead":null,"write":0},{"value":2,"dead":"#393f55","write":1},{"value":5,"dead":"#393f55","write":1},{"value":6,"dead":"#393f55","write":1}],"std":{"code":"nums1[m:] = nums2[:n]\nnums1.sort()"},"explain":"Gọi sort() — ngôn ngữ tự sắp toàn mảng (Python: Timsort O((m+n)log(m+n)))."},{"note":"(mô phỏng) sort() hoán đổi 2 và 3...","array":[1,2,2,3,5,6],"cells":[{"value":1,"dead":null,"active":false},{"value":2,"dead":null,"active":false},{"value":2,"dead":null,"active":true},{"value":3,"dead":"#393f55","active":true},{"value":5,"dead":"#393f55","active":false},{"value":6,"dead":"#393f55","active":false}],"explain":"Timsort phát hiện phần lớn đã theo thứ tự, chỉ cần đảo chỗ chỗ chen 2,3."},{"note":"Xong — nums1 đã thành mảng sắp xếp hoàn chỉnh. (Thực tế Timsort nhanh hơn mô phỏng này nhiều.)","array":[1,2,2,3,5,6],"cells":[{"value":1,"dead":null,"write":0},{"value":2,"dead":null,"write":0},{"value":2,"dead":null,"write":0},{"value":3,"dead":"#393f55","write":1},{"value":5,"dead":"#393f55","write":1},{"value":6,"dead":"#393f55","write":1}],"std":{"code":"nums1[m:] = nums2[:n]\nnums1.sort()"},"end":true,"k":6,"explain":"Xong: [1,2,2,3,5,6] — ngắn nhất nhưng không dùng được tính sắp sẵn của hai nửa."}],"anim":true}],"thinking":{"forward":"Gộp từ cuối: vùng trống phía sau là nơi an toàn để ghi mà không đè dữ liệu chưa đọc.","reverse":"Cần mảng nums1 đã sắp duy nhất → phải chọn phần tử lớn hơn giữa hai đầu mảng còn lại, lùi từ cuối về."},"note":"Ghi từ cuối: vùng trống phía sau nums1 là nơi an toàn để ghi, không đè dữ liệu chưa đọc."},{"no":"27","title":"Remove Element","cat":"Array / String","diff":"Easy","statement":"Bỏ mọi phần tử bằng val trong nums (in-place, thứ tự tự do), trả về k = số phần tử ≠ val; k phần tử đầu phải chứa chúng.","examples":"nums=[3,2,2,3], val=3 → k=2, nums=[2,2,…]","keyIdea":"Mẫu slow/fast: con trỏ đọc chạy nhanh hơn con trỏ ghi, vùng prefix luôn là kết quả.","approaches":[{"name":"Hai con trỏ ghi đè","time":"O(n)","space":"O(1)","idea":"r duyệt; gặp nums[r] != val thì ghi vào nums[w] và tăng w. Cuối cùng w == k. Giữ thứ tự tương đối.","code":"def remove_element(nums, val):\n    w = 0\n    for r in range(len(nums)):\n        if nums[r] != val:\n            nums[w] = nums[r]; w += 1\n    return w","tcex":{"input":{"nums":[3,2,2,3],"val":3},"kind":"array","display":"nums","ptrs":["w","r"],"expected":2,"anim":true},"_pno":"27","steps":[{"note":"w (slow) = 0: vị trí sẽ ghi, r (fast) chạy từng phần tử.","cells":[{"value":3,"keep":false},{"value":2,"keep":false},{"value":2,"keep":false},{"value":3,"keep":false}],"array":[3,2,2,3],"explain":"w=0 (nơi sẽ ghi các phần tử giữ lại), r duyệt cả mảng."},{"note":"nums[0] = 3 = val → BỎ QUA, không ghi.","cells":[{"value":3,"keep":false},{"value":2,"keep":false},{"value":2,"keep":false},{"value":3,"keep":false}],"array":[3,2,2,3],"read":{"target":[0],"value":3},"ptr":{"w":0,"r":0},"ptrNames":["w","r"],"explain":"nums[0]=3 = val → bỏ qua, không ghi."},{"note":"nums[1] = 2 ≠ 3 → ghi 2 vào nums[0], tăng w.","cells":[{"value":2,"keep":true},{"value":2,"keep":false},{"value":2,"keep":false},{"value":3,"keep":false}],"array":[2,2,2,3],"read":{"target":[1],"value":2},"write":{"dest":0,"value":2},"ptr":{"w":1,"r":1},"ptrNames":["w","r"],"explain":"nums[1]=2 ≠ 3 → ghi 2 vào nums[0], w=1."},{"note":"nums[2] = 2 ≠ 3 → ghi 2 vào nums[1], tăng w.","cells":[{"value":2,"keep":true},{"value":2,"keep":true},{"value":2,"keep":false},{"value":3,"keep":false}],"array":[2,2,2,3],"read":{"target":[2],"value":2},"write":{"dest":1,"value":2},"ptr":{"w":2,"r":2},"ptrNames":["w","r"],"explain":"nums[2]=2 ≠ 3 → ghi 2 vào nums[1], w=2."},{"note":"nums[3] = 3 = val → BỎ QUA, không ghi.","cells":[{"value":2,"keep":true},{"value":2,"keep":true},{"value":2,"keep":false},{"value":3,"keep":false}],"array":[2,2,2,3],"read":{"target":[3],"value":3},"ptr":{"w":2,"r":3},"ptrNames":["w","r"],"explain":"nums[3]=3 = val → bỏ qua."},{"note":"Xong! w = 2 — đó chính là số phần tử ≠ val (k).","cells":[{"value":2,"keep":true},{"value":2,"keep":true},{"value":2,"keep":false},{"value":3,"keep":false}],"array":[2,2,2,3],"ptr":{"w":2,"r":3},"ptrNames":["w","r"],"end":true,"k":2,"explain":"Xong: w=2 = k — số phần tử ≠ val; các số được giữ đúng thứ tự."}],"anim":true},{"name":"Đổi chỗ với phần tử cuối","time":"O(n)","space":"O(1)","idea":"Gặp nums[l] == val thì hoán với nums[r] và thu hẹp r; không tăng l vì phần tử mới cần kiểm tra lại. Không giữ thứ tự.","code":"def remove_element(nums, val):\n    l, r = 0, len(nums) - 1\n    while l <= r:\n        if nums[l] == val:\n            nums[l], nums[r] = nums[r], nums[l]\n            r -= 1\n        else:\n            l += 1\n    return l","tcex":{"input":{"nums":[3,2,2,3],"val":3},"kind":"array","display":"nums","ptrs":["l","r"],"expected":2,"anim":true},"_pno":"27","steps":[{"note":"Hai con trỏ: l duyệt từ trái, r là “bức tường” cuối mảng.","cells":[{"value":3,"keep":false},{"value":2,"keep":false},{"value":2,"keep":false},{"value":3,"keep":false}],"array":[3,2,2,3],"explain":"l duyệt từ trái, r là biên cuối của vùng cần kiểm tra."},{"note":"nums[0] = 3 = val → đổi chỗ với nums[3] = 3 rồi thu hẹp r (l giữ nguyên để kiểm tra giá trị mới).","cells":[{"value":3,"keep":false},{"value":2,"keep":false},{"value":2,"keep":false},{"value":3,"keep":false}],"array":[3,2,2,3],"read":[{"target":[0],"value":3},{"target":[3],"value":3}],"swap":[0,3],"ptr":{"l":0,"r":2},"ptrNames":["l","r"],"explain":"nums[0]=3=val → đổi với nums[3]=3, r về 2. l giữ nguyên vì giá trị mới còn phải kiểm tra."},{"note":"nums[0] = 3 = val → đổi chỗ với nums[2] = 2 rồi thu hẹp r (l giữ nguyên để kiểm tra giá trị mới).","cells":[{"value":2,"keep":false},{"value":2,"keep":false},{"value":3,"keep":false},{"value":3,"keep":false}],"array":[2,2,3,3],"read":[{"target":[0],"value":2},{"target":[2],"value":3}],"swap":[0,2],"ptr":{"l":0,"r":1},"ptrNames":["l","r"],"explain":"nums[0]=3=val → đổi với nums[2]=2, r về 1."},{"note":"nums[0] = 2 ≠ val → l tiến lên (giữ lại).","cells":[{"value":2,"keep":false},{"value":2,"keep":false},{"value":3,"keep":false},{"value":3,"keep":false}],"array":[2,2,3,3],"read":{"target":[0],"value":2},"ptr":{"l":1,"r":1},"ptrNames":["l","r"],"explain":"nums[0]=2 ≠ val → giữ lại, l=1 otate(nums, k):\n    n = len(nums); k %= n\n    if not k: return\n    def rev(lo, hi):\n        while lo < hi:\n            nums[lo], nums[hi] = nums[hi], nums[lo]\n            lo += 1; hi -= 1\n    rev(0, n-1); rev(0, k-1); rev(k, n-1)","tcex":{"input":{"nums":[1,2,3,4,5,6,7],"k":3},"kind":"array","display":"nums","ptrs":["lo","hi"],"expected":null,"anim":true},"_pno":"189","steps":[{"note":"k = 3 → quy về k' = 3 (mod n). Bây giờ xoay PHẢI 3 bước.","cells":[{"value":1},{"value":2},{"value":3},{"value":4},{"value":5},{"value":6},{"value":7}],"array":[1,2,3,4,5,6,7],"explain":"Tiếp tục chuỗi đảo."},{"note":"Bước 1 — đảo TOÀN BỘ mảng [0..6]: các phần tử cuối (sẽ đi đầu) chui lên phía trước.","cells":[{"value":1},{"value":2},{"value":3},{"value":4},{"value":5},{"value":6},{"value":7}],"array":[1,2,3,4,5,6,7],"explain":"Tiếp tục chuỗi đảo."},{"note":"(Đảo toàn bộ) đổi chỗ nums[0] ↔ nums[6].","cells":[{"value":1},{"value":2},{"value":3},{"value":4},{"value":5},{"value":6},{"value":7}],"array":[1,2,3,4,5,6,7],"swap":[0,6],"ptr":{"lo":0,"hi":6},"ptrNames":["lo","hi"],"explain":"Tiếp tục chuỗi đảo."},{"note":"(Đảo toàn bộ) đổi chỗ nums[1] ↔ nums[5].","cells":[{"value":7},{"value":2},{"value":3},{"value":4},{"value":5},{"value":6},{"value":1}],"array":[7,2,3,4,5,6,1],"swap":[1,5],"ptr":{"lo":1,"hi":5},"ptrNames":["lo","hi"],"explain":"Tiếp tục chuỗi đảo."},{"note":"(Đảo toàn bộ) đổi chỗ nums[2] ↔ nums[4].","cells":[{"value":7},{"value":6},{"value":3},{"value":4},{"value":5},{"value":2},{"value":1}],"array":[7,6,3,4,5,2,1],"swap":[2,4],"ptr":{"lo":2,"hi":4},"ptrNames":["lo","hi"],"explain":"Tiếp tục chuỗi đảo."},{"note":"Bước 2 — đảo nửa trái [0..2]: trả các phần tử sẽ đứng đầu về đúng thứ tự.","cells":[{"value":7},{"value":6},{"value":5},{"value":4},{"value":3},{"value":2},{"value":1}],"array":[7,6,5,4,3,2,1],"explain":"Tiếp tục chuỗi đảo."},{"note":"(Đảo nửa trái) đổi chỗ nums[0] ↔ nums[2].","cells":[{"value":7},{"value":6},{"value":5},{"value":4},{"value":3},{"value":2},{" hật buy; ngược lại so profit với giá − buy. Đúng vì mua trước bán sau được tự đảm bảo bằng thứ tự duyệt.","code":"def max_profit(prices):\n    buy, profit = prices[0], 0\n    for p in prices[1:]:\n        if p < buy: buy = p\n        else: profit = max(profit, p - buy)\n    return profit","tcex":{"input":{"prices":[7,1,5,3,6,4]},"kind":"array","display":"prices","ptrs":["buy","profit"],"expected":5,"anim":true},"_pno":"121","steps":[{"read":[{"target":0,"value":7}],"note":"Đọc 7 — buy, profit = prices[0], 0","line":2,"array":[7,1,5,3,6,4],"explain":"buy = giá ngày đầu (7), profit = 0 — chưa giao dịch."},{"read":[{"target":"slice[1:None]","value":null}],"ptr":{"buy":7,"profit":0},"note":"Đọc ∅; buy→7; profit→0 — for p in prices[1:]:","line":3,"array":[7,1,5,3,6,4],"explain":"Duyệt p=1: nếu rẻ hơn buy thì chuyển ngày mua, ngược lại tính lãi."},{"ptr":{"buy":7,"profit":0},"note":"buy→7; profit→0 — if p < buy: buy = p","line":4,"array":[7,1,5,3,6,4],"explain":"1 < 7 → buy = 1: mua rẻ hơn luôn có lợi, vì lãi sẽ tính từ mức này."},{"ptr":{"buy":1,"profit":0},"note":"buy→1; profit→0 — for p in prices[1:]:","line":3,"array":[7,1,5,3,6,4],"explain":"Duyệt p=5 — thử bán ở mức này xem sao."},{"ptr":{"buy":1,"profit":0},"note":"buy→1; profit→0 — if p < buy: buy = p","line":4,"array":[7,1,5,3,6,4],"explain":"5 ≥ 1 → không cần đổi ngày mua (đã rẻ nhất)."},{"ptr":{"buy":1,"profit":0},"note":"buy→1; profit→0 — else: profit = max(profit, p - buy)","line":5,"array":[7,1,5,3,6,4],"explain":"Lãi 5−1 = 4 → profit = max(0, 4) = 4."},{"ptr":{"buy":1,"profit":4},"note":"buy→1; profit→4 — for p in prices[1:]:","line":3,"array":[7,1,5,3,6,4],"explain":"Duyệt p=3 — giá tụt xuống nhưng vẫn trên 1."},{"ptr":{"buy":1,"profit":4},"note":"buy→1; profit→4 — if p < buy: buy = p","line":4,"array":[7,1,5,3,6,4],"explain":"3 ≥ 1 → giữ ngày mua; chưa đổi."},{"ptr":{"buy":1,"profit":4},"note":"buy→1; profit→4 — else: profit = max(profit, p - buy)","line":5,"array":[7,1,5,3,6,4],"explain":"Lãi 3−1 = 2 < 4 g mở rộng được → False"],"_pno":"55","steps":[{"note":"Bắt đầu từ ô 0: frontier = {0}, seen = {0}"},{"note":"Với mỗi ô i trong frontier, mọi ô j trong (i, i+nums[i]] đều nhảy tới được"},{"note":"Từ ô 0 (nums[0]=2) tới được các ô 1, 2 — đưa vào seen và frontier kế"},{"note":"Lần lượt: từ ô 1 (nums[1]=3) tới 2..4, từ ô 2 (nums[2]=1) tới 3, từ ô 3 (nums[3]=1) tới 4"},{"note":"Khi mở rộng tới ô cuối (j == len(nums)-1) thì trả True; hết frontier mà chưa tới → False"},{"note":"Kiểm tra lại [3,2,1,0,4]: từ 0 tới 1,2; từ 1 tới 2,3; ô 3 (nums=0) không mở rộng được → False"}],"anim":false}],"thinking":{"forward":"Duyệt giữ maxReach: nếu i vượt maxReach nghĩa là mắc kẹt.","reverse":"Cần đến cuối → bất kỳ bước nào kéo xa được nhất đều đủ, không cần chọn cụ thể."},"note":"Chỉ cần theo dõi 'xa nhất có thể tới' (reach); i vượt reach là hết cửa."},{"no":"45","title":"Jump Game II","cat":"Array / String","diff":"Medium","statement":"Như Jump Game nhưng bắt buộc tới được cuối; trả số bước nhảy tối thiểu.","examples":"[2,3,1,1,4] → 2 (nhảy tới 1, rồi tới cuối) · [2,3,0,1,4] → 2","keyIdea":"Mỗi 'lớp' bước nhảy là toàn bộ vùng đạt được từ lớp trước — đếm lớp.","approaches":[{"name":"Greedy BFS theo tầng","time":"O(n)","space":"O(1)","idea":"curEnd = cuối vùng đạt được với bước hiện tại; far = xa nhất vùng kế. Chạm curEnd thì +1 bước, curEnd = far.","code":"def jump(nums):\n    jumps = cur_end = far = 0\n    for i in range(len(nums)-1):\n        far = max(far, i + nums[i])\n        if i == cur_end:\n            jumps += 1; cur_end = far\n    return jumps","tcex":{"input":{"nums":[2,3,1,1,4]},"kind":"array","display":"nums","ptrs":["i","cur_end","far"],"expected":2,"anim":true},"_pno":"45","steps":[{"note":"jumps = cur_end = far = 0","line":2,"array":[2,3,1,1,4],"explain":"jumps = cur_end = far = 0 — chưa nhảy; biên của 'tầng' hiện tại là 0."},{"ptr":{"cur_end":0,"far":0},"note":"cur_end→0; far→0 — for i in range(len(nums)-1):","line":3,"array":[2,3,1,1,4],"explain":"Duyệt từng ô (bỏ ô cu 4: bắt đầu tầng mới."},{"ptr":{"i":2,"cur_end":4,"far":4},"note":"i→2; cur_end→4 — for i in range(len(nums)-1):","line":3,"array":[2,3,1,1,4],"explain":"Duyệt từng ô (bỏ ô cuối vì không cần nhảy từ đó)."},{"read":[{"target":3,"value":1}],"ptr":{"i":3,"cur_end":4,"far":4},"note":"Đọc 1; i→3; cur_end→4 — far = max(far, i + nums[i])","line":4,"array":[2,3,1,1,4],"explain":"i=3: far = max(4, 3+1 = 4) — xa nhất có thể chạm từ các ô đã xét của tầng này."},{"ptr":{"i":3,"cur_end":4,"far":4},"note":"i→3; cur_end→4 — if i == cur_end:","line":5,"array":[2,3,1,1,4],"explain":"i=3 còn trong tầng (biên 4), chưa cần đếm thêm bước."},{"ptr":{"i":3,"cur_end":4,"far":4},"note":"i→3; cur_end→4 — for i in range(len(nums)-1):","line":3,"array":[2,3,1,1,4],"explain":"Duyệt từng ô (bỏ ô cuối vì không cần nhảy từ đó)."},{"ptr":{"i":3,"cur_end":4,"far":4},"note":"i→3; cur_end→4 — return jumps — Kết thúc — đáp án: 2 ✓ (khớp kỳ vọng)","line":7,"array":[2,3,1,1,4],"end":true,"answer":2,"explain":"return jumps = 2 — từ 0 nhảy tới vùng [1..2], rồi phủ tới đích."}],"anim":true},{"name":"BFS tường minh","time":"O(n)","space":"O(1)","idea":"Đếm số lần mở rộng frontier cho tới khi chạm ô cuối.","code":"def jump(nums):\n    if len(nums) <= 1: return 0\n    frontier, far, jumps = {0}, 0, 0\n    while frontier:\n        nxt = set()\n        for i in frontier:\n            far = max(far, i + nums[i])\n            if far >= len(nums)-1: return jumps+1\n            for j in range(i+1, far+1): nxt.add(j)\n        jumps += 1; frontier = nxt\n    return jumps","static":["nums=[2,3,1,1,4], bắt đầu frontier = {0}, số bước nhảy jumps = 0","Lượt 1: từ ô 0 (nums[0]=2) tới được các ô 1, 2; far = 2 — còn dưới ô cuối (4)","Lượt 2: frontier = {1, 2}; từ ô 1 (nums[1]=3) ta có far = 4 ≥ n-1 → dừng","Quay về jumps + 1 = 2 — số bước nhảy tối thiểu","Mỗi lượt mở rộng hết vùng đạt được ứng với đúng một bước nhảy"],"_pno":"45","steps":[{"note":"nums=[2,3,1,1,4], bắt đầu frontier = {0}, số bước nhảy jumps = 0"},{"note":"Lượ nting sort (bucket)","time":"O(n)","space":"O(n)","idea":"Nhóm các giá trị ≥ n vào một bucket; đếm từ n xuống 0, cộng dồn số bài.","code":"def h_index(citations):\n    n = len(citations)\n    bucket = [0]*(n+1)\n    for c in citations:\n        bucket[min(c, n)] += 1\n    total = 0\n    for h in range(n, -1, -1):\n        total += bucket[h]\n        if total >= h: return h\n    return 0","tcex":{"input":{"citations":[3,0,6,1,5]},"kind":"array","display":"citations","ptrs":["h","total"],"expected":3,"anim":true},"_pno":"274","steps":[{"note":"n = len(citations)","line":2,"array":[3,0,6,1,5],"explain":"n = 5 — h-index không thể vượt số bài nên chỉ cần bucket 0..5."},{"note":"bucket = [0]*(n+1)","line":3,"array":[3,0,6,1,5],"explain":"bucket = [0]*(n+1) — 6 ô, mỗi ô đếm số bài có đúng mức trích dẫn đó."},{"note":"for c in citations:","line":4,"array":[3,0,6,1,5],"explain":"for c in citations: đưa từng bài vào bucket thích hợp."},{"note":"bucket[min(c, n)] += 1","line":5,"array":[3,0,6,1,5],"explain":"bucket[min(c, 5)] += 1 — mọi giá trị > 5 dồn chung một ô 5 (vì chỉ cần biết ≥ h)."},{"note":"for c in citations:","line":4,"array":[3,0,6,1,5],"explain":"for c in citations: đưa từng bài vào bucket thích hợp."},{"note":"bucket[min(c, n)] += 1","line":5,"array":[3,0,6,1,5],"explain":"bucket[min(c, 5)] += 1 — mọi giá trị > 5 dồn chung một ô 5 (vì chỉ cần biết ≥ h)."},{"note":"for c in citations:","line":4,"array":[3,0,6,1,5],"explain":"for c in citations: đưa từng bài vào bucket thích hợp."},{"note":"bucket[min(c, n)] += 1","line":5,"array":[3,0,6,1,5],"explain":"bucket[min(c, 5)] += 1 — mọi giá trị > 5 dồn chung một ô 5 (vì chỉ cần biết ≥ h)."},{"note":"for c in citations:","line":4,"array":[3,0,6,1,5],"explain":"for c in citations: đưa từng bài vào bucket thích hợp."},{"note":"bucket[min(c, n)] += 1","line":5,"array":[3,0,6,1,5],"explain":"bucket[min(c, 5)] += 1 — mọi giá trị > 5 dồn chung một ô 5 (vì chỉ cần biết ≥ h)."},{"note":"for c in citations:","line":4,"array":[3,0 "time":"O(n·log n)","space":"O(1)","idea":"Tìm h lớn nhất thoả điều kiện bằng tìm kiếm nhị phân trên miền [0, n].","code":"def h_index(citations):\n    lo, hi = 0, len(citations)\n    while lo < hi:\n        mid = (lo + hi + 1) // 2\n        if sum(c >= mid for c in citations) >= mid: lo = mid\n        else: hi = mid - 1\n    return lo","tcex":{"input":{"citations":[3,0,6,1,5]},"kind":"array","display":"citations","ptrs":["lo","hi"],"expected":3,"anim":true},"_pno":"274","steps":[{"note":"lo, hi = 0, len(citations)","line":2,"array":[3,0,6,1,5],"explain":"Tìm h trên miền [0..5] — h-index không thể vượt số bài."},{"ptr":{"lo":0,"hi":5},"note":"lo→0; hi→5 — while lo < hi:","line":3,"array":[3,0,6,1,5],"explain":"while lo < hi: còn khoảng nghi ngờ [0, 5]."},{"ptr":{"lo":0,"hi":5},"note":"lo→0; hi→5 — mid = (lo + hi + 1) // 2","line":4,"array":[3,0,6,1,5],"explain":"mid = (0+5+1)//2 = 3 — thiên về phải để tìm h LỚN nhất."},{"ptr":{"lo":0,"hi":5},"note":"lo→0; hi→5 — if sum(c >= mid for c in citations) >= mid: lo = mid","line":5,"array":[3,0,6,1,5],"explain":"Kiểm tra mid = 3: số bài có trích dẫn ≥ 3 có ≥ 3 không?"},{"ptr":{"lo":3,"hi":5},"note":"lo→3; hi→5 — while lo < hi:","line":3,"array":[3,0,6,1,5],"explain":"while lo < hi: còn khoảng nghi ngờ [3, 5]."},{"ptr":{"lo":3,"hi":5},"note":"lo→3; hi→5 — mid = (lo + hi + 1) // 2","line":4,"array":[3,0,6,1,5],"explain":"mid = (3+5+1)//2 = 4 — thiên về phải để tìm h LỚN nhất."},{"ptr":{"lo":3,"hi":5},"note":"lo→3; hi→5 — if sum(c >= mid for c in citations) >= mid: lo = mid","line":5,"array":[3,0,6,1,5],"explain":"Kiểm tra mid = 4: số bài có trích dẫn ≥ 4 có ≥ 4 không?"},{"ptr":{"lo":3,"hi":5},"note":"lo→3; hi→5 — else: hi = mid - 1","line":6,"array":[3,0,6,1,5],"explain":"Thỏa → lo = mid: h-index tối thiểu là 4, tìm tiếp bên phải."},{"ptr":{"lo":3,"hi":3},"note":"lo→3; hi→3 — while lo < hi:","line":3,"array":[3,0,6,1,5],"explain":"while lo < hi: còn khoảng nghi ngờ [3, 3]."},{"ptr":{"lo":3,"hi":3},"note":"lo→3; hi→3 — return lo — Kết thúc — đáp án: 3 ✓ (khớp kỳ vọng)","line":7,"array":[3,0,6,1,5],"end":true,"answer":3,"explain":"Không thỏa → hi = mid−1: 4 quá lớn, thu về bên trái."}],"anim":true}],"thinking":{"forward":"Sắp xếp giảm dần, tìm i lớn nhất sao cho papers[i] ≥ i+1.","reverse":"Cần h-chỉ số → đếm bài có trích dẫn ≥ k, k lớn nhất thoả điều kiện."},"note":"Sort giảm dần rồi đếm h khi citations[h] > h."},{"no":"380","title":"Insert Delete GetRandom O(1)","cat":"Array / String","diff":"Medium","statement":"Thiết kế RandomizedSet: insert, remove, getRandom đều O(1) trung bình. getRandom trả phần tử ngẫu nhiên đều xác suất.","examples":"insert(1)→true, remove(2)→false, insert(2)→true, getRandom()→1 hoặc 2","keyIdea":"Mảng + dict vị trí: xoá bằng cách thay phần tử bị xoá bằng phần tử cuối.","approaches":[{"name":"Mảng + dict vị trí","time":"O(1) trung bình","space":"O(n)","idea":"vals chứa dữ liệu, pos[v] = chỉ số. Xoá: đưa phần tử cuối vào chỗ vừa xoá rồi pop — O(1). getRandom lấy index ngẫu nhiên.","code":"import random as r\nclass RandomizedSet:\n    def __init__(self):\n        self.vals = []; self.pos = {}\n    def insert(self, v):\n        if v in self.pos: return False\n        self.pos[v] = len(self.vals); self.vals.append(v)\n        return True\n    def remove(self, v):\n        if v not in self.pos: return False\n        i = self.pos[v]\n        last = self.vals[-1]\n        self.vals[i], self.pos[last] = last, i\n        self.vals.pop(); del self.pos[v]\n        return True\n    def getRandom(self):\n        return self.vals[r.randrange(len(self.vals))]","static":["Khởi tạo: self.vals = [] (mảng chứa phần tử), self.pos = {} (giá trị → chỉ số)","insert(v): nếu v đã có trả False; ngược lại nối vào cuối vals và lưu pos[v] = chỉ số mới","Ví dụ: insert(1) → vals=[1], pos={1:0}; insert(2) → vals=[1,2], pos={1:0,2:1}","remove(v): lấy i = pos[v], chép phần tử cuối vào vị trí i rồi pop cuối — xoá O(1) theo kiểu 'thay bằng phần tử cuối'","Ví dụ remove(1): vals=[2] (phần tử cuối 2 1","keyIdea":"Nếu tổng gas < tổng cost thì vô vọng; ngược lại luôn có điểm khởi hành, và greedy từ trái sang là đủ.","approaches":[{"name":"Greedy một lượt","time":"O(n)","space":"O(1)","idea":"Nếu tank < 0 ở trạm i, mọi điểm khởi hành trong [start..i] đều thất bại → thử từ i+1.","code":"def can_complete_circuit(gas, cost):\n    if sum(gas) < sum(cost): return -1\n    start = tank = 0\n    for i in range(len(gas)):\n        tank += gas[i] - cost[i]\n        if tank < 0:\n            start, tank = i + 1, 0\n    return start","tcex":{"input":{"gas":[1,2,3,4,5],"cost":[3,4,5,1,2]},"kind":"array","display":"gas","aux":["cost"],"ptrs":["i","start"],"expected":3,"anim":true},"_pno":"134","steps":[{"note":"if sum(gas) < sum(cost): return -1","line":2,"array":[1,2,3,4,5],"explain":"Nếu tổng gas < tổng cost thì chạy hết vòng là bất khả thi — dừng ngay."},{"note":"start = tank = 0","line":3,"array":[1,2,3,4,5],"explain":"start = 0, tank = 0 — thử khởi hành từ trạm 0."},{"ptr":{"start":0},"note":"start→0 — for i in range(len(gas)):","line":4,"array":[1,2,3,4,5],"explain":"for i: đi qua từng trạm theo thứ tự."},{"read":[{"target":0,"value":1},{"target":0,"value":3}],"ptr":{"i":0,"start":0},"note":"So sánh 1 vs 3; i→0; start→0 — tank += gas[i] - cost[i]","line":5,"array":[1,2,3,4,5],"explain":"Trạm 0: tank += gas[0] − cost[0] = 1-3 = -2."},{"ptr":{"i":0,"start":0},"note":"i→0; start→0 — if tank < 0:","line":6,"array":[1,2,3,4,5],"explain":"tank = None: âm là bị 'chết máy' giữa đường."},{"ptr":{"i":0,"start":0},"note":"i→0; start→0 — start, tank = i + 1, 0","line":7,"array":[1,2,3,4,5],"explain":"start = i+1, tank = 0 — mọi điểm khởi hành trong [start..i] đều hỏng, thử ngay sau i."},{"ptr":{"i":0,"start":1},"note":"i→0; start→1 — for i in range(len(gas)):","line":4,"array":[1,2,3,4,5],"explain":"for i: đi qua từng trạm theo thứ tự."},{"read":[{"target":1,"value":2},{"target":1,"value":4}],"ptr":{"i":1,"start":1},"note":"So sánh 2 vs 4; i→1; start→1 — tank += gas[i] - cost[i]","li , 3, … (up += 1); trên sườn giảm: 1, 2, 3, … (down += 1)"},{"note":"Đỉnh núi nhận max của hai sườn: khi lên cộng up; khi xuống cộng down + (1 nếu down vượt peak)"},{"note":"Không cần mảng phụ — chỉ giữ up, down, peak bằng O(1)"},{"note":"Với [1,0,2] đáp án đúng là 5 ([2,1,2]); lưu ý biến thể này cần xử lý đỉnh chính xác"}],"anim":false}],"thinking":{"forward":"Hai lượt: trái→phải đảm bảo kẹo tăng, phải→trái xử lý kẹo giảm.","reverse":"Cần kẹo tối thiểu → mỗi đứa phải thoả 2 ràng buộc kề trái và kề phải, tách làm 2 lượt."},"note":"Hai lượt: trái→phải đảm bảo quan hệ tăng; phải→trái củng cố quan hệ giảm."},{"no":"42","title":"Trapping Rain Water","cat":"Array / String","diff":"Hard","statement":"Cho heights của các cột địa hình. Tính lượng nước mưa bị giữ giữa các cột.","examples":"[0,1,0,2,1,0,1,3,2,1,2,1] → 6","keyIdea":"Nước tại cột i = min(cao nhất trái, cao nhất phải) − height[i] (nếu dương).","approaches":[{"name":"Prefix/suffix max","time":"O(n)","space":"O(n)","idea":"left[i] = max chiều cao trước i; right[i] = max sau i. Nước = Σ max(0, min(left,right) − h).","code":"def trap(height):\n    n = len(height)\n    left = [0]*n; right = [0]*n\n    left[0] = height[0]\n    for i in range(1, n): left[i] = max(left[i-1], height[i])\n    right[n-1] = height[n-1]\n    for i in range(n-2, -1, -1): right[i] = max(right[i+1], height[i])\n    return sum(max(0, min(left[i], right[i]) - height[i]) for i in range(n))","tcex":{"input":{"height":[0,1,0,2,1,0,1,3,2,1,2,1]},"kind":"array","display":"height","ptrs":["i"],"expected":6,"anim":true},"_pno":"42","steps":[{"note":"n = len(height)","line":2,"array":[0,1,0,2,1,0,1,3,2,1,2,1],"explain":"Mỗi cột chỉ giữ được nước khi cả hai bên đều có tường cao hơn nó."},{"note":"left = [0]*n; right = [0]*n","line":3,"array":[0,1,0,2,1,0,1,3,2,1,2,1],"explain":"left[] = max chiều cao tới i; right[] = max chiều cao từ i về sau."},{"read":[{"target":0,"value":0}],"note":"Đọc 0 — left[0] = height[0]","line":4,"array":[0,1,0,2,1,0,1,3,2,1,2,1] 10 + 100 - 1 + 5 = 1994"],"_pno":"13","steps":[{"note":"Bảng giá trị: M = {I:1, V:5, X:10, L:50, C:100, D:500, M:1000}"},{"note":"Duyệt s từ trái: nếu M[ch] < M[ch kế tiếp] → đây là ký tự TRỪ, total -= value"},{"note":"Ngược lại total += value — ký tự CỘNG thông thường"},{"note":"MCMXCIV: M(1000) + CM(100<1000 → -100) + M(1000>=900) + XC(10<100 → -10) + C(100) + IV(1<5 → -1) + V(5)"},{"note":"Tổng = 1000 - 100 + 1000 - 10 + 100 - 1 + 5 = 1994"}],"anim":false},{"name":"Ưu tiên cặp trừ (2 ký tự)","time":"O(n)","space":"O(1)","idea":"Duyệt với bảng 2-ký-tự trước, 1-ký-tự sau — gần với cách đọc chuẩn.","code":"P = [('CM',900),('CD',400),('XC',90),('XL',40),('IX',9),('IV',4)]\nM = {'I':1,'V':5,'X':10,'L':50,'C':100,'D':500,'M':1000}\ndef roman_to_int(s):\n    total = i = 0\n    while i < len(s):\n        for sym, v in P:\n            if s.startswith(sym, i):\n                total += v; i += 2; break\n        else:\n            total += M[s[i]]; i += 1\n    return total","static":["Bảng cặp 2 ký tự theo thứ tự đặc biệt: [('CM',900),('CD',400),('XC',90),('XL',40),('IX',9),('IV',4)]","Tại mỗi vị trí i, thử bắt cặp 2 ký tự: s.startswith(sym, i) — khớp thì cộng giá trị cặp và i += 2","Không khớp cặp nào thì cộng giá trị 1 ký tự trong M và i += 1","Với MCMXCIV: M(1000) → CM(900) → XC(90) → IV(4): num = 1000 + 900 + 90 + 4 = 1994","Gần với cách đọc chuẩn (ưu tiên cặp trừ trước), O(n)"],"_pno":"13","steps":[{"note":"Bảng cặp 2 ký tự theo thứ tự đặc biệt: [('CM',900),('CD',400),('XC',90),('XL',40),('IX',9),('IV',4)]"},{"note":"Tại mỗi vị trí i, thử bắt cặp 2 ký tự: s.startswith(sym, i) — khớp thì cộng giá trị cặp và i += 2"},{"note":"Không khớp cặp nào thì cộng giá trị 1 ký tự trong M và i += 1"},{"note":"Với MCMXCIV: M(1000) → CM(900) → XC(90) → IV(4): num = 1000 + 900 + 90 + 4 = 1994"},{"note":"Gần với cách đọc chuẩn (ưu tiên cặp trừ trước), O(n)"}],"anim":false},{"name":"Quét phải qua trái","time":"O(n)","space":"O(1)","idea":"Từ phải: cộng khi ≥ ký tự trước đó (theo hướng phải), trừ khi nhỏ hơn.","code":"M = {'I':1,'V':5,'X':10,'L':50,'C':100,'D':500,'M':1000}\ndef roman_to_int(s):\n    total = M[s[-1]]\n    for i in range(len(s)-2, -1, -1):\n        total += M[s[i]] if M[s[i]] >= M[s[i+1]] else -M[s[i]]\n    return total","static":["Bắt đầu từ ký tự cuối: total = M[s[-1]]","Đi ngược về trái: ký tự TRƯỚC nhỏ hơn ký tự bên phải → TRỪ; ngược lại → CỘNG","MCMXCIV: V(5) → I(1<5, trừ 1 → 4) → C(100≥1, cộng → 104) → X(10<100, trừ 10 → 94)","Tiếp: M(1000≥10, cộng → 1094) → C(100<1000, trừ 100 → 994) → M(1000≥100, cộng → 1994)","Tổng = 1994 — quy tắc trừ luôn là ký tự TRƯỚC nhỏ hơn ký tự SAU theo chiều đọc"],"_pno":"13","steps":[{"note":"Bắt đầu từ ký tự cuối: total = M[s[-1]]"},{"note":"Đi ngược về trái: ký tự TRƯỚC nhỏ hơn ký tự bên phải → TRỪ; ngược lại → CỘNG"},{"note":"MCMXCIV: V(5) → I(1<5, trừ 1 → 4) → C(100≥1, cộng → 104) → X(10<100, trừ 10 → 94)"},{"note":"Tiếp: M(1000≥10, cộng → 1094) → C(100<1000, trừ 100 → 994) → M(1000≥100, cộng → 1994)"},{"note":"Tổng = 1994 — quy tắc trừ luôn là ký tự TRƯỚC nhỏ hơn ký tự SAU theo chiều đọc"}],"anim":false}],"thinking":{"forward":"Duyệt từ trái: chữ số nhỏ đứng trước chữ số lớn → trừ, ngược lại cộng.","reverse":"Cần giá trị La Mã → đọc từng ký tự, so với ký tự kế để quyết cộng hay trừ."},"note":"Nếu ký tự nhỏ hơn ký tự sau → trừ; ngược lại cộng."},{"no":"12","title":"Integer to Roman","cat":"Array / String","diff":"Medium","statement":"Chuyển số nguyên (1..3999) sang chuỗi La Mã.","examples":"3749 → MMMDCCXLIX · 58 → LVIII · 1994 → MCMXCIV","keyIdea":"Bảng giá trị giảm dần kèm symbol; trừ dần.","approaches":[{"name":"Bảng giảm dần + trừ","time":"O(1)","space":"O(1)","idea":"VALS = [(1000,'M'),(900,'CM'),(500,'D'),(400,'CD'),(100,'C'),(90,'XC'),(50,'L'),(40,'XL'),(10,'X'),(9,'IX'),(5,'V'),(4,'IV'),(1,'I')]. Lặp, trừ số lớn nhất ≤ num.","code":"VALS = [(1000,'M'),(900,'CM'),(500,'D'),(400,'CD'),(100,'C'),(90,'XC'),(50,'L'),(40,'XL'),(10,'X'),(9,'IX'),(5,'V'),(4,'IV'),(1,'I')]\ndef int_to_roman(num):\n    out = []\n    for v, s in VALS:\n        while num >= v:\n            out.append(s); num -= v\n    return ''.join(out)","static":["Bảng giá trị giảm dần: [(1000,'M'),(900,'CM'),(500,'D'),(400,'CD'),(100,'C'),(90,'XC'),(50,'L'),(40,'XL'),(10,'X'),(9,'IX'),(5,'V'),(4,'IV'),(1,'I')]","Với num=1994, lấy symbol giá trị lớn nhất ≤ num: 1000 → ghi 'M', num = 994","Tiếp tục: 900 → 'CM', num = 94","Qua bảng: 90 → 'XC', rồi 4 → 'IV', num = 0","Kết quả 'M' + 'CM' + 'XC' + 'IV' = 'MCMXCIV' — O(1) vì bảng cố định"],"_pno":"12","steps":[{"note":"Bảng giá trị giảm dần: [(1000,'M'),(900,'CM'),(500,'D'),(400,'CD'),(100,'C'),(90,'XC'),(50,'L'),(40,'XL'),(10,'X'),(9,'IX'),(5,'V'),(4,'IV'),(1,'I')]"},{"note":"Với num=1994, lấy symbol giá trị lớn nhất ≤ num: 1000 → ghi 'M', num = 994"},{"note":"Tiếp tục: 900 → 'CM', num = 94"},{"note":"Qua bảng: 90 → 'XC', rồi 4 → 'IV', num = 0"},{"note":"Kết quả 'M' + 'CM' + 'XC' + 'IV' = 'MCMXCIV' — O(1) vì bảng cố định"}],"anim":false},{"name":"Trừ từng chữ số","time":"O(1)","space":"O(1)","idea":"Chia theo hàng nghìn/trăm/chục/đơn vị, mỗi hàng một bảng nhỏ — dễ viết bằng tay khi không nhớ bảng đầy đủ.","code":"def int_to_roman(num):\n    th = ['','M','MM','MMM']\n    hu = ['','C','CC','CCC','CD','D','DC','DCC','DCCC','CM']\n    te = ['','X','XX','XXX','XL','L','LX','LXX','LXXX','XC']\n    un = ['','I','II','III','IV','V','VI','VII','VIII','IX']\n    return th[num//1000] + hu[(num%1000)//100] + te[(num%100)//10] + un[num%10]","static":["Tách num=1994 theo hàng: nghìn 1, trăm 9, chục 9, đơn vị 4","Tra bảng hàng nghìn: 1 → 'M'","Hàng trăm 9 → 'CM'; hàng chục 9 → 'XC'; hàng đơn vị 4 → 'IV'","Nối: 'M' + 'CM' + 'XC' + 'IV' = 'MCMXCIV'","Không cần vòng lặp — mỗi hàng tra bảng cố định, tổng O(1)"],"_pno":"12","steps":[{"note":"Tách num=1994 theo hàng: nghìn 1, trăm 9, chục 9, đơn vị 4"},{"note":"Tra bảng hàng nghìn: 1 → 'M'"},{"note":"Hàng trăm 9 → 'CM'; hàng chục 9 → 'XC'; hàng đơn vị 4 → 'IV'"},{"note":"Nối: 'M' + 'CM' + 'XC' + 'IV' = 'MCMXCIV'"},{"note":"Không cần vòng lặp — mỗi hàng tra bảng cố định, tổng O(1)"}],"anim":false},{"name":"Đệ quy","time":"O(log n)","space":"O(log n)","idea":"Giảm về bài toán con: int_to_roman(num - largest) + symbol của largest.","code":"V = [(1000,'M'),(900,'CM'),(500,'D'),(400,'CD'),(100,'C'),(90,'XC'),(50,'L'),(40,'XL'),(10,'X'),(9,'IX'),(5,'V'),(4,'IV'),(1,'I')]\ndef int_to_roman(num):\n    if num == 0: return ''\n    for v, s in V:\n        if num >= v:\n            return s + int_to_roman(num - v)","static":["Hàm int_to_roman(num): nếu num == 0 trả chuỗi rỗng","Tìm symbol có giá trị lớn nhất ≤ num (duyệt bảng V giảm dần)","Ghép: s + int_to_roman(num − v) — bài toán con giảm dần tới 0","Với num=1994: 'M' + int_to_roman(994) → 'M'+'CM'+int_to_roman(94) → 'M'+'CM'+'XC'+'IV'+''","Chiều sâu đệ quy ≈ số symbol ra (tối đa ~15) — O(log n)"],"_pno":"12","steps":[{"note":"Hàm int_to_roman(num): nếu num == 0 trả chuỗi rỗng"},{"note":"Tìm symbol có giá trị lớn nhất ≤ num (duyệt bảng V giảm dần)"},{"note":"Ghép: s + int_to_roman(num − v) — bài toán con giảm dần tới 0"},{"note":"Với num=1994: 'M' + int_to_roman(994) → 'M'+'CM'+int_to_roman(94) → 'M'+'CM'+'XC'+'IV'+''"},{"note":"Chiều sâu đệ quy ≈ số symbol ra (tối đa ~15) — O(log n)"}],"anim":false}],"thinking":{"forward":"Chia dần cho 1000→1, dùng mảng ánh xạ giá trị→ký tự.","reverse":"Cần chuỗi La Mã → phân rã số thành các bậc nghìn/trăm/chục/đơn vị rồi nối ký tự tương ứng."},"note":"Bảng giá trị giảm dần kèm symbol; trừ dần."},{"no":"58","title":"Length of Last Word","cat":"Array / String","diff":"Easy","statement":"Chuỗi gồm từ và khoảng trắng; trả độ dài từ cuối cùng.","examples":"Hello World → 5 · '   fly me   to   the moon  ' → 4","keyIdea":"strip() và split() — nhưng phỏng vấn hay hỏi bản không dùng split.","approaches":[{"name":"split","time":"O(n)","space":"O(n)","idea":"s.strip().split()[-1].","code":"def length_of_last_word(s):\n    return len(s.strip().split()[-1])","static":["s = 'Hello World', gọi s.strip().split() → ['Hello', 'World']","split() tách theo mọi khoảng trắng và tự bỏ trắng thừa ở hai đầu","Lấy phần tử cuối 'World' — len = 5","Trả về 5; O(n) thời gian, O(n) bộ nhớ"],"_pno":"58","steps":[{"note":"s = 'Hello World', gọi s.strip().split() → ['Hello', 'World']"},{"note":"split() tách theo mọi khoảng trắng và tự bỏ trắng thừa ở hai đầu"},{"note":"Lấy phần tử cuối 'World' — len = 5"},{"note":"Trả về 5; O(n) thời gian, O(n) bộ nhớ"}],"anim":false},{"name":"Quét ngược","time":"O(n)","space":"O(1)","idea":"Bỏ khoảng trắng cuối, đếm ký tự tới khoảng trắng đầu tiên đi lùi.","code":"def length_of_last_word(s):\n    n = len(s); i = n - 1\n    while i >= 0 and s[i] == ' ': i -= 1\n    j = i\n    while j >= 0 and s[j] != ' ': j -= 1\n    return i - j","static":["Đi từ cuối chuỗi, bỏ qua các khoảng trắng cuối: i lùi tới ký tự khác trắng","Từ i lùi tiếp tới khi gặp khoảng trắng hoặc hết chuỗi: ghi lại j","Độ dài từ cuối = i − j","Ví dụ '   fly me   to   the moon  ': đếm từ 'n' về 'm' = 4","Không tạo mảng phụ — O(1) bộ nhớ, O(n) thời gian"],"_pno":"58","steps":[{"note":"Đi từ cuối chuỗi, bỏ qua các khoảng trắng cuối: i lùi tới ký tự khác trắng"},{"note":"Từ i lùi tiếp tới khi gặp khoảng trắng hoặc hết chuỗi: ghi lại j"},{"note":"Độ dài từ cuối = i − j"},{"note":"Ví dụ '   fly me   to   the moon  ': đếm từ 'n' về 'm' = 4"},{"note":"Không tạo mảng phụ — O(1) bộ nhớ, O(n) thời gian"}],"anim":false},{"name":"Dùng regex","time":"O(n)","space":"O(1)","idea":"re.search(r'\\S+$', s) — gọn, ít dùng trong phỏng vấn.","code":"import re\ndef length_of_last_word(s):\n    m = re.search(r'\\S+$', s)\n    return len(m.group(0)) if m else 0","static":["re.search(r'\\S+$', s) tìm chuỗi ký tự không-khoảng-trắng dính tới hết chuỗi","Với 'Hello World' khớp 'World' → group(0) = 'World'","Trả len('World') = 5","Lưu ý: nếu chuỗi toàn khoảng trắng thì m = None — phải có nhánh trả 0"],"_pno":"58","steps":[{"note":"re.search(r'\\S+$', s) tìm chuỗi ký tự không-khoảng-trắng dính tới hết chuỗi"},{"note":"Với 'Hello World' khớp 'World' → group(0) = 'World'"},{"note":"Trả len('World') = 5"},{"note":"Lưu ý: nếu chuỗi toàn khoảng trắng thì m = None — phải có nhánh trả 0"}],"anim":false}],"thinking":{"forward":"Đếm từ cuối bỏ qua khoảng trắng, rồi đếm ký tự đến khoảng trắng tiếp.","reverse":"Cần độ dài từ cuối → không cần duyệt cả chuỗi, chỉ cần phần đuôi."},"note":"strip() và split() — nhưng phỏng vấn hay hỏi bản không dùng split."},{"no":"14","title":"Longest Common Prefix","cat":"Array / String","diff":"Easy","statement":"Tìm tiền tố chung dài nhất của mảng chuỗi (rỗng nếu không có).","examples":"[\"flower\",\"flow\",\"flight\"] → \"fl\" · [\"dog\",\"racecar\",\"car\"] → \"\"","keyIdea":"So sánh theo từng ký tự cột — ngừng ở ký tự đầu khác biệt.","approaches":[{"name":"Khởi tạo từ chuỗi đầu, cắt dần","time":"O(S)","space":"O(1)","idea":"pre = strs[0]; với mỗi chuỗi, cắt pre tới khi là tiền tố.","code":"def longest_common_prefix(strs):\n    if not strs: return ''\n    pre = strs[0]\n    for s in strs[1:]:\n        while not s.startswith(pre):\n            pre = pre[:-1]\n    return pre","tcex":{"input":{"strs":["flower","flow","flight"]},"kind":"array","display":"strs","ptrs":["pre"],"expected":"fl","anim":true},"_pno":"14","steps":[{"note":"if not strs: return ''","line":2,"array":["flower","flow","flight"],"explain":"Chuỗi rỗng → tiền tố chung mặc định rỗng."},{"read":[{"target":0,"value":"flower"}],"note":"Đọc flower — pre = strs[0]","line":3,"array":["flower","flow","flight"],"explain":"pre = strs[0] = 'flower' — dùng chuỗi đầu làm ứng viên ban đầu."},{"read":[{"target":"slice[1:None]","value":null}],"ptr":{"pre":"flower"},"note":"Đọc ∅; pre→flower — for s in strs[1:]:","line":4,"array":["flower","flow","flight"],"explain":"for s: so từng chuỗi còn lại với pre hiện tại."},{"ptr":{"pre":"flower"},"note":"pre→flower — while not s.startswith(pre):","line":5,"array":["flower","flow","flight"],"explain":"Chuỗi s chưa bắt đầu bằng pre → cắt bớt pre."},{"ptr":{"pre":"flower"},"note" e":"a, b = lcp(strs[:mid]), lcp(strs[mid:])","line":4,"array":["flower","flow","flight"],"explain":"Đệ quy lấy lcp nửa trái ('flower') và nửa phải ('flow','flight')."},{"note":"if len(strs) == 1: return strs[0]","line":2,"array":["flower","flow","flight"],"explain":"1 chuỗi → chính nó là tiền tố chung, dừng đệ quy."},{"note":"i = 0","line":5,"array":["flower","flow","flight"],"explain":"i = 0 — so ký tự từng cột của hai chuỗi lcp."},{"ptr":{"i":0},"note":"i→0 — while i < min(len(a), len(b)) and a[i] == b[i]: i += 1","line":6,"array":["flower","flow","flight"],"explain":"a[0] == b[0] → tăng i — các ký tự đầu khớp nhau."},{"ptr":{"i":2},"note":"i→2 — return a[:i]","line":7,"array":["flower","flow","flight"],"explain":"return a[:i] = 'fl' — cắt tại chỗ khác nhau đầu tiên."},{"note":"i = 0","line":5,"array":["flower","flow","flight"],"explain":"i = 0 — so ký tự từng cột của hai chuỗi lcp."},{"ptr":{"i":0},"note":"i→0 — while i < min(len(a), len(b)) and a[i] == b[i]: i += 1","line":6,"array":["flower","flow","flight"],"explain":"a[0] == b[0] → tăng i — các ký tự đầu khớp nhau."},{"ptr":{"i":2},"note":"i→2 — return a[:i] — Kết thúc — đáp án: fl ✓ (khớp kỳ vọng)","line":7,"array":["flower","flow","flight"],"end":true,"answer":"fl","explain":"return a[:i] = 'fl' — cắt tại chỗ khác nhau đầu tiên."}],"anim":true}],"thinking":{"forward":"So sánh theo cột: lấy tiền tố chung của cặp đầu rồi rút ngắn dần.","reverse":"Cần tiền tố chung lớn nhất → bắt đầu từ chuỗi ngắn nhất, cắt dần cho tới khi khớp mọi chuỗi."},"note":"So sánh theo từng ký tự cột — ngừng ở ký tự đầu khác biệt."},{"no":"151","title":"Reverse Words in a String","cat":"Array / String","diff":"Medium","statement":"Đảo thứ tự các từ trong chuỗi; nhiều khoảng trắng co về một; bỏ trắng đầu cuối.","examples":"\"the sky is blue\" → \"blue is sky the\" · \"a good   example\" → \"example good a\"","keyIdea":"split() mặc định tách theo mọi khoảng trắng — đảo danh sách là xong.","approaches":[{"name":"split + đảo","time":"O(n)","space":"O(n)","idea":"words = s.split(); return ' '.join(reversed(words)).","code":"def reverse_words(s):\n    return ' '.join(reversed(s.split()))","static":["s = 'the sky is blue' → s.split() = ['the','sky','is','blue'] (tách theo mọi khoảng trắng)","reversed(words) đảo thứ tự danh sách từ","' '.join(...) nối lại bằng đúng một khoảng trắng giữa các từ","Kết quả 'blue is sky the' — tự co nhiều khoảng trắng về một và bỏ trắng hai đầu"],"_pno":"151","steps":[{"note":"s = 'the sky is blue' → s.split() = ['the','sky','is','blue'] (tách theo mọi khoảng trắng)"},{"note":"reversed(words) đảo thứ tự danh sách từ"},{"note":"' '.join(...) nối lại bằng đúng một khoảng trắng giữa các từ"},{"note":"Kết quả 'blue is sky the' — tự co nhiều khoảng trắng về một và bỏ trắng hai đầu"}],"anim":false},{"name":"Quét ngược không split","time":"O(n)","space":"O(n)","idea":"Đi từ cuối, gom từng từ vào kết quả — bản 'thủ công' khi bị hỏi không dùng hàm.","code":"def reverse_words(s):\n    out, i, n = [], len(s)-1, len(s)\n    while i >= 0:\n        while i >= 0 and s[i] == ' ': i -= 1\n        j = i\n        while i >= 0 and s[i] != ' ': i -= 1\n        if j > i: out.append(s[i+1:j+1])\n    return ' '.join(out)","static":["Đi từ cuối chuỗi, bỏ qua khoảng trắng cuối (i lùi tới ký tự khác trắng)","Từ j = i lùi để bao trọn một từ (tới khoảng trắng đầu tiên đi ngược)","Cắt s[i+1:j+1] và thêm vào danh sách out theo thứ tự ngược","Ví dụ 'the sky is blue': gom 'blue', 'is', 'sky', 'the' → nối bằng ' ' → 'blue is sky the'","Không dùng split() — hữu ích khi được hỏi bản thủ công"],"_pno":"151","steps":[{"note":"Đi từ cuối chuỗi, bỏ qua khoảng trắng cuối (i lùi tới ký tự khác trắng)"},{"note":"Từ j = i lùi để bao trọn một từ (tới khoảng trắng đầu tiên đi ngược)"},{"note":"Cắt s[i+1:j+1] và thêm vào danh sách out theo thứ tự ngược"},{"note":"Ví dụ 'the sky is blue': gom 'blue', 'is', 'sky', 'the' → nối bằng ' ' → 'blue is sky the'"},{"note":"Không dùng split() — hữu ích khi được hỏi bản thủ công"}],"anim":false},{"name":"Regex bắt từ","time":"O(n)","space":"O(n)","idea":"re.findall(r'\\S+', s)[::-1] — gọn, style thư viện.","code":"import re\ndef reverse_words(s):\n    return ' '.join(re.findall(r'\\S+', s)[::-1])","static":["re.findall(r'\\S+', s) gom mọi từ (chuỗi liên tục ký tự không-trắng) thành danh sách","Đảo ngược danh sách bằng [::-1]","' '.join(...) → 'blue is sky the'","Ngắn gọn một dòng, tự xử lý khoảng trắng thừa và hai đầu"],"_pno":"151","steps":[{"note":"re.findall(r'\\S+', s) gom mọi từ (chuỗi liên tục ký tự không-trắng) thành danh sách"},{"note":"Đảo ngược danh sách bằng [::-1]"},{"note":"' '.join(...) → 'blue is sky the'"},{"note":"Ngắn gọn một dòng, tự xử lý khoảng trắng thừa và hai đầu"}],"anim":false}],"thinking":{"forward":"Tách theo khoảng trắng, lọc rỗng, đảo danh sách, nối lại.","reverse":"Cần đảo thứ tự từ → tách chuỗi thành token rồi đảo mảng token."},"note":"split() mặc định tách theo mọi khoảng trắng — đảo danh sách là xong."},{"no":"6","title":"Zigzag Conversion","cat":"Array / String","diff":"Medium","statement":"Viết chuỗi theo đường zigzag numRows hàng rồi đọc từng hàng.","examples":"s='PAYPALISHIRING', numRows=3 → 'PAHNAPLSIIGYIR' · numRows=4 → 'PINALSIGYAHRPI'","keyIdea":"Mô phỏng con trỏ lên/xuống giữa các hàng — không cần biết trước vị trí.","approaches":[{"name":"Mô phỏng hướng đi","time":"O(n)","space":"O(n)","idea":"rows = [[]]*numRows; i, down = 0, 1; với mỗi ch: append vào rows[i], đổi hướng ở biên.","code":"def convert(s, numRows):\n    if numRows == 1: return s\n    rows = [[] for _ in range(numRows)]\n    i, down = 0, 1\n    for ch in s:\n        rows[i].append(ch)\n        if i == 0: down = 1\n        elif i == numRows-1: down = -1\n        i += down\n    return ''.join(''.join(r) for r in rows)","static":["Khởi tạo numRows dòng rỗng, con trỏ dòng i = 0, hướng down = 1","Lần lượt đặt từng ký tự vào rows[i]; đổi hướng khi chạm biên (i==0 → xuống, i==numRows-1 → lên)","Với s='PAYPALISHIRING', numRows=3: rows[0]='PAHN', rows[1]='APLSIIG', rows[2]='YIR'","Đọc lại từng dòng: 'PAHN' + 'APLSIIG' + 'YIR' = 'PAHNAPLSIIGYIR'","Không cần biết trước cột — vừa đi vừa đặt, độ phức tạp O(n)"],"_pno":"6","steps":[{"note":"Khởi tạo numRows dòng rỗng, con trỏ dòng i = 0, hướng down = 1"},{"note":"Lần lượt đặt từng ký tự vào rows[i]; đổi hướng khi chạm biên (i==0 → xuống, i==numRows-1 → lên)"},{"note":"Với s='PAYPALISHIRING', numRows=3: rows[0]='PAHN', rows[1]='APLSIIG', rows[2]='YIR'"},{"note":"Đọc lại từng dòng: 'PAHN' + 'APLSIIG' + 'YIR' = 'PAHNAPLSIIGYIR'"},{"note":"Không cần biết trước cột — vừa đi vừa đặt, độ phức tạp O(n)"}],"anim":false},{"name":"Vị trí theo chu kỳ","time":"O(n)","space":"O(n)","idea":"Chu kỳ = 2·numRows − 2; hàng của ký tự thứ k tính theo k mod cycle — công thức trực tiếp.","code":"def convert(s, numRows):\n    if numRows == 1: return s\n    cycle = 2*numRows - 2\n    rows = [[] for _ in range(numRows)]\n    for k, ch in enumerate(s):\n        m = k % cycle\n        rows[min(m, cycle - m)].append(ch)\n    return ''.join(''.join(r) for r in rows)","static":["Chu kỳ cycle = 2·numRows − 2 = 4 cho numRows=3","Hàng của ký tự thứ k tính theo m = k % cycle: row = min(m, cycle − m)","PAYPALISHIRING: k=0→hàng0(P), k=1→hàng1(A), k=2→hàng2(Y), k=3→hàng1(P), k=4→hàng0(A)…","Đọc theo hàng: hàng0=PAHN, hàng1=APLSIIG, hàng2=YIR → 'PAHNAPLSIIGYIR'","Công thức trực tiếp cho mỗi ký tự — O(n) thời gian, O(n) bộ nhớ"],"_pno":"6","steps":[{"note":"Chu kỳ cycle = 2·numRows − 2 = 4 cho numRows=3"},{"note":"Hàng của ký tự thứ k tính theo m = k % cycle: row = min(m, cycle − m)"},{"note":"PAYPALISHIRING: k=0→hàng0(P), k=1→hàng1(A), k=2→hàng2(Y), k=3→hàng1(P), k=4→hàng0(A)…"},{"note":"Đọc theo hàng: hàng0=PAHN, hàng1=APLSIIG, hàng2=YIR → 'PAHNAPLSIIGYIR'"},{"note":"Công thức trực tiếp cho mỗi ký tự — O(n) thời gian, O(n) bộ nhớ"}],"anim":false},{"name":"Vẽ ma trận","time":"O(n·numRows)","space":"O(n·numRows)","idea":"Điền vào grid numRows×n rồi đọc theo hàng — trực quan nhất, tốn bộ nhớ.","code":"def convert(s, numRows):\n    if numRows == 1: return s\n    grid = [['']*len(s) for _ in range(numRows)]\n    r, c, down = 0, 0, 1\n    for ch in s:\n        grid[r][c] = ch\n        if r == 0: down = 1\n        elif r == numRows-1: down = -1\n        r += down; c += 1 if down == -1 else 0\n    return ''.join(''.join(row) for row in grid)","static":["Lập grid numRows × len(s) toàn ô rỗng; điền theo đường zigzag (r, c)","Rẽ xuống khi r==0, rẽ lên khi r==numRows-1; c tăng khi đi lên","Đọc từng hàng bỏ qua ô rỗng để có chuỗi kết quả","Ví dụ 'ABC', numRows=2: cột đi xuống A rồi lên B (c+1), xuống C → đọc 'ACB'","Trực quan nhất nhưng tốn O(n·numRows) bộ nhớ"],"_pno":"6","steps":[{"note":"Lập grid numRows × len(s) toàn ô rỗng; điền theo đường zigzag (r, c)"},{"note":"Rẽ xuống khi r==0, rẽ lên khi r==numRows-1; c tăng khi đi lên"},{"note":"Đọc từng hàng bỏ qua ô rỗng để có chuỗi kết quả"},{"note":"Ví dụ 'ABC', numRows=2: cột đi xuống A rồi lên B (c+1), xuống C → đọc 'ACB'"},{"note":"Trực quan nhất nhưng tốn O(n·numRows) bộ nhớ"}],"anim":false}],"thinking":{"forward":"Viết theo cột zigzag: đi xuống rồi chéo lên giữa các hàng.","reverse":"Cần chuỗi theo từng hàng → theo dõi hàng hiện tại và hướng đi, nối ký tự vào đúng hàng."},"note":"Mô phỏng con trỏ lên/xuống giữa các hàng — không cần biết trước vị trí."},{"no":"28","title":"Find the Index of the First Occurrence in a String","cat":"Array / String","diff":"Easy","statement":"Tìm chỉ số xuất hiện đầu tiên của needle trong haystack, không có → -1.","examples":"sadbutsad / sad → 0 · leetcode / leeto → -1","keyIdea":"Vét cạn từng vị trí với slice — đủ nhanh với ràng buộc nhỏ.","approaches":[{"name":"Vét cạn slice","time":"O(n·m)","space":"O(1)","idea":"So sánh haystack[i:i+len(needle)] với needle tại mọi i hợp lệ.","code":"def str_str(hay, ned):\n    m = len(ned)\n    for i in range(len(hay) - m + 1):\n        if hay[i:i+m] == ned: return i\n    return -1","static":["hay='sadbutsad', ned='sad' (m=3). Xét các vị trí i hợp lệ trái sang phải","So sánh hay[i:i+m] với ned: i=0 → 'sad' == 'sad' → trả về 0","Haystack có thể chứa nhiều lần — trả lần xuất hiện đầu tiên bên trái","Không trùng thì duyệt tiếp; hết vị trí hợp lệ → trả -1","So sánh slice O(m) mỗi vị trí → tổng O(n·m)"],"_pno":"28","steps":[{"note":"hay='sadbutsad', ned='sad' (m=3). Xét các vị trí i hợp lệ trái sang phải"},{"note":"So sánh hay[i:i+m] với ned: i=0 → 'sad' == 'sad' → trả về 0"},{"note":"Haystack có thể chứa nhiều lần — trả lần xuất hiện đầu tiên bên trái"},{"note":"Không trùng thì duyệt tiếp; hết vị trí hợp lệ → trả -1"},{"note":"So sánh slice O(m) mỗi vị trí → tổng O(n·m)"}],"anim":false},{"name":"KMP","time":"O(n+m)","space":"O(m)","idea":"Tính hàm tiền tố của needle để nhảy khi mismatch — đáng nhớ cho phỏng vấn khó.","code":"def str_str(hay, ned):\n    if not ned: return 0\n    lps = [0]*len(ned)\n    j = 0\n    for i in range(1, len(ned)):\n        while j and ned[i] != ned[j]: j = lps[j-1]\n        if ned[i] == ned[j]: j += 1\n        lps[i] = j\n    j = 0\n    for i, ch in enumerate(hay):\n        while j and ch != ned[j]: j = lps[j-1]\n        if ch == ned[j]: j += 1\n        if j == len(ned): return i - j + 1\n    return -1","static":["Xây bảng LPS(pattern) = độ dài tiền tố trùng hậu tố dài nhất","Với 'sad': lps = [0,0,0] — không có tiền tố trùng hậu tố","Duyệt haystack; khi MISMATCH, nhảy j theo lps[j-1] thay vì quay lại từ đầu","Ví dụ: khớp 'sad' đủ 3 ký tự → trả i − j + 1 = 0","Mỗi ký tự haystack chỉ bị duyệt vài lần → O(n+m)"],"_pno":"28","steps":[{"note":"Xây bảng LPS(pattern) = độ dài tiền tố trùng hậu tố dài nhất"},{"note":"Với 'sad': lps = [0,0,0] — không có tiền tố trùng hậu tố"},{"note":"Duyệt haystack; khi MISMATCH, nhảy j theo lps[j-1] thay vì quay lại từ đầu"},{"note":"Ví dụ: khớp 'sad' đủ 3 ký tự → trả i − j + 1 = 0"},{"note":"Mỗi ký tự haystack chỉ bị duyệt vài lần → O(n+m)"}],"anim":false},{"name":"find() chuẩn","time":"O(n·m) trung bình","space":"O(1)","idea":"Python có sẵn str.find — tối ưu C, đúng mọi trường hợp.","code":"def str_str(hay, ned):\n    return hay.find(ned)","static":["Python str.find trả chỉ số xuất hiện đầu tiên của chuỗi con, không có thì -1","hay.find('sad') = 0 — khớp ngay từ đầu","Cài bằng C bên trong (thuật toán hai chiều) — nhanh trong thực tế","Ngắn nhất về mã; độ phức tạp trung bình thấp, chịu được ràng buộc nhỏ"],"_pno":"28","steps":[{"note":"Python str.find trả chỉ số xuất hiện đầu tiên của chuỗi con, không có thì -1"},{"note":"hay.find('sad') = 0 — khớp ngay từ đầu"},{"note":"Cài bằng C bên trong (thuật toán hai chiều) — nhanh trong thực tế"},{"note":"Ngắn nhất về mã; độ phức tạp trung bình thấp, chịu được ràng buộc nhỏ"}],"anim":false}],"thinking":{"forward":"So khớp từng vị trí i, so sánh đoạn con với needle.","reverse":"Cần chỉ số xuất hiện đầu tiên → thử mọi vị trí bắt đầu, so sánh k ký tự."},"note":"Vét cạn từng vị trí với slice — đủ nhanh với ràng buộc nhỏ."},{"no":"53","title":"Maximum Subarray","cat":"Kadane's Algorithm","diff":"Medium","statement":"Dãy con liên tiếp có tổng lớn nhất.","examples":"[-2,1,-3,4,-1,2,1,-5,4] → 6 ([4,-1,2,1])","keyIdea":"Kadane: hoặc nối vào dãy hiện tại, hoặc bắt đầu lại từ chính nó — chọn theo tổng.","approaches":[{"name":"Kadane","time":"O(n)","space":"O(1)","idea":"cur = max(x, cur+x); best = max(best, cur).","code":"def max_sub_array(nums):\n    best = cur = nums[0]\n    for x in nums[1:]:\n        cur = max(x, cur + x)\n        best = max(best, cur)\n    return best","tcex":{"input":{"nums":[-2,1,-3,4,-1,2,1,-5,4]},"kind":"array","display":"nums","ptrs":["cur","best"],"expected":6,"anim":true},"_pno":"53","steps":[{"read":[{"target":0,"value":-2}],"note":"Đọc -2 — best = cur = nums[0]","line":2,"array":[-2,1,-3,4,-1,2,1,-5,4],"explain":"best = cur = nums[0] = −2 — khởi tạo bằng phần tử đầu."},{"read":[{"target":"slice[1:None]","value":null}],"ptr":{"cur":-2,"best":-2},"note":"Đọc ∅; cur→-2; best→-2 — for x in nums[1:]:","line":3,"array":[-2,1,-3,4,-1,2,1,-5,4],"explain":"for x: duyệt c
