1 — s += nums[j]","line":6,"array":[1,1,1],"explain":"Đọc/so sánh 1 để quyết định bước đi i=1"},{"ptr":{"i":1,"j":1},"note":"i→1; j→1 — if s == k:","line":7,"array":[1,1,1],"explain":"Con trỏ i dịch tới 1 — phạm vi xét được thu hẹp"},{"ptr":{"i":1,"j":1},"note":"i→1; j→1 — for j in range(i, len(nums)):","line":5,"array":[1,1,1],"explain":"Con trỏ i dịch tới 1 — phạm vi xét được thu hẹp"},{"read":[{"target":2,"value":1}],"ptr":{"i":1,"j":2},"note":"Đọc 1; i→1; j→2 — s += nums[j]","line":6,"array":[1,1,1],"explain":"Đọc/so sánh 1 để quyết định bước đi i=1"},{"ptr":{"i":1,"j":2},"note":"i→1; j→2 — if s == k:","line":7,"array":[1,1,1],"explain":"Con trỏ i dịch tới 1 — phạm vi xét được thu hẹp"},{"ptr":{"i":1,"j":2},"note":"i→1; j→2 — ans += 1","line":8,"array":[1,1,1],"explain":"ans += 1 — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"i":1,"j":2},"note":"i→1; j→2 — for j in range(i, len(nums)):","line":5,"array":[1,1,1],"explain":"Con trỏ i dịch tới 1 — phạm vi xét được thu hẹp"},{"ptr":{"i":1,"j":2},"note":"i→1; j→2 — for i in range(len(nums)):","line":3,"array":[1,1,1],"explain":"Con trỏ i dịch tới 1 — phạm vi xét được thu hẹp"},{"ptr":{"i":2,"j":2},"note":"i→2; j→2 — s = 0","line":4,"array":[1,1,1],"explain":"Con trỏ i dịch tới 2 — phạm vi xét được thu hẹp"},{"ptr":{"i":2,"j":2},"note":"i→2; j→2 — for j in range(i, len(nums)):","line":5,"array":[1,1,1],"explain":"Con trỏ i dịch tới 2 — phạm vi xét được thu hẹp"},{"read":[{"target":2,"value":1}],"ptr":{"i":2,"j":2},"note":"Đọc 1; i→2; j→2 — s += nums[j]","line":6,"array":[1,1,1],"explain":"Đọc/so sánh 1 để quyết định bước đi i=2"},{"ptr":{"i":2,"j":2},"note":"i→2; j→2 — if s == k:","line":7,"array":[1,1,1],"explain":"Con trỏ i dịch tới 2 — phạm vi xét được thu hẹp"},{"ptr":{"i":2,"j":2},"note":"i→2; j→2 — for j in range(i, len(nums)):","line":5,"array":[1,1,1],"explain":"Con trỏ i dịch tới 2 — phạm vi xét được thu hẹp"},{"ptr":{"i":2,"j":2},"note":"i→2; j→2 — for i in range(len(nums)):","line":3,"array":[1,1,1],"explain":"Con trỏ i dịch tới 2 — phạm vi xét được thu hẹp"},{"ptr":{"i":2,"j":2},"note":"i→2; j→2 — return ans — Kết thúc — đáp án: 2 ✓ (khớp kỳ vọng)","line":9,"array":[1,1,1],"end":true,"answer":2,"explain":"→ Đáp án: 2 i=2"}],"anim":true},{"name":"Prefix + vét cặp (giảng dạy)","time":"O(n²)","space":"O(n)","idea":"Xây pref = [0, a0, a0+a1, ...]; mọi cặp (i, j) với pref[j]−pref[i] == k là một đoạn — giúp thấy rõ công thức hiệu prefix.","code":"def subarray_sum(nums, k):\n    pref = [0]\n    for x in nums:\n        pref.append(pref[-1] + x)\n    ans = 0\n    for i in range(len(pref)):\n        for j in range(i + 1, len(pref)):\n            if pref[j] - pref[i] == k:\n                ans += 1\n    return ans","static":["Xây pref = [0, 1, 2, 3] với nums = [1,1,1].","Tổng đoạn [l..r] = pref[r+1] − pref[l].","Duyệt mọi cặp (i, j) với i < j: pref[j]−pref[i] == 2.","Cặp (0,2): 2−0=2 ✓; cặp (1,3): 3−1=2 ✓ → ans = 2.","O(n²) — dùng để hiểu công thức trước khi rút gọn bằng dict."],"_pno":"560","steps":[{"note":"Xây pref = [0, 1, 2, 3] với nums = [1,1,1]."},{"note":"Tổng đoạn [l..r] = pref[r+1] − pref[l]."},{"note":"Duyệt mọi cặp (i, j) với i < j: pref[j]−pref[i] == 2."},{"note":"Cặp (0,2): 2−0=2 ✓; cặp (1,3): 3−1=2 ✓ → ans = 2."},{"note":"O(n²) — dùng để hiểu công thức trước khi rút gọn bằng dict."}],"anim":false}]},{"no":"705","title":"Design HashSet","cat":"Hashmap","diff":"Easy","statement":"Thiết kế cấu trúc dữ liệu hỗ trợ add(key), remove(key), contains(key) — không lặp phần tử.","examples":"add(1),add(2),contains(1)→true,contains(3)→false,add(2),contains(2)→true,remove(2),contains(2)→false","keyIdea":"Bảng băm thật sự: mảng buckets; key % size chọn xô, mỗi xô là list chống va chạm; add kiểm tra trùng.","thinking":{"forward":"Băm key xuống chỉ số xô, tìm trong xô (list nhỏ) — thêm nếu chưa có, xoá nếu có, kiểm tra sự hiện diện.","reverse":"Muốn add/remove/contains nhanh → phải định vị được 'nơi chứa' của key trong O(1) trung bình: băm khoá xuống xô rồi tìm tuần tự trong xô."},"note":"Đây là bài 'thiết kế' nên mô phỏng bảng băm (bucket + modulo) thay vì dùng set sẵn có — nếu chỉ dùng set thì phức tạp 'thiết kế' không còn nghĩa; python set/hash cũng là hash table nên các thao tác đều trung bình O(1).","approaches":[{"name":"Bucket + modulo (% key)","time":"O(1) trung bình","space":"O(n)","idea":"size xô (vd 16); key % size chọn xô; add/remove/contains chỉ thao tác trên xô đó.","code":"class MyHashSet:\n    def __init__(self, size=16):\n        self.buckets = [[] for _ in range(size)]\n    def _hash(self, key):\n        return key % len(self.buckets)\n    def add(self, key):\n        b = self.buckets[self._hash(key)]\n        if key not in b:\n            b.append(key)\n    def remove(self, key):\n        b = self.buckets[self._hash(key)]\n        if key in b:\n            b.remove(key)\n    def contains(self, key):\n        return key in self.buckets[self._hash(key)]","static":["Khởi tạo MyHashSet(): buckets = 16 xô rỗng.","add(1): 1 % 16 = 1 → xô 1, chưa có → thêm. Xô 1 = [1].","add(2): 2 % 16 = 2 → xô 2, thêm. Xô 2 = [2].","contains(1): băm 1 → xô 1 có 1 → true.","contains(3): 3 % 16 = 3, xô 3 rỗng → false.","add(2): xô 2 đã có 2 → không thêm lại (chống trùng).","remove(2): xô 2 bỏ 2 → rỗng.","contains(2): xô 2 rỗng → false — đúng yêu cầu chuỗi."],"_pno":"705","steps":[{"note":"Khởi tạo MyHashSet(): buckets = 16 xô rỗng."},{"note":"add(1): 1 % 16 = 1 → xô 1, chưa có → thêm. Xô 1 = [1]."},{"note":"add(2): 2 % 16 = 2 → xô 2, thêm. Xô 2 = [2]."},{"note":"contains(1): băm 1 → xô 1 có 1 → true."},{"note":"contains(3): 3 % 16 = 3, xô 3 rỗng → false."},{"note":"add(2): xô 2 đã có 2 → không thêm lại (chống trùng)."},{"note":"remove(2): xô 2 bỏ 2 → rỗng."},{"note":"contains(2): xô 2 rỗng → false — đúng yêu cầu chuỗi."}],"anim":false},{"name":"Set thuần (đơn giản, minh hoạ)","time":"O(1) trung bình","space":"O(n)","idea":"Dùng đúng set của Python: add/remove/contains gọi trực tiếp — bản để đối chiếu độ đúng, không phải 'thiết kế' thật.","code":"class MyHashSet:\n    def __init__(self):\n        self.s = set()\n    def add(self, key):\n        self.s.add(key)\n    def remove(self, key):\n        self.s.discard(key)\n    def contains(self, key):\n        return key in self.s","static":["Khởi tạo set rỗng — set Python chính là hash table.","add(1): thêm 1; add(2): thêm 2 → {1, 2}.","contains(1) → True; contains(3) → False.","add(2) khi 2 đã có → không đổi ({1, 2}).","remove(2) dùng discard (xoá không lỗi dù không có).","contains(2) → False — chuỗi thao tác đúng yêu cầu."],"_pno":"705","steps":[{"note":"Khởi tạo set rỗng — set Python chính là hash table."},{"note":"add(1): thêm 1; add(2): thêm 2 → {1, 2}."},{"note":"contains(1) → True; contains(3) → False."},{"note":"add(2) khi 2 đã có → không đổi ({1, 2})."},{"note":"remove(2) dùng discard (xoá không lỗi dù không có)."},{"note":"contains(2) → False — chuỗi thao tác đúng yêu cầu."}],"anim":false},{"name":"Mảng bool phạm vi bị chặn","time":"O(1)","space":"O(10^6)","idea":"Vì khoá trong [0, 10^6] nên dùng mảng bool đánh dấu — add/remove/contains đều O(1) chặt, thích hợp giảng dạy khi phạm vi nhỏ.","code":"class MyHashSet:\n    def __init__(self):\n        self.t = [False] * 1000001\n    def add(self, key):\n        self.t[key] = True\n    def remove(self, key):\n        self.t[key] = False\n    def contains(self, key):\n        return self.t[key]","static":["Khởi tạo mảng bool 1.000.001 ô (khoá tối đa 10^6).","add(1): t[1] = True; add(2): t[2] = True.","contains(1) → True; contains(3) → False (ô chưa bật).","add(2) lặp lại → t[2] vẫn True (không nhân đôi).","remove(2): t[2] = False.","contains(2) → False — nhưng tốn bộ nhớ cố định 1MB; bucket chỉ tốn theo dữ liệu."],"_pno":"705","steps":[{"note":"Khởi tạo mảng bool 1.000.001 ô (khoá tối đa 10^6)."},{"note":"add(1): t[1] = True; add(2): t[2] = True."},{"note":"contains(1) → True; contains(3) → False (ô chưa bật)."},{"note":"add(2) lặp lại → t[2] vẫn True (không nhân đôi)."},{"note":"remove(2): t[2] = False."},{"note":"contains(2) → False — nhưng tốn bộ nhớ cố định 1MB; bucket chỉ tốn theo dữ liệu."}],"anim":false}]},{"no":"706","title":"Design HashMap","cat":"Hashmap","diff":"Easy","statement":"Thiết kế cấu trúc dữ liệu hỗ trợ put(key,value), get(key), remove(key) — mỗi key một value; get trả -1 nếu key chưa có.","examples":"put(1,1),put(2,2),get(1)→1,get(3)→-1,put(2,1),get(2)→1,remove(2),get(2)→-1","keyIdea":"Bảng băm: mỗi xô chứa danh sách cặp (key, value); put ghi đè nếu key đã tồn tại trong xô.","thinking":{"forward":"Băm key ra xô; trong xô tìm cặp có key trùng → put ghi đè value, get trả về value, remove xoá cặp đó.","reverse":"Muốn mỗi thao tác O(1) trung bình → cần định vị chính xác 'xô' chứa key rồi thao tác cục bộ trên xô; đụng độ băm được xử lý bằng list tuyến tính trong xô."},"note":"Với get khi key chưa tồn tại trả -1; put khi key đã có phải ghi đè value (không thêm trùng) — tính đúng đắn phụ thuộc việc xét cả key lẫn value. Khoá âm không xảy ra trong test.","approaches":[{"name":"Bucket + ghi đè khi trùng key","time":"O(1) trung bình","space":"O(n)","idea":"size xô (vd 16); put: tìm cặp trùng key trong xô để ghi đè, chưa có thì thêm; get: duyệt xô trả value or -1; remove: xoá cặp.","code":"class MyHashMap:\n    def __init__(self, size=16):\n        self.buckets = [[] for _ in range(size)]\n    def _hash(self, key):\n        return key % len(self.buckets)\n    def put(self, key, value):\n        b = self.buckets[self._hash(key)]\n        for i, (k, v) in enumerate(b):\n            if k == key:\n                b[i] = (key, value)\n                return\n        b.append((key, value))\n    def get(self, key):\n        for k, v in self.buckets[self._hash(key)]:\n            if k == key:\n                return v\n        return -1\n    def remove(self, key):\n        b = self.buckets[self._hash(key)]\n        for i, (k, v) in enumerate(b):\n            if k == key:\n                b.pop(i)\n                return","static":["Khởi tạo MyHashMap(): 16 xô rỗng.","put(1,1): 1%16=1 → xô 1 thêm (1,1).","put(2,2): 2%16=2 → xô 2 thêm (2,2).","get(1): xô 1 tìm (1,1) → 1.","get(3): xô 3 rỗng → -1.","put(2,1): xô 2 đã có (2,2) → ghi đè thành (2,1).","get(2): xô 2 trả value 1 (đã đổi).","remove(2): xô 2 xoá (2,1) → rỗng.","get(2): xô 2 rỗng → -1 — chuỗi trả về 1; -1; 1; -1 đúng."],"_pno":"706","steps":[{"note":"Khởi tạo MyHashMap(): 16 xô rỗng."},{"note":"put(1,1): 1%16=1 → xô 1 thêm (1,1)."},{"note":"put(2,2): 2%16=2 → xô 2 thêm (2,2)."},{"note":"get(1): xô 1 tìm (1,1) → 1."},{"note":"get(3): xô 3 rỗng → -1."},{"note":"put(2,1): xô 2 đã có (2,2) → ghi đè thành (2,1)."},{"note":"get(2): xô 2 trả value 1 (đã đổi)."},{"note":"remove(2): xô 2 xoá (2,1) → rỗng."},{"note":"get(2): xô 2 rỗng → -1 — chuỗi trả về 1; -1; 1; -1 đúng."}],"anim":false},{"name":"Dict thuần (đối chiếu)","time":"O(1) trung bình","space":"O(n)","idea":"Dùng dict Python: put = gán, get = get mặc định -1, remove = pop - bản để kiểm chứng chuỗi.","code":"class MyHashMap:\n    def __init__(self):\n        self.d = {}\n    def put(self, key, value):\n        self.d[key] = value\n    def get(self, key):\n        return self.d.get(key, -1)\n    def remove(self, key):\n        self.d.pop(key, None)","static":["Khởi tạo dict rỗng.","put(1,1) → d = {1: 1}; put(2,2) → d = {1: 1, 2: 2}.","get(1) → 1; get(3) → -1 (mặc định).","put(2,1) ghi đè → d = {1: 1, 2: 1}.","get(2) → 1 — value đã được đổi.","remove(2) → d = {1: 1}; get(2) → -1 — đúng chuỗi."],"_pno":"706","steps":[{"note":"Khởi tạo dict rỗng."},{"note":"put(1,1) → d = {1: 1}; put(2,2) → d = {1: 1, 2: 2}."},{"note":"get(1) → 1; get(3) → -1 (mặc định)."},{"note":"put(2,1) ghi đè → d = {1: 1, 2: 1}."},{"note":"get(2) → 1 — value đã được đổi."},{"note":"remove(2) → d = {1: 1}; get(2) → -1 — đúng chuỗi."}],"anim":false}]},{"no":"771","title":"Jewels and Stones","cat":"Hashmap","diff":"Easy","statement":"Đếm số viên stones là đá quý (ký tự xuất hiện trong jewels) — phân biệt chữ hoa/thường.","examples":"jewels=\"aA\", stones=\"aAAbbbb\" → 3 · jewels=\"z\", stones=\"ZZ\" → 0","keyIdea":"Đưa jewels vào set để tra cứu O(1); đếm ký tự stones nằm trong set.","thinking":{"forward":"Set(jewels) là 'danh sách đá quý'; duyệt stones, mỗi ký tự thuộc set thì đếm thêm 1.","reverse":"Muốn đếm nhanh mỗi viên đá có quý hay không → tra cứu O(1); 'a' và 'A' là hai ký tự khác nhau trong bảng mã."},"note":"Ví dụ jewels='aA' nhưng stones='aAAbbbb': chữ 'a' và 'A' đều quý, 'b' không quý — 3 viên ('a','A','A'). Câu chữ cái phân biệt hoa/thường.","approaches":[{"name":"Set jewels + đếm một lượt","time":"O(|j|+|s|)","space":"O(|j|)","idea":"j = set(jewels); với stones: sum(1 for x in stones if x in j).","code":"def num_jewels_in_stones(jewels, stones):\n    j = set(jewels)\n    ans = 0\n    for s in stones:\n        if s in j:\n            ans += 1\n    return ans","tcex":{"input":{"jewels":"aA","stones":"aAAbbbb"},"kind":"set","display":"j","ptrs":["s"],"expected":3,"anim":true},"_pno":"771","steps":[{"note":"j = set(jewels)","line":2,"array":[],"explain":"Đang thực thi: j = set(jewels)"},{"note":"ans = 0","line":3,"array":[],"set":["A","a"],"explain":"Đang thực thi: ans = 0"},{"note":"for s in stones:","line":4,"array":[],"explain":"Duyệt: for s in stones:"},{"ptr":{"s":"a"},"note":"s→a — if s in j:","line":5,"array":[],"explain":"Con trỏ s dịch tới a — phạm vi xét được thu hẹp"},{"ptr":{"s":"a"},"note":"s→a — ans += 1","line":6,"array":[],"explain":"ans += 1 — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"s":"a"},"note":"s→a — for s in stones:","line":4,"array":[],"explain":"Con trỏ s dịch tới a — phạm vi xét được thu hẹp"},{"ptr":{"s":"A"},"note":"s→A — if s in j:","line":5,"array":[],"explain":"Con trỏ s dịch tới A — phạm vi xét được thu hẹp"},{"ptr":{"s":"A"},"note":"s→A — ans += 1","line":6,"array":[],"explain":"ans += 1 — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"s":"A"},"note":"s→A — for s in stones:","line":4,"array":[],"explain":"Con trỏ s dịch tới A — phạm vi xét được thu hẹp"},{"ptr":{"s":"A"},"note":"s→A — if s in j:","line":5,"array":[],"explain":"Con trỏ s dịch tới A — phạm vi xét được thu hẹp"},{"ptr":{"s":"A"},"note":"s→A — ans += 1","line":6,"array":[],"explain":"ans += 1 — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"s":"A"},"note":"s→A — for s in stones:","line":4,"array":[],"explain":"Con trỏ s dịch tới A — phạm vi xét được thu hẹp"},{"ptr":{"s":"b"},"note":"s→b — if s in j:","line":5,"array":[],"explain":"Con trỏ s dịch tới b — phạm vi xét được thu hẹp"},{"ptr":{"s":"b"},"note":"s→b — for s in stones:","line":4,"array":[],"explain":"Con trỏ s dịch tới b — phạm vi xét được thu hẹp"},{"ptr":{"s":"b"},"note":"s→b — if s in j:","line":5,"array":[],"explain":"Con trỏ s dịch tới b — phạm vi xét được thu hẹp"},{"ptr":{"s":"b"},"note":"s→b — for s in stones:","line":4,"array":[],"explain":"Con trỏ s dịch tới b — phạm vi xét được thu hẹp"},{"ptr":{"s":"b"},"note":"s→b — if s in j:","line":5,"array":[],"explain":"Con trỏ s dịch tới b — phạm vi xét được thu hẹp"},{"ptr":{"s":"b"},"note":"s→b — for s in stones:","line":4,"array":[],"explain":"Con trỏ s dịch tới b — phạm vi xét được thu hẹp"},{"ptr":{"s":"b"},"note":"s→b — if s in j:","line":5,"array":[],"explain":"Con trỏ s dịch tới b — phạm vi xét được thu hẹp"},{"ptr":{"s":"b"},"note":"s→b — for s in stones:","line":4,"array":[],"explain":"Con trỏ s dịch tới b — phạm vi xét được thu hẹp"},{"ptr":{"s":"b"},"note":"s→b — return ans — Kết thúc — đáp án: 3 ✓ (khớp kỳ vọng)","line":7,"array":[],"end":true,"answer":3,"explain":"→ Đáp án: 3 s=b"}],"anim":true},{"name":"Đếm từng ký tự quý","time":"O(|j|·|s|)","space":"O(1)","idea":"Với mỗi ký tự quý (đã loại trùng bằng set), stones.count(ch) — không dùng thêm bộ nhớ.","code":"def num_jewels_in_stones(jewels, stones):\n    return sum(stones.count(ch) for ch in set(jewels))","static":["set(jewels) = {'a', 'A'} — loại trùng.","stones.count('a') = 1 (viên 'a' đầu).","stones.count('A') = 2 (hai viên 'A').","Tổng = 1 + 2 = 3 viên đá quý.","O(|j|·|s|) — mỗi count quét lại toàn bộ stones."],"_pno":"771","steps":[{"note":"set(jewels) = {'a', 'A'} — loại trùng."},{"note":"stones.count('a') = 1 (viên 'a' đầu)."},{"note":"stones.count('A') = 2 (hai viên 'A')."},{"note":"Tổng = 1 + 2 = 3 viên đá quý."},{"note":"O(|j|·|s|) — mỗi count quét lại toàn bộ stones."}],"anim":false},{"name":"Bảng bool ASCII","time":"O(|j|+|s|)","space":"O(1)","idea":"Mảng bool 128 ô đánh dấu ký tự quý theo mã ASCII; đếm stones qua mảng — tận dụng bảng mã bị chặn.","code":"def num_jewels_in_stones(jewels, stones):\n    mark = [False] * 128\n    for ch in jewels:\n        mark[ord(ch)] = True\n    return sum(1 for ch in stones if mark[ord(ch)])","static":["mark = [False]*128 (bảng mã ASCII).","Đánh dấu mark[ord('a')] = True và mark[ord('A')] = True (two jewels).","Duyệt stones 'aAAbbbb': 'a'(97) quý, 'A'(65) quý, 'A' quý, các 'b'(98) không.","Đếm được 3 — hoa/thường khác ô nên không nhầm.","O(1) bộ nhớ cố định 128 ô."],"_pno":"771","steps":[{"note":"mark = [False]*128 (bảng mã ASCII)."},{"note":"Đánh dấu mark[ord('a')] = True và mark[ord('A')] = True (two jewels)."},{"note":"Duyệt stones 'aAAbbbb': 'a'(97) quý, 'A'(65) quý, 'A' quý, các 'b'(98) không."},{"note":"Đếm được 3 — hoa/thường khác ô nên không nhầm."},{"note":"O(1) bộ nhớ cố định 128 ô."}],"anim":false}]},{"no":"1207","title":"Unique Number of Occurrences","cat":"Hashmap","diff":"Easy","statement":"Kiểm tra số lần xuất hiện của mỗi giá trị trong arr có đôi một khác nhau không.","examples":"arr=[1,2,2,1,1,3] → true (1:3, 2:2, 3:1) · arr=[1,2] → false (cùng 1 lần) · arr=[-3,0,1,-3,1,1,1,-3,10,0] → true","keyIdea":"Đếm tần suất bằng Counter; yêu cầu là mọi tần suất phân biệt → so số lượng tần suất với số lượng tần suất phân biệt (set).","thinking":{"forward":"Counter cho dict giá trị → tần suất; tập các tần suất (set) phải có đúng bằng số giá trị phân biệt.","reverse":"Muốn mọi tần suất khác nhau → đếm tần suất trước rồi kiểm tra trùng lặp giữa các tần suất; nếu hai giá trị cùng tần suất → false."},"note":"Chỉ so len(cnt) với len(set(cnt.values())) là đủ — mọi giá trị phân biệt phải có tần suất riêng; giá trị âm vẫn xử lý bình thường vì Counter không phân biệt dấu.","approaches":[{"name":"So độ dài Counter và set tần suất","time":"O(n)","space":"O(n)","idea":"cnt = Counter(arr); true ⇔ len(cnt) == len(set(cnt.values())).","code":"from collections import Counter\ndef unique_occurrences(arr):\n    cnt = Counter(arr)\n    n = len(cnt)\n    m = len(set(cnt.values()))\n    return n == m","tcex":{"input":{"arr":[1,2,2,1,1,3]},"kind":"hash","display":"cnt","ptrs":[],"expected":true,"anim":true},"_pno":"1207","steps":[{"note":"cnt = Counter(arr)","line":3,"array":[1,2,2,1,1,3],"explain":"Đang thực thi: cnt = Counter(arr)"},{"note":"n = len(cnt)","line":4,"array":[1,2,2,1,1,3],"hash":{"1":3,"2":2,"3":1},"explain":"Đang thực thi: n = len(cnt)"},{"note":"m = len(set(cnt.values()))","line":5,"array":[1,2,2,1,1,3],"explain":"Đang thực thi: m = len(set(cnt.values()))"},{"note":"return n == m — Kết thúc — đáp án: True ✓ (khớp kỳ vọng)","line":6,"array":[1,2,2,1,1,3],"end":true,"answer":true,"explain":"→ Đáp án: True"}],"anim":true},{"name":"Quét tần suất bằng set","time":"O(n)","space":"O(n)","idea":"Duyệt cnt.values() và thêm vào seen; gặp tần suất đã có → false ngay (dừng sớm).","code":"from collections import Counter\ndef unique_occurrences(arr):\n    cnt = Counter(arr)\n    seen = set()\n    for v in cnt.values():\n        if v in seen:\n            return False\n        seen.add(v)\n    return True","tcex":{"input":{"arr":[1,2,2,1,1,3]},"kind":"set","display":"seen","ptrs":["v"],"expected":true,"anim":true},"_pno":"1207","steps":[{"note":"cnt = Counter(arr)","line":3,"array":[1,2,2,1,1,3],"explain":"Đang thực thi: cnt = Counter(arr)"},{"note":"seen = set()","line":4,"array":[1,2,2,1,1,3],"explain":"Đang thực thi: seen = set()"},{"note":"for v in cnt.values():","line":5,"array":[1,2,2,1,1,3],"set":[],"explain":"Duyệt: for v in cnt.values():"},{"ptr":{"v":3},"note":"v→3 — if v in seen:","line":6,"array":[1,2,2,1,1,3],"explain":"Con trỏ v dịch tới 3 — phạm vi xét được thu hẹp"},{"ptr":{"v":3},"note":"v→3 — seen.add(v)","line":8,"array":[1,2,2,1,1,3],"explain":"seen.add(v) — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"v":3},"note":"v→3 — for v in cnt.values():","line":5,"array":[1,2,2,1,1,3],"explain":"Con trỏ v dịch tới 3 — phạm vi xét được thu hẹp"},{"ptr":{"v":2},"note":"v→2 — if v in seen:","line":6,"array":[1,2,2,1,1,3],"explain":"Con trỏ v dịch tới 2 — phạm vi xét được thu hẹp"},{"ptr":{"v":2},"note":"v→2 — seen.add(v)","line":8,"array":[1,2,2,1,1,3],"explain":"seen.add(v) — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"v":2},"note":"v→2 — for v in cnt.values():","line":5,"array":[1,2,2,1,1,3],"explain":"Con trỏ v dịch tới 2 — phạm vi xét được thu hẹp"},{"ptr":{"v":1},"note":"v→1 — if v in seen:","line":6,"array":[1,2,2,1,1,3],"explain":"Con trỏ v dịch tới 1 — phạm vi xét được thu hẹp"},{"ptr":{"v":1},"note":"v→1 — seen.add(v)","line":8,"array":[1,2,2,1,1,3],"explain":"seen.add(v) — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"v":1},"note":"v→1 — for v in cnt.values():","line":5,"array":[1,2,2,1,1,3],"explain":"Con trỏ v dịch tới 1 — phạm vi xét được thu hẹp"},{"ptr":{"v":1},"note":"v→1 — return True — Kết thúc — đáp án: True ✓ (khớp kỳ vọng)","line":9,"array":[1,2,2,1,1,3],"end":true,"answer":true,"explain":"→ Đáp án: True v=1"}],"anim":true},{"name":"Sort tần suất","time":"O(n·log n)","space":"O(n)","idea":"Sort danh sách tần suất; true ⇔ không có hai phần tử kề bằng nhau (mọi tần suất phân biệt).","code":"from collections import Counter\ndef unique_occurrences(arr):\n    vals = sorted(Counter(arr).values())\n    return all(vals[i] != vals[i+1] for i in range(len(vals)-1))","static":["Counter(arr) với arr=[1,2,2,1,1,3] → {1: 3, 2: 2, 3: 1}.","vals = [1, 2, 3] (đã sort).","Không có cặp kề bằng nhau → true.","Với arr=[1,2]: Counter → {1: 1, 2: 1} → vals = [1, 1] → false.","O(n·log n) — dùng khi muốn tránh set."],"_pno":"1207","steps":[{"note":"Counter(arr) với arr=[1,2,2,1,1,3] → {1: 3, 2: 2, 3: 1}."},{"note":"vals = [1, 2, 3] (đã sort)."},{"note":"Không có cặp kề bằng nhau → true."},{"note":"Với arr=[1,2]: Counter → {1: 1, 2: 1} → vals = [1, 1] → false."},{"note":"O(n·log n) — dùng khi muốn tránh set."}],"anim":false}]},{"no":"1512","title":"Number of Good Pairs","cat":"Hashmap","diff":"Easy","statement":"Đếm số cặp (i, j) với i < j và nums[i] == nums[j].","examples":"nums=[1,2,3,1,1,3] → 4 · nums=[1,1,1,1] → 6 · nums=[1,2,3] → 0","keyIdea":"Duyệt trái qua phải: với mỗi phần tử, mọi lần xuất hiện trước nó đều tạo cặp — cộng dồn cnt[x] rồi tăng cnt[x].","thinking":{"forward":"Quét từng x: số cặp mới tạo với x = số lần x đã xuất hiện trước đó (cnt[x]); cập nhật cnt[x] += 1.","reverse":"Muốn đếm cặp trùng → với mỗi phần tử chỉ cần biết 'đã gặp bao nhiêu lần' — tra cứu O(1) bằng dict tần suất; công thức tổ hợp C(n,2) trả về cùng kết quả."},"note":"Cứ 3 lần xuất hiện của cùng giá trị thì có C(3,2)=3 cặp; duyệt một lượt cộng dồn tương đương. Số lượng cặp tối đa n(n−1)/2 với mảng đều một giá trị.","approaches":[{"name":"Một lượt + cộng dồn cnt","time":"O(n)","space":"O(n)","idea":"Với mỗi x: ans += cnt[x] (các lần đã gặp); cnt[x] += 1.","code":"from collections import defaultdict\ndef num_identical_pairs(nums):\n    cnt = defaultdict(int)\n    ans = 0\n    for x in nums:\n        ans += cnt[x]\n        cnt[x] += 1\n    return ans","tcex":{"input":{"nums":[1,2,3,1,1,3]},"kind":"hash","display":"cnt","ptrs":["x"],"expected":4,"anim":true},"_pno":"1512","steps":[{"note":"cnt = defaultdict(int)","line":3,"array":[1,2,3,1,1,3],"explain":"Đang thực thi: cnt = defaultdict(int)"},{"note":"ans = 0","line":4,"array":[1,2,3,1,1,3],"hash":{},"explain":"Đang thực thi: ans = 0"},{"note":"for x in nums:","line":5,"array":[1,2,3,1,1,3],"explain":"Duyệt: for x in nums:"},{"ptr":{"x":1},"note":"x→1 — ans += cnt[x]","line":6,"array":[1,2,3,1,1,3],"explain": explain":"Con trỏ x dịch tới 1 — phạm vi xét được thu hẹp"},{"ptr":{"x":3},"note":"x→3 — ans += cnt[x]","line":6,"array":[1,2,3,1,1,3],"explain":"ans += cnt[x] — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"x":3},"note":"x→3 — cnt[x] += 1","line":7,"array":[1,2,3,1,1,3],"explain":"cnt[x] += 1 — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"x":3},"note":"x→3 — for x in nums:","line":5,"array":[1,2,3,1,1,3],"explain":"Con trỏ x dịch tới 3 — phạm vi xét được thu hẹp"},{"ptr":{"x":3},"note":"x→3 — return ans — Kết thúc — đáp án: 4 ✓ (khớp kỳ vọng)","line":8,"array":[1,2,3,1,1,3],"end":true,"answer":4,"explain":"→ Đáp án: 4 x=3"}],"anim":true},{"name":"Tổ hợp C(n,2) theo giá trị","time":"O(n)","space":"O(n)","idea":"Đếm tần suất mỗi giá trị; số cặp = Σ v(v−1)//2.","code":"from collections import Counter\ndef num_identical_pairs(nums):\n    cnt = Counter(nums)\n    ans = 0\n    for v in cnt.values():\n        ans += v * (v - 1) // 2\n    return ans","tcex":{"input":{"nums":[1,2,3,1,1,3]},"kind":"hash","display":"cnt","ptrs":["v"],"expected":4,"anim":true},"_pno":"1512","steps":[{"note":"cnt = Counter(nums)","line":3,"array":[1,2,3,1,1,3],"explain":"Đang thực thi: cnt = Counter(nums)"},{"note":"ans = 0","line":4,"array":[1,2,3,1,1,3],"hash":{"1":3,"2":1,"3":2},"explain":"Đang thực thi: ans = 0"},{"note":"for v in cnt.values():","line":5,"array":[1,2,3,1,1,3],"explain":"Duyệt: for v in cnt.values():"},{"ptr":{"v":3},"note":"v→3 — ans += v * (v - 1) // 2","line":6,"array":[1,2,3,1,1,3],"explain":"ans += v * (v - 1) // 2 — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"v":3},"note":"v→3 — for v in cnt.values():","line":5,"array":[1,2,3,1,1,3],"explain":"Con trỏ v dịch tới 3 — phạm vi xét được thu hẹp"},{"ptr":{"v":1},"note":"v→1 — ans += v * (v - 1) // 2","line":6,"array":[1,2,3,1,1,3],"explain":"ans += v * (v - 1) // 2 — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"v":1},"note":"v→1 — for v in cnt.values():","line":5,"array":[1,2,3,1,1,3],"explain":"Con trỏ v dịch tới 1 — phạm vi xét được thu hẹp"},{"ptr":{"v":2},"note":"v→2 — ans += v * (v - 1) // 2","line":6,"array":[1,2,3,1,1,3],"explain":"ans += v * (v - 1) // 2 — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"v":2},"note":"v→2 — for v in cnt.values():","line":5,"array":[1,2,3,1,1,3],"explain":"Con trỏ v dịch tới 2 — phạm vi xét được thu hẹp"},{"ptr":{"v":2},"note":"v→2 — return ans — Kết thúc — đáp án: 4 ✓ (khớp kỳ vọng)","line":7,"array":[1,2,3,1,1,3],"end":true,"answer":4,"explain":"→ Đáp án: 4 v=2"}],"anim":true},{"name":"Vét cạn O(n²)","time":"O(n²)","space":"O(1)","idea":"So từng cặp (i, j) — chuẩn để hiểu định nghĩa trước khi tối ưu.","code":"def num_identical_pairs(nums):\n    ans = 0\n    for i in range(len(nums)):\n        for j in range(i + 1, len(nums)):\n            if nums[i] == nums[j]:\n                ans += 1\n    return ans","static":["Duyệt mọi cặp (i, j) với i < j.","So nums[i] == nums[j]: đúng thì ans += 1.","Với nums=[1,2,3,1,1,3]: các cặp đúng (0,3), (0,4), (3,4), (2,5).","ans = 4 — khớp kết quả.","O(n²) — giới hạn n ≤ 100 là chấp nhận được ở bài này."],"_pno":"1512","steps":[{"note":"Duyệt mọi cặp (i, j) với i < j."},{"note":"So nums[i] == nums[j]: đúng thì ans += 1."},{"note":"Với nums=[1,2,3,1,1,3]: các cặp đúng (0,3), (0,4), (3,4), (2,5)."},{"note":"ans = 4 — khớp kết quả."},{"note":"O(n²) — giới hạn n ≤ 100 là chấp nhận được ở bài này."}],"anim":false}]},{"no":"2225","title":"Find Players With Zero or One Losses","cat":"Hashmap","diff":"Medium","statement":"Từ danh sách trận đấu, tìm (a) người chơi không thua trận nào, (b) người thua đúng một trận — mỗi danh sách sắp tăng dần.","examples":"matches=[[1,3],[2,3],[3,6],[5,6],[5,7],[4,5],[4,8],[4,9],[10,4],[10,9]] → [[1,2,10],[4,5,7,8]]","keyIdea":"Chỉ theo dõi số trận thua: mỗi người xuất hiện với 0 thua mặc định; người thua = +1; lọc 0 thua và 1 thua.","thinking":{"forward":"Duyệt từng trận (winner, loser): winner đảm bảo có mặt với 0 thua, loser tăng 1; cuối cùng tách hai nhóm và sort theo id.","reverse":"Muốn biết ai không thua/ai thua 1 → chỉ cần đếm trận thua của mỗi người, người không thất trận nào sẽ không bao giờ nằm ở cột loser."},"note":"Người chỉ thắng (không thua) vẫn phải xuất hiện trong đáp án — nên phải setdefault(winner, 0). Sắp xếp tăng dần theo id bắt buộc trước khi trả về.","approaches":[{"name":"Dict đếm trận thua","time":"O(n·log n)","space":"O(n)","idea":"loss[loser] += 1 và setdefault(winner, 0); lọc 0 thua → zero, 1 thua → one; sort từng nhóm.","code":"def find_winners(matches):\n    loss = {}\n    for w, l in matches:\n        loss.setdefault(w, 0)\n        loss[l] = loss.get(l, 0) + 1\n    zero = [p for p, c in loss.items() if c == 0]\n    one = [p for p, c in loss.items() if c == 1]\n    return [sorted(zero), sorted(one)]","tcex":{"input":{"matches":[[1,3],[2,3],[3,6],[5,6],[5,7],[4,5],[4,8],[4,9],[10,4],[10,9]]},"kind":"hash","display":"loss","ptrs":["w","l"],"expected":[[1,2,10],[4,5,7,8]],"anim":true},"_pno":"2225","steps":[{"note":"loss = {}","line":2,"array":[[1,3],[2,3],[3,6],[5,6],[5,7],[4,5],[4,8],[4,9],[10,4],[10,9]],"explain":"Đang thực thi: loss = {}"},{"note":"for w, l in matches:","line":3,"array":[[1,3],[2,3],[3,6],[5,6],[5,7],[4,5],[4,8],[4,9],[10,4],[10,9]],"hash":{},"explain":"Duyệt: for w, l in matches:"},{"ptr":{"w":1,"l":3},"note":"w→1; l→3 — loss.setdefault(w, 0)","line":4,"array":[[1,3],[2,3],[3,6],[5,6],[5,7],[4,5],[4,8],[4,9],[10,4],[10,9]],"explain":"Con trỏ w dịch tới 1 — phạm vi xét được thu hẹp"},{"ptr":{"w":1,"l":3},"note":"w→1; l→3 — loss[l] = loss.get(l, 0) + 1","line":5,"array":[[1,3],[2,3],[3,6],[5,6],[5,7],[4,5],[4,8],[4,9],[10,4],[10,9]],"explain":"loss[l] = loss.get(l, 0) + 1 — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"w":1,"l":3},"note":"w→1; l→3 — for w, l in matches:","line":3,"array":[[1,3],[2,3],[3,6],[5,6],[5,7],[4,5],[4,8],[4,9],[10,4],[10,9]],"explain":"Con trỏ w dịch tới 1 — phạm vi xét được thu hẹp"},{"ptr":{"w":2,"l":3},"note":"w→2; l→3 function el(tag, cls, text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}

/* highlight Python giản lược */
const KW=new Set("def return if elif else for while in not and or None True False break continue pass import from as with class lambda".split(" "));
function hlpy(code){
  // token hoá: comment, string, số, keyword, còn lại giữ nguyên
  let out="",i=0;
  const seg=code;
  while(i<seg.length){
    const rest=seg.slice(i);
    let m=rest.match(/^#.*/);
    if(m){out+='<span class="c">'+esc(m[0])+'</span>';i+=m[0].length;continue}
    m=rest.match(/^("""[\s\S]*?"""|'''[\s\S]*?'''|"[^"\n]*"|'[^'\n]*')/);
    if(m){out+='<span class="s">'+esc(m[0])+'</span>';i+=m[0].length;continue}
    m=rest.match(/^\d+(\.\d+)?/);
    if(m){out+='<span class="n">'+esc(m[0])+'</span>';i+=m[0].length;continue}
    m=rest.match(/^[A-Za-z_][A-Za-z0-9_]*/);
    if(m){const w=m[0];out+=KW.has(w)?'<span class="k">'+w+'</span>':esc(w);i+=w.length;continue}
    out+=esc(rest[0]);i++;
  }
  return out;
}

}

    // KL đúng của toàn approach là kind NẶNG NHẤT, không phải step đầu
    if(this.kind!=="array"&&this.kind!=="mat"&&this.kind!=="stack"&&this.kind!=="hash"&&this.kind!=="set")this.kind=_pickKind(steps[0]);

  /* ---------- dựng khung ---------- */

  buildPtrs(){

  }
  buildControls(){
    const mk=(t,fn,title)=>{const b=el("button","btn",t);b.title=title||"";b.onclick=fn;this.ctl.appendChild(b);return b};
    mk("⏮",()=>this.stepTo(0),"Về đầu");
    mk("◀",()=>this.stepTo(this.idx-1),"Lùi 1 bước");
    mk(">",()=>this.stepTo(this.idx+1),"Tiến 1 bước");
    mk("⏭",()=>this.stepTo(this.steps.length-1),"Tới kết quả");
    this.counter=el("span","sp","");this.ctl.appendChild(this.counter);
    this.range=el("input","rng");this.range.type="range";this.range.min=0;this.range.max=Math.max(0,this.steps.length-1);this.range.value=0;
    this.range.oninput=()=>this.stepTo(+this.range.value);this.ctl.appendChild(this.range);
    // keyboard: ← → Home End khi host được focus
    this._kd=e=>{

      else if(e.key==="ArrowRight"){this.stepTo(this.idx+1);e.preventDefault()}
      else if(e.key==="Home"){this.stepTo(0);e.preventDefault()}
      else if(e.key==="End"){this.stepTo(this.steps.length-1);e.preventDefault()}

  /* ---------- highlight helpers ---------- */
  _markTarget(target,cls){
    // target: [i] | [r,c] | {node:id} | node-id | string-key (hash)
    if(!target)return null;
    let idx=-1,elx=null;
    if(Array.isArray(target)){
      if(this.kind==="mat"){const[r,c]=target;const cols=this._matCols();idx=r*cols+c}
      else idx=target[0];
    }else if(typeof target==="object"&&target.node!==undefined)idx=target.node;
    else if(typeof target==="number")idx=target;
    else if(typeof target==="string"&&this.kind==="hash"){
      for(let i=0;i<this.hashEls.length;i++){
        const hk=this.hashEls[i].querySelector(".hk");
        if(hk&&hk.textContent===target){idx=i;break}
      }
    }
    if(idx<0)return null;
    const ce=this.cellEls[idx];
    if(ce)ce.classList.add(cls);
    const ne=this.nodeEls.get(idx);
    if(ne)ne.classList.add(cls);
    return ce||ne||null;
  }
  _matCols(){
    let max=0;
    for(const s of this.steps)if(s.mat)max=Math.max(max,...s.mat.map(r=>r.length));
    return max;
  }
  /* ---------- render dữ liệu node (ll/tree) ---------- */
  renderNodes(s){
    const data=s[this.kind];
    if(!data||!data.nodes){
      /* graph: chỉ xoá nội dung SVG bên trong graphBox, không phá container */
      if(this.kind==="graph"){if(this.graphBox)this.graphBox.innerHTML="";return}
      if(this.box)this.box.innerHTML="";this.nodeEls.clear();return
    }
    if(this.kind==="ll"){
      this._renderLL(data);
    }else if(this.kind==="graph"){
      this._renderGraph(s);
    }else{
      this._renderTree(data);
    }
    if(this.kind!=="graph")this._applyNodeHighlights(s);
  }
  /* ---------- force-directed graph ---------- */
  _graphLayout(data,W,H){
    const ids=data.nodes.map(n=>n.id);
    const key=ids.slice().sort().join(",");
    /* spring dùng ĐỒ THỊ HOÀN CHỈNH (step cuối cùng có cùng id-set) để node
       đứng đúng vị trí cuối ngay từ đầu — cạnh chỉ được VẼ dần theo từng step */
    if(this._glyKey!==key){
      this._gly=null;this._glyKey=key;
      for(let i=this.steps.length-1;i>=0;i--){
        const s=this.steps[i];
        if(s.graph&&s.graph.nodes&&s.graph.nodes.map(n=>n.id).slice().sort().join(",")===key){this._gly=s.graph;break}
      }
    }
    const full=this._gly||data;
    const cached=this._graphLayoutCache;
    /* cache trùng key + đủ pos → giữ nguyên vị trí (không nhảy khi chỉ đổi cạnh) */
    if(cached&&cached.key===key&&ids.every(id=>cached.pos[id]))return cached;
    const pos={};
    ids.forEach((id,i)=>{
      if(cached&&cached.pos&&cached.pos[id]){pos[id]={x:cached.pos[id].x,y:cached.pos[id].y};return}
      /* vòng tròn ban đầu (ổn định hơn random) — thứ tự nút tương đối ổn định giữa các step */
      const a0=0.7*i/Math.max(1,ids.length),a=a0+0.08*(Math.random()-.5);
      const R0=Math.min(100,W/3);
      pos[id]={x:W/2+Math.cos(2*Math.PI*a)*R0,y:H/2+Math.sin(2*Math.PI*a)*R0};
    });
    const iter=110;
    const pairs=[];for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)pairs.push([ids[i],ids[j]]);
    const edgeSeen=new Set(),edges=[];
    full.nodes.forEach(n=>(n.neighbors||[]).forEach(v=>{
      if(!pos[v])return;
      if(edgeSeen.has(n.id+"-"+v)||edgeSeen.has(v+"-"+n.id))return;
      edgeSeen.add(n.id+"-"+v);edges.push([n.id,v]);
    }));
    for(let it=0;it<iter;it++){
      for(const [a,b]of pairs){
        let dx=pos[a].x-pos[b].x,dy=pos[a].y-pos[b].y;
        let d2=dx*dx+dy*dy;if(d2<1)d2=1;
        const d=Math.sqrt(d2),f=2000/d2;
        pos[a].x+=dx/d*f;pos[a].y+=dy/d*f;
        pos[b].x-=dx/d*f;pos[b].y-=dy/d*f;
      }
      for(const [u,v]of edges){
        if(!pos[v])continue;
        let dx=pos[v].x-pos[u].x,dy=pos[v].y-pos[u].y;
        const d=Math.sqrt(dx*dx+dy*dy)||1,f=(d-125)*0.07;
        pos[u].x+=dx/d*f;pos[u].y+=dy/d*f;
        pos[v].x-=dx/d*f;pos[v].y-=dy/d*f;
      }
      ids.forEach(id=>{pos[id].x+=(W/2-pos[id].x)*0.02;pos[id].y+=(H/2-pos[id].y)*0.02});
    }
    this._graphLayoutCache={key,pos,ids,edges};
    return this._graphLayoutCache;
  }
  _renderGraph(s){
    const data=s.graph;
    if(!data||!data.nodes){if(this.graphBox)this.graphBox.innerHTML="";return}
    // ---- 1. force layout (tự viết, không cần d3) ----
    const W=this.graphBox.clientWidth||560, H=this.graphBox.clientHeight||260;
    const L=this._graphLayout(data,W,H);
    const pos=L.pos,ids=L.ids;
    // ---- 2. vẽ SVG ----
    this.graphBox.innerHTML="";
    const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("viewBox","0 0 "+W+" "+H);
    svg.style.width="100%";svg.style.height=H+"px";
    // cạnh
    const edgeSet=new Set();
    data.nodes.forEach(n=>(n.neighbors||[]).forEach(v=>{
      const k1=n.id+"-"+v,k2=v+"-"+n.id;
      if(edgeSet.has(k1)||edgeSet.has(k2))return;edgeSet.add(k1);
      if(pos[v]===undefined)return;
      const line=document.createElementNS("http://www.w3.org/2000/svg","line");
      line.setAttribute("x1",pos[n.id].x);line.setAttribute("y1",pos[n.id].y);
      line.setAttribute("x2",pos[v].x);line.setAttribute("y2",pos[v].y);
      line.setAttribute("class","gedge");
      svg.appendChild(line);
    }));
    // node
    const pick=s.ptr?Object.values(s.ptr).map(v=>typeof v==="number"?v:(isNodeTarget(v)?v.node:-1)).filter(v=>v>=0):[];
    this.graphEls=new Map();
    data.nodes.forEach(n=>{
      const g=document.createElementNS("http://www.w3.org/2000/svg","g");
      g.setAttribute("class","gnode");
      const cx=pos[n.id].x,cy=pos[n.id].y;
      const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
      c.setAttribute("cx",cx);c.setAttribute("cy",cy);c.setAttribute("r",24);
      const t=document.createElementNS("http://www.w3.org/2000/svg","text");
      t.setAttribute("x",cx);t.setAttribute("y",cy);
      t.textContent=String(n.value!==undefined?n.value:n.id);
      g.appendChild(c);g.appendChild(t);
      svg.appendChild(g);
      this.graphEls.set(n.id,g);
      g.setAttribute("data-visited",n.visited?"1":"0");
    });
    this.graphBox.appendChild(svg);
    // ---- 3. highlight ----
    this.graphEls.forEach(g=>g.classList.remove("rd","wr","act"));
    if(s.read)[].concat(s.read).forEach(r=>{
      const t=r.target;
      let id=-1;
      if(typeof t==="number")id=t;
      else if(Array.isArray(t)&&t.length)id=t[0];
      else if(t&&typeof t==="object"&&t.node!==undefined)id=t.node;
      const g=this.graphEls.get(id);if(g)g.classList.add("rd");
    });
    if(s.write&&s.write.dest!==undefined&&!s.write.bake){
      const dt=s.write.dest;
      let id=-1;
      if(typeof dt==="number")id=dt;
      else if(Array.isArray(dt)&&dt.length)id=dt[0];
      else if(dt&&typeof dt==="object"&&dt.node!==undefined)id=dt.node;
      const g=this.graphEls.get(id);if(g)g.classList.add("wr");
    }
    pick.forEach(id=>{const g=this.graphEls.get(id);if(g)g.classList.add("act")});
    /* visited → nền xanh mờ (vĩnh viễn trong suốt thuật toán) */
    this.graphEls.forEach((g,id)=>{
      const nd=data.nodes.find(n=>n.id===id);
      if(nd&&nd.visited)g.classList.add("done");
    });
  }
  _renderLegend(){
    if(this.kind!=="graph")return;
    if(this.legendEl){this.legendEl.remove();this.legendEl=null}
    const lg=el("div","graph-legend");
    lg.appendChild(legendItem("r","đang đọc"));
    lg.appendChild(legendItem("w","đang ghi"));
    lg.appendChild(legendItem("a","con trỏ/đang xử lý"));
    lg.appendChild(legendItem("done","đã duyệt xong"));

  }
  _renderLL(data){
    /* dãy node nằm ngang: node đứng yên, cập nhật giá trị + độ rộng value */
    if(!this.llRow){this.llRow=el("div","llrow");this.box.appendChild(this.llRow)}
    this.llRow.innerHTML="";this.nodeEls.clear();
    let cur=data.head!==undefined?data.head:data.root;
    const seen=new Set();
    let guard=0;
    while(cur!==null&&cur!==undefined&&!seen.has(cur)&&guard++<100){
      seen.add(cur);
      const nd=data.nodes[cur];if(!nd)break;
      const nodeEl=el("div","node");
      nodeEl.classList.add("fadein");
      nodeEl.appendChild(el("span","cv",String(nd.value)));
      nodeEl.appendChild(el("span","nid",String(cur)));
      this.llRow.appendChild(nodeEl);this.nodeEls.set(cur,nodeEl);
      const nxt=nd.next;
      if(nxt!==null&&nxt!==undefined){const a=el("span","arrow","→");this.llRow.appendChild(a)}

  _renderTree(data){
    /* cây: BFS → lưới; node ở hàng = depth, cột = thứ tự trái→phải; cạnh vẽ bằng SVG */
    if(!this.tgrid){
      this.tgrid=el("div","tgrid");
      this.box.appendChild(this.tgrid);
      this.svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
      this.svg.style.position="absolute";this.svg.style.top="0";this.svg.style.left="0";this.svg.style.overflow="visible";
      this.tgrid.appendChild(this.svg);
    }
    const depth={},pos={};
    const bfs=(()=>{
      const root=data.root;
      if(root===null||root===undefined||root===-1)return;
      const layer=[[root,0,0]];
      depth[root]=0;pos[root]=0;
      while(layer.length){
        const item=layer.shift();
        const id=item[0],d=item[1],p=item[2];
        const nd=data.nodes[id];if(!nd)continue;
        const step=(nd.left!==null&&nd.left!==undefined&&nd.left!==-1)?1:0;
        const child=d+1;
        if(nd.left!==null&&nd.left!==undefined&&nd.left!==-1){
          depth[nd.left]=child;pos[nd.left]=p;
          layer.push([nd.left,child,p]);
        }
        if(nd.right!==null&&nd.right!==undefined&&nd.right!==-1){
          depth[nd.right]=child;pos[nd.right]=p+step;
          layer.push([nd.right,child,p+step]);
        }
      }
    })();
    const H=Object.keys(depth).reduce((mx,id)=>Math.max(mx,depth[id]+1),0)||0;
    const W=Object.keys(pos).reduce((mx,id)=>Math.max(mx,pos[id]+1),0)||0;
    const L=H>0?90:72,Wd=W>0?88:72;
    this.tgrid.style.gridTemplateColumns="repeat("+Math.max(1,W)+",88px)";
    /* FLIP: ghi nhận vị trí node trước khi di chuyển (node move trượt mượt) */
    this._prevRects=this._prevRects||new Map();
    this.nodeEls.forEach((n,id)=>{this._prevRects.set(+id,n.getBoundingClientRect())});
    /* tạo/cập nhật node theo id */
    for(const id in data.nodes){
      const nd=data.nodes[id];
      if(nd.vis===false){const old=this.nodeEls.get(+id);if(old)old.style.display="none";continue}
      let n=this.nodeEls.get(+id);
      if(!n){
        n=el("div","node tnd");
        n.classList.add("fadein");
        n.appendChild(el("span","cv",""));
        n.appendChild(el("span","nid",""));
        n.appendChild(el("span","nstate",""));
        n.appendChild(el("span","nst",""));
        this.nodeEls.set(+id,n);
        this.tgrid.insertBefore(n,this.svg);
      }
      n.querySelector(".cv").textContent=String(nd.value);
      // ẩn id BFS — narrative dùng GIÁ TRỊ làm nhận diện, id chỉ gây nhầm
      n.querySelector(".nid").textContent="";
      const st=n.querySelector(".nstate");
      if(nd.state!==undefined&&nd.state!==null&&nd.state!==""){st.textContent=String(nd.state);st.style.display=""}
      else st.style.display="none";
      n.style.gridRow=(depth[+id]!==undefined?depth[+id]:0)+1;
      n.style.gridColumn=(pos[+id]!==undefined?pos[+id]:0)+1;
      n.style.display="";
      /* FLIP part 2: đo chênh lệch, đặt inverse translate rồi cho transition trượt về */
      const pr=this._prevRects.get(+id);
      if(pr&&pr.left!==0&&pr.width>0){
        const b=n.getBoundingClientRect();
        if(Math.abs(b.left-pr.left)+Math.abs(b.top-pr.top)>1){
          n.style.transition="none";
          n.style.transform="translate("+(pr.left-b.left)+"px,"+(pr.top-b.top)+"px)";
          void n.offsetWidth;
          n.style.transition="transform .45s cubic-bezier(.2,.7,.3,1)";
          n.style.transform="";
        }
      }
    }
    /* ẩn node cũ không còn trong dữ liệu */
    this.nodeEls.forEach((n,id)=>{
      if(!(id in data.nodes))n.style.display="none";
    });
    /* dây nối cha→con (SVG) */
    const arcs=[];
    for(const id in data.nodes){
      const nd=data.nodes[id];
      const px=(pos[+id]||0)*Wd+44,py=(depth[+id]||0)*L+44;
      if(nd.left!==null&&nd.left!==undefined&&nd.left!==-1&&data.nodes[nd.left]){
        const lx=(pos[nd.left]||0)*Wd+44,ly=(depth[nd.left]||0)*L+44;
        arcs.push("M"+px+" "+py+" L"+lx+" "+ly);
      }
      if(nd.right!==null&&nd.right!==undefined&&nd.right!==-1&&data.nodes[nd.right]){
        const rx=(pos[nd.right]||0)*Wd+44,ry=(depth[nd.right]||0)*L+44;
        arcs.push("M"+px+" "+py+" L"+rx+" "+ry);
      }
    }
    const tw=Math.max(88,(W-1)*Wd+88),th=Math.max(88,(H-1)*L+88);
    this.svg.setAttribute("width",tw);
    this.svg.setAttribute("height",th);
    this.svg.setAttribute("viewBox","0 0 "+tw+" "+th);
    this.svg.innerHTML=arcs.map(d=>"<path d='"+d+"' stroke='#2f3c5c' stroke-width='2' fill='none'/>").join("");
    this.box.style.minWidth=tw+"px";
  }
  _swapPairs(s){
    if(!s.swap)return[];
    const pairs=Array.isArray(s.swap)&&s.swap.length&&Array.isArray(s.swap[0])?s.swap:[s.swap];
    return pairs.filter(p=>p&&p.length===2);
  }
  _applyNodeHighlights(s){
    this.nodeEls.forEach(n=>{n.classList.remove("rd","wr","sw","act");const b=n.querySelector(".nst");if(b)b.style.display="none"});
    // badge "đọc"/"ghi" trên node đang tương tác (tree/ll)
    if(s.read)[].concat(s.read).forEach(r=>{
      const hit=this._markTarget(r.target,"rd");
      if(hit){const b=hit.querySelector&&hit.querySelector(".nst");if(b){b.textContent="đọc";b.style.display=""}}
    });
    if(s.write&&s.write.dest!==undefined&&!s.write.bake){
      const hit=this._markTarget(s.write.dest,"wr");
      if(hit){const b=hit.querySelector&&hit.querySelector(".nst");if(b){b.textContent="ghi";b.style.display=""}}
    }
    this._swapPairs(s).forEach(([a,b])=>{this._markTarget(a,"sw");this._markTarget(b,"sw")});
    // ptr → node-id: highlight + badge trên node
    if(s.ptr&&this.kind!=="array"&&this.kind!=="mat"){
      const names=Object.keys(s.ptr);
      const active=new Set();
      Object.values(s.ptr).forEach((v,vi)=>{
        const id=typeof v==="number"?v:(isNodeTarget(v)?v.node:-1);
        if(id<0)return;
        active.add(id);
        const n=this.nodeEls.get(id);
        if(n)n.classList.add("act");
        let b=n&&n.querySelector(".ptr-tag");
        if(n&&!b){b=el("span","ptr-tag",names[vi]||"?");b.style.cssText="position:absolute;top:-14px;left:50%;transform:translateX(-50%);z-index:3;white-space:nowrap";n.appendChild(b)}
        if(b)b.textContent=names[vi]||"?";
      });
      /* ẩn badge của node không còn con trỏ */
      this.nodeEls.forEach((n,id)=>{
        if(active.has(id))return;
        const b=n.querySelector(".ptr-tag");
        if(b)b.style.display="none";
      });
    }
  }
  /* ---------- render dữ liệu cell (array/mat/stack/hash/set) ---------- */
  renderCells(s){
    this.cellEls.forEach(x=>x.classList.remove("rd","wr","sw","act"));
    if(this.kind==="mat"){
      const cols=this._matCols();
      if(s.mat)s.mat.forEach((row,r)=>row.forEach((v,c)=>{const i=r*cols+c;const ce=this.cellEls[i];if(ce){const cv=ce.querySelector(".cv");if(cv)cv.textContent=String(v)}}));
      // write colored → tô xanh lục cho đúng ô
      this.cellEls.forEach(x=>x.classList.remove("colored"));
      if(s.write&&s.write.dest&&Array.isArray(s.write.dest)&&s.write.colored){
        const[r,c]=s.write.dest;const ce=this.cellEls[r*cols+c];
        if(ce)ce.classList.add("colored");
      }
    }else if(this.kind==="array"){
      const src=s.display||s.array;
      if(Array.isArray(src))src.forEach((v,p)=>{const cv=this.cellEls[p]&&this.cellEls[p].querySelector(".cv");if(cv&&cv.textContent!==String(v))cv.textContent=v});
    }else if(this.kind==="stack"){
      this.box.innerHTML="";this.cellEls=[];
      const arr=Array.isArray(s.stack)?s.stack:[];
      arr.forEach(v=>{const d=el("div","cell scol");d.appendChild(el("span","cv",v));this.cellEls.push(d);this.box.appendChild(d)});
      this.box.appendChild(this.topLabel);
    }else if(this.kind==="hash"){
      this.box.innerHTML="";this.cellEls=[];this.hashEls=[];
      const pairs=typeof s.hash==="object"&&!Array.isArray(s.hash)?Object.entries(s.hash):s.hash||[];
      pairs.forEach(([k,v])=>{const hp=el("div","hpair");hp.appendChild(el("span","hk",k));hp.appendChild(el("span","hv",v));this.cellEls.push(hp);this.hashEls.push(hp);this.box.appendChild(hp)});
    }else if(this.kind==="set"){
      this.box.innerHTML="";this.cellEls=[];
      const arr=s.set||[];
      arr.forEach(v=>{const d=el("div","sbadge");d.appendChild(el("span","cv",v));this.cellEls.push(d);this.box.appendChild(d)});
    }
    // highlight cell
    if(s.read)[].concat(s.read).forEach(r=>{this._markTarget(r.target,"rd")});
    if(s.write&&s.write.dest!==undefined&&!s.write.bake)this._markTarget(s.write.dest,"wr");
    const swapPairs=this._swapPairs(s);
    swapPairs.forEach(([a,b])=>{this._markTarget(a,"sw");this._markTarget(b,"sw")});
    if(s.cells)s.cells.forEach((c,i)=>{if(c&&c.active&&this.cellEls[i])this.cellEls[i].classList.add("act")});
    // stack: highlight top (ô cuối) + con trỏ dọc bên phải
    if(this.kind==="stack"){
      const top=this.cellEls[this.cellEls.length-1];
      if(top)top.classList.add("top");
      this.renderStackPtrs(s);
      return;
    }
    // hash highlight theo cặp
    if(this.kind==="hash"){
      this.hashEls.forEach(x=>x.classList.remove("rd","wr","sw"));
      if(s.read)[].concat(s.read).forEach(r=>{const c=this._markTarget(r.target,"rd");if(c&&c.classList)c.classList.add("rd")});
      if(s.write&&!s.write.bake)this._markTarget(s.write.dest,"wr");
      swapPairs.forEach(([a,b])=>{this._markTarget(a,"sw");this._markTarget(b,"sw")});
    }
    // ptr trên cell: định vị
    this.ptrEls.forEach(p=>{p.style.display="none";p.style.top="1px"});
    if(s.ptr&&(this.kind==="array"||this.kind==="mat")){
      let n=0;
      const names=Object.keys(s.ptr);
      Object.values(s.ptr).forEach(pos=>{
        const nm=names[n++]||"?";
        const p=this.ptrEls.get(nm);if(!p)return;
        p.style.display="block";
        if(Array.isArray(pos)&&this.kind==="mat"){
          const[r,c]=pos;p.style.left=(c*44+8)+"px";p.style.top=(r*40+1)+"px";
        }
        else if(typeof pos==="number")p.style.left=(pos*49+8)+"px";
      });
    }
  }
  renderStackPtrs(s){
    if(!this.stackPtrs)return;
    this.stackPtrs.innerHTML="";
    if(!s.ptr)return;
    Object.keys(s.ptr).forEach(name=>{
      const pos=s.ptr[name];
      const tag=el("span","sph");
      tag.appendChild(el("span","ptr-tag",name));
      this.stackPtrs.appendChild(tag);
    });
  }
  /* ---------- aux (mảng phụ bên cạnh, vd nums2 / rotated) ---------- */
  renderAux(s){
    const a=s.aux;
    this.auxBox.style.display=a?"flex":"none";
    this.auxBox.innerHTML="";
    if(!a)return;
    const rows=Array.isArray(a)?a:[a];
    rows.forEach(aux=>{
      const lbl=el("span","alabel",aux.label||"aux");
      this.auxBox.appendChild(lbl);
      const vals=aux.values||[];
      const ac=el("div","acells");
      const amap=[];
      vals.forEach(v=>{
        const d=el("div","acell");
        d.appendChild(el("span","cv",String(v)));
        ac.appendChild(d);amap.push(d);
      });
      this.auxBox.appendChild(ac);
      const tgt=pos=>Array.isArray(pos)&&pos.length===1?pos[0]:(typeof pos==="number"?pos:-1);
      const hlAux=(i,cls)=>{if(i>=0&&i<amap.length)amap[i].classList.add(cls)};
      if(s.read)[].concat(s.read).forEach(r=>{if(r&&!isNodeTarget(r.target))hlAux(tgt(r.target),"rd")});
      if(s.write&&!s.write.bake&&!isNodeTarget(s.write.dest))hlAux(tgt(s.write.dest),"wr");
      if(s.swap)[].concat(s.swap).forEach(pair=>{if(pair&&pair.length)[0,1].forEach(k=>{if(!isNodeTarget(pair[k]))hlAux(tgt(pair[k]),"sw")})});
    });
  }
  /* ---------- note + end ---------- */
  renderNote(s){
    // ưu tiên narrative (explain) do content viết; fallback note động
    const txt = (s.explain && s.explain.trim()) ? s.explain : s.note;
    this.note.textContent=txt;
    this.note.classList.toggle("fin",!!s.end);
    const old=this.host.querySelector(".result");if(old)old.remove();
    if(s.end){const r=el("span","result",s.k!==undefined?" · k = "+s.k:(s.answer!==undefined?" · đáp án: "+s.answer:""));if(r.textContent)this.note.appendChild(r)}
  }
  stepTo(i){
    this.idx=Math.max(0,Math.min(this.steps.length-1,i));
    const s=this.steps[this.idx];
    if(this.kind==="ll"||this.kind==="tree"||this.kind==="graph")this.renderNodes(s);
    else this.renderCells(s);
    this.renderAux(s);
    this.renderCode(s);
    this.renderNote(s);
    this.counter.textContent=(this.idx+1)+" / "+this.steps.length;
    this.range.value=this.idx;
  }
}

/* ---------- renderer ---------- */
function render(){
  if(!DATA){document.getElementById("content").textContent="(Dữ liệu chưa được nhúng — chạy build script trước)";return}
  const g=DATA.group;
  document.title=g.title+" — Top Interview 150";
  document.getElementById("grpChip").textContent=g.count+" bài";
  document.getElementById("grpTitle").textContent=g.title;
  document.getElementById("grpDesc").textContent=g.desc||"";
  const toc=document.getElementById("toc");
  toc.innerHTML="";
  DATA.problems.forEach(p=>{
    const a=el("a","grp");a.href="#p"+p.no;
    a.appendChild(el("span","ic",p.done?"✅":"📄"));
    const d=el("span");d.appendChild(el("b","",p.no+" · "+p.title));
    d.appendChild(el("small","",p.cat+" · "+p.diff));
    a.appendChild(d);toc.appendChild(a);
  });
  const main=document.getElementById("content");
  main.innerHTML="";
  DATA.problems.forEach(p=>main.appendChild(renderProblem(p)));
  const foot=document.getElementById("foot");
  foot.textContent="Top Interview 150 · "+g.title+" · nội dung tiếng Việt · giải Python có test thật · tạo 2026-08-15";
}
function renderProblem(p){
  const s=el("section","card");s.id="p"+p.no;
  const top=el("div","sec-top");
  top.appendChild(el("h2","",p.no+" · "+p.title));
  top.appendChild(el("span","tag "+(p.diff||"easy").toLowerCase(),p.diff||"Easy"));
  top.appendChild(el("span","tag",p.cat));
  s.appendChild(top);
  s.appendChild(el("p","stmt",p.statement));
  if(p.examples)s.appendChild(el("p","ex",p.examples));
  if(p.keyIdea)s.appendChild(el("div","idea ✨ Ý tưởng chính: "+p.keyIdea));
  p.approaches.forEach((ap,i)=>{
    const sol=el("div","sol");
    const h=el("h4");
    h.appendChild(el("span","",["①","②","③"][i]+" "+ap.name));
    if(ap.time&&ap.space)h.appendChild(el("span","meta",ap.time+" · "+ap.space));
    sol.appendChild(h);
    if(ap.idea)sol.appendChild(el("p","stmt",ap.idea));
    if(ap.code){const pre=el("pre","code");pre.innerHTML=hlpy(ap.code);sol.appendChild(pre)}
    if(ap.steps){
      if(ap.anim){const run=el("div","run");sol.appendChild(run);requestAnimationFrame(()=>new Player(run,ap.steps,{problem:p.no,approach:ap.name,code:ap.code}))}
      else{
        sol.appendChild(el("p","steps-desc","Các bước (tự luyện: che code rồi viết lại):"));
        const box=el("div","steps");
        ap.steps.forEach((st,j)=>{const l=el("div","step-line");l.appendChild(el("span","sno",String(j+1)));l.appendChild(el("span","",st.note));box.appendChild(l)});
        sol.appendChild(box);
      }
    }
    s.appendChild(sol);
  });
  return s;
}
document.addEventListener("DOMContentLoaded",render);
