<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top Interview 150 — Học theo nhóm</title>
<style>
:root{
  --bg:#0d1017; --panel:#141926; --panel2:#1a2130; --ink:#eaf0f8; --mut:#8f9ab2;
  --line:#242c3e; --acc:#7aa2ff; --acc2:#38d3f0; --ok:#3ddc97; --warn:#ffb454; --bad:#ff6b81;
  --inksoft:#c9d2e3;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);background-image:radial-gradient(#1d2434 1px,transparent 1px);background-size:26px 26px;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
a{color:var(--acc)}
a:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--acc2);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 90px}
.hero{padding:10px 0 20px;border-bottom:1px solid var(--line);margin-bottom:26px}
.chip{display:inline-block;padding:3px 12px;border-radius:999px;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);color:var(--mut);background:var(--panel);margin:2px 6px 0 0}
.hero h1{font-size:27px;margin:10px 0 8px;text-wrap:balance}
.hero p{color:var(--mut);margin:6px 0 0;max-width:850px}

/* ---------- index / toc ---------- */
.grp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:16px 0 28px}
.grp{text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px 12px;display:flex;gap:10px;align-items:center;transition:border-color .15s}
.grp:hover{border-color:var(--acc)}
.grp .ic{font-size:20px}
.grp b{font-size:14px}
.grp small{display:block;color:var(--mut);font-size:11.5px}

/* ---------- problem ---------- */
section.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 26px;margin:30px 0;scroll-margin-top:16px}
.sec-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-top h2{margin:0;font-size:21px;text-wrap:balance}
.tag{font-size:12px;letter-spacing:.04em;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.tag.easy{color:#a7f3d0;border-color:#14532d;background:#052e16}
.tag.medium{color:#fde68a;border-color:#78350f;background:#2c1a05}
.tag.hard{color:#fecaca;border-color:#7f1d1d;background:#2a0a0a}
.stmt{color:var(--inksoft);margin:12px 0 4px;line-height:1.7}
.ex{color:var(--mut);font-size:14px}
code{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0b0e16;border:1px solid var(--line);border-radius:6px;padding:1px 5px;color:var(--acc2)}
.idea{background:#101a2e;border-left:3px solid var(--acc2);border-radius:0 12px 12px 0;padding:11px 15px;margin:13px 0;font-size:14.5px;color:var(--inksoft)}

/* ---------- solution ---------- */
.sol{border-top:1px dashed var(--line);margin-top:22px;padding-top:18px}
.sol h4{font-size:16px;margin:0 0 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;text-wrap:balance}
.sol h5{font-size:14.5px;margin:14px 0 6px;color:var(--acc2)}
.meta{font-size:13px;color:var(--mut)}
.pill{display:inline-block;padding:3px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:12.5px;margin-right:8px;margin-bottom:4px}
.pill b{color:var(--acc)}
pre.code{background:#0b0e16;border:1px solid var(--line);border-radius:13px;padding:14px 16px;overflow-x:auto;font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:9px 0}
pre.code .k{color:#c792ea} pre.code .f{color:#82aaff} pre.code .n{color:#f78c6c}
pre.code .s{color:#c3e88d} pre.code .c{color:#5c6478;font-style:italic} pre.code .o{color:#89ddff}
.steps-desc{color:var(--mut);font-size:14px;margin:8px 0}

/* ---------- static steps ---------- */
.steps{display:flex;flex-direction:column;gap:7px;margin:10px 0}
.step-line{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:13.5px;color:var(--inksoft)}
.step-line .sno{color:var(--acc2);font-weight:700;font-variant-numeric:tabular-nums;min-width:22px}

/* ---------- interactive player ---------- */
.run{border:1px solid var(--line);border-radius:13px;background:var(--panel2);padding:13px 15px;margin:11px 0}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:5px 11px;font-size:14px;transition:.12s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.sp{font-size:13px;color:var(--mut);margin-right:6px;font-variant-numeric:tabular-nums}
.rng{flex:1;min-width:130px;accent-color:var(--acc)}
.note{font-size:14px;color:var(--inksoft);margin:0 0 9px;min-height:21px}
.note.fin{color:var(--ok)}
.cells-wrap{position:relative;padding:13px 4px 4px;min-height:56px}
.cells{display:flex;gap:7px;flex-wrap:wrap}
.cell{position:relative;width:42px;height:40px;border:1.5px solid #39415c;border-radius:9px;background:#141828;display:grid;place-items:center;transition:background .18s,border-color .18s;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.cell.dead{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(255,255,255,.05) 6px 12px);border-style:dashed;color:#5b6377}
.cell.keep{background:#153a2b;border-color:#2f7d5a;color:#d1fae5}
.cell.rd{background:#4a2c10;border-color:var(--warn);animation:pulse .5s}
.cell.wr{background:#1a2f5c;border-color:var(--acc);animation:pulse .5s}
.cell.sw{background:#4c1120;border-color:var(--bad)}
.cell.act{background:#33250a;border-color:var(--warn)}
/* ô bị hoán đổi: nhấp nhẹ (chuyển cảnh mượt cho swap) */
.cell.sw{animation:swwig .38s ease}
@keyframes swwig{0%,100%{transform:translateX(0)}30%{transform:translateX(-7px)}55%{transform:translateX(5px)}75%{transform:translateX(-2px)}}
.ci{position:absolute;bottom:-15px;left:0;right:0;text-align:center;font-size:10px;color:#5b6377;font-variant-numeric:tabular-nums}
/* ---------- player v2: mat / node (ll/tree) / stack / hash / set / aux ---------- */
.run:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
/* mat */
.cells.mat{flex-direction:column;gap:6px;flex-wrap:nowrap;width:max-content}
.mrow{display:flex;gap:6px}
.cell.mcell{width:38px;height:34px;font-size:13px;border-radius:6px}
.cell.tail{border-style:dashed;color:#7d8aa5}
.cell.colored{background:#12402c;border-color:var(--ok)}
/* stack */
.cells.stack{flex-direction:column-reverse;align-items:center;gap:6px;width:78px;border:1.5px solid #39415c;border-top:none;border-radius:0 0 10px 10px;padding:10px 8px 7px;background:#0f1522;min-height:66px}
.cell.scol{width:56px;height:34px;font-size:13px;border-radius:6px}
.cell.top{border-color:var(--warn)}
.topb{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--warn);margin-top:3px;text-transform:uppercase}
.stack-row{display:flex;gap:12px;align-items:stretch}
.stack-ptrs{display:flex;flex-direction:column-reverse;justify-content:flex-start;gap:6px;padding:10px 0 7px}
.sph{min-height:40px;display:flex;align-items:center}
.ptr-tag{font-size:10.5px;font-weight:700;color:var(--acc2);background:#0b1e2b;border:1px solid #1e5a6f;border-radius:4px;padding:1px 6px;white-space:nowrap}
/* ll + tree: node dùng chung */
.cells.tree,.cells.ll{display:block}
.tbox{position:relative;overflow-x:auto;padding:14px 0 20px}
.tgrid{position:relative;display:grid;margin:0 auto}
.tgrid svg{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
.llrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.node{position:relative;min-width:46px;height:40px;padding:0 8px;border:1.5px solid #39415c;border-radius:9px;background:#141828;display:grid;place-items:center;transition:background .18s,border-color .18s;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.node.rd{background:#4a2c10;border-color:var(--warn);animation:pulse .5s}
.node.wr{background:#1a2f5c;border-color:var(--acc);animation:pulse .5s}
.node.sw{background:#4c1120;border-color:var(--bad)}
.node.act{background:#33250a;border-color:var(--warn)}
.node.tnd{width:44px;height:44px;min-width:44px;border-radius:50%;justify-self:center;align-self:center}
.nid{position:absolute;bottom:-15px;left:0;right:0;text-align:center;font-size:9.5px;color:#5b6377;font-variant-numeric:tabular-nums}
.nstate{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:9px;background:#1b2740;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--acc2);white-space:nowrap;z-index:2}
.arrow{color:var(--mut);font-size:16px;font-weight:700;padding:0 2px;align-self:center}
/* node mới xuất hiện: fade-in (trơn, không nhảy) */
.node.fadein{animation:fadein .35s ease-out}
@keyframes fadein{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
/* hash */
.cells.hash{flex-direction:column;gap:5px;width:max-content}
.hpair{display:flex;align-items:center;gap:8px;border:1px solid #2a3550;border-radius:8px;background:#101828;padding:2px 4px;transition:background .18s,border-color .18s}
.hpair.rd{background:#4a2c10;border-color:var(--warn);animation:pulse .5s}
.hpair.wr{background:#1a2f5c;border-color:var(--acc);animation:pulse .5s}
.hpair.sw{background:#4c1120;border-color:var(--bad)}
.hk{min-width:42px;text-align:center;font-weight:700;color:var(--acc);font-size:12.5px;background:#16203a;border-radius:6px;padding:2px 6px}
.hv{font-weight:600;font-size:13.5px;padding:2px 7px;font-variant-numeric:tabular-nums;min-width:24px;color:var(--inksoft)}
/* set */
.cells.set{gap:6px;flex-wrap:wrap}
.sbadge{border:1px solid #3a4560;border-radius:999px;background:#101828;padding:4px 13px;font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums}
.sbadge.rd{background:#4a2c10;border-color:var(--warn);animation:pulse .5s}
.sbadge.wr{background:#1a2f5c;border-color:var(--acc);animation:pulse .5s}
.sbadge.sw{background:#4c1120;border-color:var(--bad)}
/* aux */
.aux{display:flex;align-items:center;gap:9px;margin-top:8px;flex-wrap:wrap}
.alabel{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.acells{display:flex;gap:5px}
.acell{min-width:30px;height:26px;border:1px solid #3a4560;border-radius:6px;background:#121a2a;display:grid;place-items:center;font-size:12.5px;font-weight:600;padding:0 7px;font-variant-numeric:tabular-nums;transition:background .18s,border-color .18s}
.acell.rd{background:#4a2c10;border-color:var(--warn)}
.acell.wr{background:#1a2f5c;border-color:var(--acc)}
.acell.sw{background:#4c1120;border-color:var(--bad)}
.note .result{color:var(--acc2);font-weight:700}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
.ptrs{position:absolute;inset:0;pointer-events:none}
.ptr{position:absolute;top:1px;font-size:11px;font-weight:700;color:var(--acc2);transform:translateX(-50%);background:#0b1e2b;border:1px solid #1e5a6f;border-radius:5px;padding:1px 6px;white-space:nowrap;transition:left .3s cubic-bezier(.2,.7,.3,1),top .3s cubic-bezier(.2,.7,.3,1)}
@media (max-width:640px){.wrap{padding:14px 10px 70px}section.card{padding:16px 12px}.cell{width:36px;height:34px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* code pane + dòng đang chạy */
pre.code.pane{position:relative;margin:8px 0;border-left:3px solid var(--acc2);font-size:12.5px;max-height:180px;overflow-y:auto}
pre.code .curline{background:rgba(122,162,255,.14);box-shadow:inset 3px 0 0 var(--acc);border-radius:3px}
pre.code.pane .curline{background:rgba(122,162,255,.16)}
/* region (khung vùng hoạt động) */
.region{position:absolute;border:2px dashed var(--acc2);border-radius:8px;pointer-events:none;opacity:.55;transition:all .15s;z-index:2}

/* badge đọc/ghi trên node cây */
.nst{position:absolute;top:-9px;right:-12px;font-size:9px;font-weight:700;background:#0b1e2b;border:1px solid #1e5a6f;border-radius:4px;padding:0 4px;color:var(--acc2);z-index:4;display:none}
.node.rd .nst{display:block;border-color:var(--warn);color:var(--warn);background:#33250a}
.node.wr .nst{display:block;border-color:var(--acc);color:var(--acc);background:#0b1e2b}
/* ---------- graph (force-directed SVG) ---------- */
.graph-box{position:relative;width:100%;min-height:220px;border:1px solid var(--line);border-radius:12px;background:radial-gradient(#151d2e 1px,transparent 1px);background-size:24px 24px;overflow:hidden}
.graph-box svg{display:block;width:100%;height:100%}
.gedge{stroke:#2f3c5c;stroke-width:1.6px;transition:stroke .18s}
.gnode circle{fill:#141c30;stroke:#3a4560;stroke-width:1.8px;cursor:default;transition:fill .18s,stroke .18s,r .18s}
.gnode text{fill:var(--ink);font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:central;font-variant-numeric:tabular-nums;pointer-events:none}
.gnode.rd circle{fill:#4a2c10;stroke:var(--warn);animation:pulse .5s}
.gnode.wr circle{fill:#1a2f5c;stroke:var(--acc);animation:pulse .5s}
.gnode.act circle{fill:#33250a;stroke:var(--warn)}
.gnode.done circle{fill:#153a2b;stroke:#2f7d5a}
.edge-rd{stroke:var(--warn)!important;stroke-width:2.6px}
.edge-wr{stroke:var(--acc)!important;stroke-width:2.6px}
.graph-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:7px;font-size:11.5px;color:var(--mut)}
.graph-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid #3a4560;margin-right:4px;vertical-align:-1px}
.graph-legend .r i{background:#4a2c10;border-color:var(--warn)}
.graph-legend .w i{background:#1a2f5c;border-color:var(--acc)}
.graph-legend .a i{background:#33250a;border-color:var(--warn)}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
  <div>
    <span class="chip">Top Interview 150</span>
    <span class="chip" id="grpChip"></span>
    <span class="chip">Python · tiếng Việt</span>
  </div>
  <h1 id="grpTitle"></h1>
  <p id="grpDesc"></p>
</header>
<nav class="toc" id="toc"></nav>
<main id="content"></main>
<footer id="foot"></footer>
</div>

<script>
"use strict";
/*
 * traces150.js — trace animation cho các bài ngoài 6 bài gốc (Top Interview 150).
 * Nguyên tắc như traces.js: mỗi hàm nhận input, trả mảng step {note, cells, array, read, write, swap, ptr, ptrNames, end}.
 * Bước 1 làm quen với 4 thuật toán kinh điển.
 */
'use strict';

function at150(arr, i) { return { target: [i], value: arr[i] }; }

/* ============ 121 Best Time to Buy and Sell Stock ============ */
function trace_stock(input) {
  const { prices } = input;
  const steps = [];
  let buy = prices[0], profit = 0;
  const push = (note, patch, end) => {
    const cells = prices.map((v, idx) => ({ value: v, keep: idx === 0 ? false : false }));
    steps.push(Object.assign({ note, cells, array: prices.slice() }, patch, end ? { end: true, answer: profit } : {}));
  };
  push(`init: buy = prices[0] = ${buy}, max profit = 0. Duyệt từ ngày 1.`, { ptr: { buy: 0, i: 0 } });
  for (let i = 1; i < prices.length; i++) {
    if (prices[i] < buy) {
      buy = prices[i];
      push(`prices[${i}] = ${prices[i]} < buy ${prices[i - 1] > prices[i] ? '(giảm so với trước)' : ''} → cập nhật buy = ${prices[i]} (mua rẻ hơn, bỏ qua mức lời cũ chưa tốt hơn).`,
        { read: at150(prices, i), ptr: { buy: i, i }, ptrNames: ['buy', 'i'] });
    } else {
      const p = prices[i] - buy;
      const better = p > profit;
      profit = Math.max(profit, p);
      push(`prices[${i}] = ${prices[i]} ≥ buy ${buy} → lời nếu bán ở đây = ${p}. ${better ? 'Cập nhật max profit = ' + p + '!' : 'Chưa hơn max profit hiện tại (' + profit + ').'}`,
        { read: at150(prices, i), ptr: { buy: i, i }, ptrNames: ['buy', 'i'] });
    }
  }
  push(`Xong: max profit = ${profit} (mua ở ${buy}, các ngày sau là nơi bán tối ưu).`, {}, true);
  return steps;
}

/* ============ 122 Best Time to Buy and Sell Stock II ============ */
function trace_stock_ii(input) {
  const { prices } = input;
  const steps = [];
  let profit = 0, last = prices[0];
  const push = (note, patch, end) => {
    const cells = prices.map((v) => ({ value: v }));
    steps.push(Object.assign({ note, cells, array: prices.slice() }, patch, end ? { end: true, answer: profit } : {}));
  };
  push(`init: profit = 0, last = prices[0] = ${last}.`, { ptr: { last: 0, i: 0 } });
  for (let i = 1; i < prices.length; i++) {
    if (prices[i] > last) {
      profit += prices[i] - last;
      push(`prices[${i}] = ${prices[i]} > ${last} → gom ${prices[i] - last} (bán ngay lập tức). profit = ${profit}.`,
        { read: at150(prices, i), ptr: { last: i, i }, ptrNames: ['last', 'i'] });
    } else {
      push(`prices[${i}] = ${prices[i]} ≤ ${last} → không giao dịch (chờ giá lên).`,
        { read: at150(prices, i), ptr: { last: i, i }, ptrNames: ['last', 'i'] });
    }
    last = prices[i];
  }
  push(`Xong: tổng lợi nhuận ${profit} — cộng dồn MỌI bước tăng liên tiếp.`, {}, true);
  return steps;
}

/* ============ 15 3Sum ============ */
function trace_3sum(input) {
  const { nums } = input;
  const a = nums.slice().sort((x, y) => x - y);
  const res = [];
  const steps = [];
  const push = (note, patch, end) => {
    const cells = a.map((v) => ({ value: v }));
    steps.push(Object.assign({ note, cells, array: a.slice() }, patch, end ? { end: true, answer: res.length + ' bộ ba' } : {}));
  };
  push('Sắp xếp mảng để dùng hai con trỏ.', {});
  for (let i = 0; i < a.length - 2; i++) {
    if (i > 0 && a[i] === a[i - 1]) { push(`a[${i}] = ${a[i]} trùng a[${i - 1}] → bỏ qua để tránh bộ ba trùng.`, { ptr: { i }, ptrNames: ['i'] }); continue; }
    let lo = i + 1, hi = a.length - 1;
    push(`Cố định a[${i}] = ${a[i]}; lo = ${lo}, hi = ${hi}. Tìm cặp (lo, hi) sao cho tổng = 0.`, { ptr: { i, lo, hi }, ptrNames: ['i', 'lo', 'hi'] });
    while (lo < hi) {
      const s = a[i] + a[lo] + a[hi];
      if (s === 0) {
        res.push([a[i], a[lo], a[hi]]);
        push(`tổng ${a[i]} + ${a[lo]} + ${a[hi]} = 0 → ghi nhận bộ ba.`, { read: [at150(a, i), at150(a, lo), at150(a, hi)], ptr: { i, lo, hi }, ptrNames: ['i', 'lo', 'hi'] });
        const x = a[lo], y = a[hi];
        while (lo < hi && a[lo] === x) lo++;
        while (lo < hi && a[hi] === y) hi--;
        push(`Nhảy qua các giá trị trùng (lo → ${lo}, hi → ${hi}) để không lặp bộ ba.`, { ptr: { i, lo, hi }, ptrNames: ['i', 'lo', 'hi'] });
      } else if (s < 0) {
        lo++;
        push(`tổng = ${s} < 0 → tăng lo lên ${lo} (cần tổng lớn hơn).`, { read: [at150(a, lo - 1)], ptr: { i, lo, hi }, ptrNames: ['i', 'lo', 'hi'] });
      } else {
        hi--;
        push(`tổng = ${s} > 0 → giảm hi xuống ${hi} (cần tổng nhỏ hơn).`, { read: [at150(a, hi + 1)], ptr: { i, lo, hi }, ptrNames: ['i', 'lo', 'hi'] });
      }
    }
  }
  push(`Xong: ${res.length} bộ ba`, {}, true);
  return steps;
}

/* ============ 11 Container With Most Water ============ */
function trace_container(input) {
  const { height } = input;
  const steps = [];
  let l = 0, r = height.length - 1, best = 0;
  const push = (note, patch, end) => {
    const cells = height.map((v) => ({ value: v }));
    steps.push(Object.assign({ note, cells, array: height.slice() }, patch, end ? { end: true, answer: best } : {}));
  };
  push(`Hai con trỏ: l = ${l}, r = ${r}. Diện tích = chiều cao thấp hơn × khoảng cách.`, { ptr: { l, r }, ptrNames: ['l', 'r'] });
  while (l < r) {
    const w = r - l;
    const area = Math.min(height[l], height[r]) * w;
    best = Math.max(best, area);
    const goLeft = height[l] < height[r];
    push(`Cặp (${l}, ${r}): diện tích = ${Math.min(height[l], height[r])} × ${w} = ${area} → best = ${best}. ${goLeft ? 'Cạnh trái thấp hơn → dịch l++' : 'Cạnh phải thấp hơn → dịch r--'} (giữ cạnh cao hơn để còn triển vọng).`,
      { read: [at150(height, l), at150(height, r)], ptr: { l: l + (goLeft ? 1 : 0), r: r - (goLeft ? 0 : 1) }, ptrNames: ['l', 'r'] });
    if (goLeft) l++; else r--;
  }
  push(`Xong: thể tích nước tối đa = ${best}.`, {}, true);
  return steps;
}

/* ============ 3 Longest Substring Without Repeating Characters ============ */
function trace_longest_substr(input) {
  const { s } = input;
  const steps = [];
  let l = 0, best = 0;
  const seen = new Map();
  const push = (note, patch, end) => {
    const cells = s.split('').map((v) => ({ value: v }));
    steps.push(Object.assign({ note, cells, array: s.split('') }, patch, end ? { end: true, answer: best } : {}));
  };
  push(`Cửa sổ [l, r): ký tự trong cửa sổ đều là duy nhất. best = 0.`, { ptr: { l, r: 0 }, ptrNames: ['l', 'r'] });
  for (let r = 0; r < s.length; r++) {
    const c = s[r];
    if (seen.has(c) && seen.get(c) >= l) {
      const old = l;
      l = seen.get(c) + 1;
      push(`Gặp '${c}' đã xuất hiện ở vị trí ${seen.get(c)} (đang trong cửa sổ) → dịch l từ ${old} lên ${l}.`,
        { read: at150(s.split(''), r), ptr: { l, r }, ptrNames: ['l', 'r'] });
    }
    seen.set(c, r);
    best = Math.max(best, r - l + 1);
    push(`Thêm '${c}' vào cửa sổ [${l}, ${r}]. best = ${best} (đoạn dài nhất không trùng).`,
      { read: at150(s.split(''), r), ptr: { l, r }, ptrNames: ['l', 'r'] });
  }
  push(`Xong: độ dài lớn nhất = ${best}.`, {}, true);
  return steps;
}

/* ============ 209 Minimum Size Subarray Sum ============ */
function trace_min_subarray(input) {
  const { nums, target } = input;
  const steps = [];
  let l = 0, sum = 0, best = Infinity;
  const push = (note, patch, end) => {
    const cells = nums.map((v) => ({ value: v }));
    steps.push(Object.assign({ note, cells, array: nums.slice() }, patch, end ? { end: true, answer: best === Infinity ? 0 : best } : {}));
  };
  push(`Cửa sổ [l, r): sum = tổng trong cửa sổ. Mở rộng r khi sum < ${target}, thu hẹp l khi sum ≥ ${target}.`, { ptr: { l, r: 0 }, ptrNames: ['l', 'r'] });
  for (let r = 0; r < nums.length; r++) {
    sum += nums[r];
    push(`Thêm nums[${r}] = ${nums[r]} → sum = ${sum}.`, { read: at150(nums, r), ptr: { l, r }, ptrNames: ['l', 'r'] });
    while (sum >= target && l <= r) {
      const len = r - l + 1;
      best = Math.min(best, len);
      const removed = nums[l];
      push(`sum ${sum} ≥ ${target} → cửa sổ [${l}, ${r}] dài ${len} hợp lệ. best = ${best}. Thu hẹp l (bỏ ${removed}).`,
        { read: at150(nums, l), ptr: { l: l + 1, r }, ptrNames: ['l', 'r'] });
      sum -= removed;
      l++;
    }
  }
  push(`Xong: chiều dài ngắn nhất = ${best === Infinity ? 0 : best}.`, {}, true);
  return steps;
}

/* ============ 238 Product of Array Except Self ============ */
function trace_product_except_self(input) {
  const { nums } = input;
  const steps = [];
  const n = nums.length;
  const res = new Array(n).fill(1);
  const push = (note, patch, end) => {
    const cells = nums.map((v) => ({ value: v }));
    steps.push(Object.assign({ note, cells, array: nums.slice(), aux: { label: 'ans', values: res.slice() } }, patch, end ? { end: true, answer: res.slice() } : {}));
  };
  push('Ý tưởng: ans[i] = tích các phần tử bên trái × tích các phần tử bên phải. Duyệt 2 lần.', { aux: { label: 'ans', values: res.slice() } });
  let left = 1;
  for (let i = 0; i < n; i++) {
    res[i] = left;
    push(`Lượt trái: ans[${i}] = tích các phần tử nhỏ hơn ${i} = ${left}.`, { read: at150(nums, i), aux: { label: 'ans', values: res.slice() } });
    left *= nums[i];
  }
  let right = 1;
  for (let i = n - 1; i >= 0; i--) {
    res[i] *= right;
    push(`Lượt phải: ans[${i}] *= tích các phần tử lớn hơn ${i} = ${right} → ${res[i]}.`, { read: at150(nums, i), aux: { label: 'ans', values: res.slice() } });
    right *= nums[i];
  }
  push(`Xong: ans = ${res.join(', ')}. Mỗi ans[i] = tích mọi phần tử trừ nums[i] — O(1) phụ.`, {}, true);
  return steps;
}

/* ============ 125 Valid Palindrome ============ */
function trace_valid_palindrome(input) {
  const { s } = input;
  const text = s.toLowerCase().replace(/[^a-z0-9]/g, '');
  const steps = [];
  const push = (note, patch, end) => {
    const cells = text.split('').map((v) => ({ value: v }));
    steps.push(Object.assign({ note, cells, array: text.split('') }, patch, end ? { end: true, answer: true } : {}));
  };
  push(`Lọc chuỗi: giữ chữ & số, viết thường → '${text}'. Giờ kiểm tra palindrome bằng hai con trỏ.`,
    { ptr: { l: 0, r: text.length - 1 }, ptrNames: ['l', 'r'] });
  let l = 0, r = text.length - 1;
  while (l < r) {
    if (text[l] !== text[r]) {
      push(`'${text[l]}' ≠ '${text[r]}' → KHÔNG phải palindrome.`, { read: [at150(text.split(''), l), at150(text.split(''), r)], ptr: { l, r }, ptrNames: ['l', 'r'] }, true);
      steps[steps.length - 1].answer = false;
      return steps;
    }
    push(`'${text[l]}' = '${text[r]}' → tiếp tục thu hẹp.`, { read: [at150(text.split(''), l), at150(text.split(''), r)], ptr: { l: l + 1, r: r - 1 }, ptrNames: ['l', 'r'] });
    l++; r--;
  }
  push('Hai con trỏ gặp nhau → chuỗi là palindrome.', {}, true);
  return steps;
}

/* ============ 392 Is Subsequence ============ */
function trace_is_subsequence(input) {
  const { s, t } = input;
  const steps = [];
  let i = 0, j = 0;
  const push = (note, patch, end) => {
    const cells = t.split('').map((v) => ({ value: v }));
    steps.push(Object.assign({ note, cells, array: t.split('') }, patch, end ? { end: true, answer: i === s.length } : {}));
  };
  push(`Tìm ${s.length ? "mọi ký tự của '"+s+"'" : 'chuỗi rỗng'} trong '${t}' theo thứ tự. i = con trỏ s, j = con trỏ t.`,
    { ptr: { i, j }, ptrNames: ['i', 'j'] });
  while (i < s.length && j < t.length) {
    if (s[i] === t[j]) {
      push(`s[${i}] = '${s[i]}' trùng t[${j}] → khớp! i++, j++.`, { read: at150(t.split(''), j), ptr: { i: i + 1, j: j + 1 }, ptrNames: ['i', 'j'] });
      i++; j++;
    } else {
      push(`s[${i}] = '${s[i]}' ≠ t[${j}] = '${t[j]}' → chỉ tăng j (bỏ qua ký tự trong t).`,
        { read: at150(t.split(''), j), ptr: { i, j: j + 1 }, ptrNames: ['i', 'j'] });
      j++;
    }
  }
  push(i === s.length ? `Đã khớp toàn bộ '${s}' → subsequence.` : `Hết t trước khi khớp hết → không phải subsequence.`, {}, true);
  return steps;
}

/* ============ 167 Two Sum II - Input Array Is Sorted ============ */
function trace_two_sum_ii(input) {
  const { numbers, target } = input;
  const steps = [];
  let l = 0, r = numbers.length - 1;
  const push = (note, patch, end) => {
    const cells = numbers.map((v) => ({ value: v }));
    steps.push(Object.assign({ note, cells, array: numbers.slice() }, patch, end ? { end: true, answer: [l + 1, r + 1] } : {}));
  };
  push(`Mảng đã sắp tăng → bắt đầu l = 0, r = ${r}. Tổng hiện tại: ${numbers[l] + numbers[r]}.`, { ptr: { l, r }, ptrNames: ['l', 'r'] });
  while (l < r) {
    const s = numbers[l] + numbers[r];
    if (s === target) {
      push(`Tổng ${numbers[l]} + ${numbers[r]} = ${target} → đáp án 1-indexed: [${l + 1}, ${r + 1}].`,
        { read: [at150(numbers, l), at150(numbers, r)], ptr: { l, r }, ptrNames: ['l', 'r'] }, true);
      return steps;
    } else if (s < target) {
      l++;
      push(`Tổng ${s} < ${target} → tăng l lên ${l} (cần tổng lớn hơn; mảng tăng nên chỉ còn hướng này).`,
        { read: [at150(numbers, l - 1)], ptr: { l, r }, ptrNames: ['l', 'r'] });
    } else {
      r--;
      push(`Tổng ${s} > ${target} → giảm r xuống ${r}.`,
        { read: [at150(numbers, r + 1)], ptr: { l, r }, ptrNames: ['l', 'r'] });
    }
  }
  push('Không tìm thấy cặp.', {}, true);
  return steps;
}

best = max(best, cur) — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"i":5},"note":"i→5 — for i in range(1, len(nums)):","line":4,"array":[1,2,3,4,100,200],"explain":"Con trỏ i dịch tới 5 — phạm vi xét được thu hẹp"},{"ptr":{"i":5},"note":"i→5 — return best — Kết thúc — đáp án: 4 ✓ (khớp kỳ vọng)","line":9,"array":[1,2,3,4,100,200],"end":true,"answer":4,"explain":"→ Đáp án: 4 i=5"}],"anim":true}],"thinking":{"forward":"Bắt đầu đếm từ đầu chuỗi (số không có tiền thân) trong set.","reverse":"Cần chuỗi liên tiếp dài nhất → chỉ khởi động đếm từ điểm khởi đầu."},"note":"Đưa mọi số vào set; chỉ bắt đầu đếm từ số KHÔNG có số liền trước (n−1 ∉ set)."},{"no":"202","title":"Happy Number","cat":"Hashmap","diff":"Easy","statement":"'Hạnh phúc' nếu lặp tổng bình phương chữ số rồi về 1 (nếu vòng lặp không 1 thì không hạnh phúc).","examples":"19 → true (19→82→68→100→1) · 2 → false","keyIdea":"Chuỗi số hoặc hội tụ về 1, hoặc rơi vào chu kỳ — dùng set nhớ các số đã gặp để phát hiện vòng lặp.","approaches":[{"name":"Set phát hiện vòng lặp","time":"O(log n)","space":"O(log n)","idea":"Lặp tính tổng bình phương chữ số; nếu gặp lại → false, về 1 → true.","code":"def is_happy(n):\n    seen = set()\n    def ssum(x): return sum(int(d)**2 for d in str(x))\n    while n != 1:\n        if n in seen: return False\n        seen.add(n)\n        n = ssum(n)\n    return True","static":["Định nghĩa ssum(x) = tổng bình phương các chữ số của x.","Lặp: nếu n đã từng xuất hiện trong seen → vòng lặp, trả false.","Thêm n vào seen, tính n = ssum(n).","Nếu n về 1 → hạnh phúc, trả true.","Ví dụ 19 → 82 → 68 → 100 → 1 → true; 2 rơi vào chu kỳ → false."],"_pno":"202","steps":[{"note":"Định nghĩa ssum(x) = tổng bình phương các chữ số của x."},{"note":"Lặp: nếu n đã từng xuất hiện trong seen → vòng lặp, trả false."},{"note":"Thêm n vào seen, tính n = ssum(n)."},{"note":"Nếu n về 1 → hạnh phúc, trả true."},{"note":"Ví dụ 19 → 82 → 68 → 100 → 1 → true; 2 rơi vào chu kỳ → false."}],"anim":false},{"name":"Con trỏ thỏ rùa (Floyd)","time":"O(log n)","space":"O(1)","idea":"Dùng fast/slow để phát hiện chu kỳ không cần set — mẫu phát hiện vòng thường gặp.","code":"def is_happy(n):\n    def ssum(x): return sum(int(d)**2 for d in str(x))\n    slow = n; fast = ssum(n)\n    while fast != 1 and slow != fast:\n        slow = ssum(slow)\n        fast = ssum(ssum(fast))\n    return fast == 1","static":["Khởi tạo slow = n, fast = ssum(n) (thỏ và rùa).","Mỗi bước: slow tiến 1, fast tiến 2 (ssum hai lần).","Nếu fast về 1 → hạnh phúc.","Nếu slow == fast (gặp nhau) → có chu kỳ, không hạnh phúc.","Ví dụ 19: không gặp chu kỳ, về 1 → true."],"_pno":"202","steps":[{"note":"Khởi tạo slow = n, fast = ssum(n) (thỏ và rùa)."},{"note":"Mỗi bước: slow tiến 1, fast tiến 2 (ssum hai lần)."},{"note":"Nếu fast về 1 → hạnh phúc."},{"note":"Nếu slow == fast (gặp nhau) → có chu kỳ, không hạnh phúc."},{"note":"Ví dụ 19: không gặp chu kỳ, về 1 → true."}],"anim":false},{"name":"Giới hạn 100 bước","time":"O(1)","space":"O(1)","idea":"Thực tế chuỗi happy chỉ quanh quẩn trong một miền hữu hạn; đủ 100 bước là biết.","code":"def is_happy(n):\n    for _ in range(100):\n        n = sum(int(d)**2 for d in str(n))\n        if n == 1: return True\n    return False","static":["Lặp tối đa 100 bước — miền giá trị happy bị chặn.","Mỗi bước: n = tổng bình phương các chữ số của n.","Nếu n == 1 trước khi hết 100 bước → hạnh phúc.","Hết 100 bước mà không về 1 → false.","Ví dụ 19 hội tụ về 1 sau 4 bước → true; 2 thì không."],"_pno":"202","steps":[{"note":"Lặp tối đa 100 bước — miền giá trị happy bị chặn."},{"note":"Mỗi bước: n = tổng bình phương các chữ số của n."},{"note":"Nếu n == 1 trước khi hết 100 bước → hạnh phúc."},{"note":"Hết 100 bước mà không về 1 → false."},{"note":"Ví dụ 19 hội tụ về 1 sau 4 bước → true; 2 thì không."}],"anim":false}],"thinking":{"forward":"Lặp tính tổng bình phương các chữ số; nếu tổng về 1 thì hạnh phúc; nếu rơi vào chu trình đã gặp thì false.","reverse":"Cần xác định có bao giờ về 1 không → theo dõi các số đã gặp (set); chu trình hoặc lặp lại số cũ đều kết luận được."},"note":"Chuỗi số hoặc hội tụ về 1, hoặc rơi vào chu kỳ — dùng set nhớ các số đã gặp để phát hiện vòng lặp."},{"no":"205","title":"Isomorphic Strings","cat":"Hashmap","diff":"Easy","statement":"Hai chuỗi đẳng cấu (isomorphic) nếu có phép thay ký tự 1-1 ánh xạ s → t.","examples":"\"egg\"→\"add\" true · \"foo\"→\"bar\" false · \"paper\"→\"title\" true","keyIdea":"Ánh xạ hai chiều: mỗi ký tự s phải luôn khớp 1 ký tự t và ngược lại.","approaches":[{"name":"Hai dict ánh xạ","time":"O(n)","space":"O(1)","idea":"map_sx và map_tx: nếu đã gán mà khác → false; nếu cả hai chưa gán thì gán cả hai chiều.","code":"def is_isomorphic(s, t):\n    a = {}; b = {}\n    for x, y in zip(s, t):\n        if x in a and a[x] != y: return False\n        if y in b and b[y] != x: return False\n        a[x] = y; b[y] = x\n    return True","static":["Khởi tạo hai dict ánh xạ a (s→t) và b (t→s).","Với mỗi cặp ký tự (x, y) = zip(s, t):","Nếu x đã được ánh xạ tới ký tự khác y → hai chuỗi không đẳng cấu.","Nếu y đã được ánh xạ ngược tới ký tự khác x → không đẳng cấu.","Ngược lại gán cả hai chiều: a[x] = y và b[y] = x.","Duyệt hết mà không vi phạm → hai chuỗi đẳng cấu (true).","Ví dụ 'egg'→'add' đúng, 'foo'→'bar' sai vì o phải ánh xạ 1-1."],"_pno":"205","steps":[{"note":"Khởi tạo hai dict ánh xạ a (s→t) và b (t→s)."},{"note":"Với mỗi cặp ký tự (x, y) = zip(s, t):"},{"note":"Nếu x đã được ánh xạ tới ký tự khác y → hai chuỗi không đẳng cấu."},{"note":"Nếu y đã được ánh xạ ngược tới ký tự khác x → không đẳng cấu."},{"note":"Ngược lại gán cả hai chiều: a[x] = y và b[y] = x."},{"note":"Duyệt hết mà không vi phạm → hai chuỗi đẳng cấu (true)."},{"note":"Ví dụ 'egg'→'add' đúng, 'foo'→'bar' sai vì o phải ánh xạ 1-1."}],"anim":false},{"name":"Chuẩn hoá pattern","time":"O(n)","space":"O(n)","idea":"Mã mỗi ký tự bằng vị trí xuất hiện đầu tiên; hai chuỗi cùng pattern → đẳng cấu.","code":"def pattern(s):\n    first, out = {}, []\n    for i, ch in enumerate(s):\n        if ch not in first: first[ch] = i\n        out.append(first[ch])\n    return out\ndef is_isomorphic(s, t):\n    return pattern(s) == pattern(t)","static":["Định nghĩa hàm pattern: mã mỗi ký tự bằng vị trí xuất hiện đầu tiên của nó.","Quét chuỗi, lần đầu gặp ký tự thì ghi first[ch] = i; luôn thêm first[ch] vào out.","Sinh pattern số: ví dụ 'egg' → [0, 1, 1], 'add' → [0, 1, 1].","Hai chuỗi đẳng cấu khi và chỉ khi pattern(s) == pattern(t).","Kết thúc: trả đúng nếu hai pattern trùng nhau."],"_pno":"205","steps":[{"note":"Định nghĩa hàm pattern: mã mỗi ký tự bằng vị trí xuất hiện đầu tiên của nó."},{"note":"Quét chuỗi, lần đầu gặp ký tự thì ghi first[ch] = i; luôn thêm first[ch] vào out."},{"note":"Sinh pattern số: ví dụ 'egg' → [0, 1, 1], 'add' → [0, 1, 1]."},{"note":"Hai chuỗi đẳng cấu khi và chỉ khi pattern(s) == pattern(t)."},{"note":"Kết thúc: trả đúng nếu hai pattern trùng nhau."}],"anim":false},{"name":"So độ dài set","time":"O(n)","space":"O(n)","idea":"Điều kiện cần và đủ: len(set(s)) == len(set(t)) == len(set(zip(s,t))).","code":"def is_isomorphic(s, t):\n    return len(set(zip(s, t))) == len(set(s)) == len(set(t))","static":["Điều kiện đẳng cấu: số ký tự phân biệt của s bằng của t.","Tính len(set(zip(s, t))): số cặp ghép (s[i], t[i]) không trùng.","So sánh ba số: len(set(zip)) == len(set(s)) == len(set(t)).","Ví dụ 'egg','add': 2 == 2 == 2 → true; 'foo','bar': 2 != 3 → false."],"_pno":"205","steps":[{"note":"Điều kiện đẳng cấu: số ký tự phân biệt của s bằng của t."},{"note":"Tính len(set(zip(s, t))): số cặp ghép (s[i], t[i]) không trùng."},{"note":"So sánh ba số: len(set(zip)) == len(set(s)) == len(set(t))."},{"note":"Ví dụ 'egg','add': 2 == 2 == 2 → true; 'foo','bar': 2 != 3 → false."}],"anim":false}],"thinking":{"forward":"Hai dict ánh xạ hai chiều: ký tự→ký tự.","reverse":"Cần hai chuỗi cùng cấu trúc → ánh xạ từng cặp ký tự phải nhất quán."},"note":"Hashmap: quy về tra cứu O(1)."},{"no":"219","title":"Contains Duplicate II","cat":"Hashmap","diff":"Easy","statement":"Có tồn tại hai chỉ số i≠j sao cho nums[i]==nums[j] và |i−j| ≤ k?","examples":"nums=[1,2,3,1], k=3 → true · nums=[1,0,1,1], k=1 → true · nums=[1,2,3,1,2,3], k=2 → false","keyIdea":"Nhớ vị trí xuất hiện gần nhất của mỗi giá trị; nếu trong phạm vi k → true.","approaches":[{"name":"Dict vị trí gần nhất","time":"O(n)","space":"O(n)","idea":"Với mỗi i: nếu x đã thấy và i−last ≤ k → true; cập nhật last[x]=i.","code":"def contains_nearby_duplicate(nums, k):\n    last = {}\n    for i, x in enumerate(nums):\n        if x in last and i - last[x] <= k: return True\n        last[x] = i\n    return False","tcex":{"input":{"nums":[1,2,3,1],"k":3},"kind":"hash","display":"last","ptrs":["i"],"expected":true,"anim":true},"_pno":"219","steps":[{"note":"last = {}","line":2,"array":[1,2,3,1],"explain":"Đang thực thi: last = {}"},{"note":"for i, x in enumerate(nums):","line":3,"array":[1,2,3,1],"hash":{},"explain":"Duyệt: for i, x in enumerate(nums):"},{"ptr":{"i":0},"note":"i→0 — if x in last and i - last[x] <= k: return True","line":4,"array":[1,2,3,1],"explain":"i→0 — if x in last and i - last[x] <= k: return True"},{"ptr":{"i":0},"note":"i→0 — last[x] = i","line":5,"array":[1,2,3,1],"explain":"Con trỏ i dịch tới 0 — phạm vi xét được thu hẹp"},{"ptr":{"i":0},"note":"i→0 — for i, x in enumerate(nums):","line":3,"array":[1,2,3,1],"explain":"Con trỏ i dịch tới 0 — phạm vi xét được thu hẹp"},{"ptr":{"i":1},"note":"i→1 — if x in last and i - last[x] <= k: return True","line":4,"array":[1,2,3,1],"explain":"i→1 — if x in last and i - last[x] <= k: return True"},{"ptr":{"i":1},"note":"i→1 — last[x] = i","line":5,"array":[1,2,3,1],"explain":"Con trỏ i dịch tới 1 — phạm vi xét được thu hẹp"},{"ptr":{"i":1},"note":"i→1 — for i, x in enumerate(nums):","line":3,"array":[1,2,3,1],"explain":"Con trỏ i dịch tới 1 — phạm vi xét được thu hẹp"},{"ptr":{"i":2},"note":"i→2 — if x in last and i - last[x] <= k: return True","line":4,"array":[1,2,3,1],"explain":"i→2 — if x in last and i - last[x] <= k: return True"},{"ptr":{"i":2},"note":"i→2 — last[x] = i","line":5,"array":[1,2,3,1],"explain":"Con trỏ i dịch tới 2 — phạm vi xét được thu hẹp"},{"ptr":{"i":2},"note":"i→2 — for i, x in enumerate(nums):","line":3,"array":[1,2,3,1],"explain":"Con trỏ i dịch tới 2 — phạm vi xét được thu hẹp"},{"ptr":{"i":3},"note":"i→3 — if x in last and i - last[x] <= k: return True — Kết thúc — đáp án: True ✓ (khớp kỳ vọng)","line":4,"array":[1,2,3,1],"end":true,"answer":true,"explain":"→ Đáp án: True i=3"}],"anim":true},{"name":"Cửa sổ kích thước k","time":"O(n)","space":"O(min(n,k))","idea":"Giữ set các phần tử trong cửa sổ [i−k, i]; nếu trùng trong set → true; xoá phần tử ngoài cửa sổ.","code":"def contains_nearby_duplicate(nums, k):\n    win = set()\n    for i, x in enumerate(nums):\n        if x in win: return True\n        win.add(x)\n        if len(win) > k: win.remove(nums[i - k])\n    return False","tcex":{"input":{"nums":[1,2,3,1],"k":3},"kind":"set","display":"win","ptrs":["i"],"expected":true,"anim":true},"_pno":"219","steps":[{"note":"win = set()","line":2,"array":[1,2,3,1],"explain":"Đang thực thi: win = set()"},{"note":"for i, x in enumerate(nums):","line":3,"array":[1,2,3,1],"set":[],"explain":"Duyệt: for i, x in enumerate(nums):"},{"ptr":{"i":0},"note":"i→0 — if x in win: return True","line":4,"array":[1,2,3,1],"explain":"Con trỏ i dịch tới 0 — phạm vi xét được thu hẹp"},{"ptr":{"i":0},"note":"i→0 — win.add(x)","line":5,"array":[1,2,3,1],"explain":"win.add(x) — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"i":0},"note":"i→0 — if len(win) > k: win.remove(nums[i - k])","line":6,"array":[1,2,3,1],"explain":"i→0 — if len(win) > k: win.remove(nums[i - k])"},{"ptr":{"i":0},"note":"i→0 — for i, x in enumerate(nums):","line":3,"array":[1,2,3,1],"explain":"Con trỏ i dịch tới 0 — phạm vi xét được thu hẹp"},{"ptr":{"i":1},"note":"i→1 — if x in win: return True","line":4,"array":[1,2,3,1],"explain":"Con trỏ i dịch tới 1 — phạm vi xét được thu hẹp"},{"ptr":{"i":1},"note":"i→1 — win.add(x)","line":5,"array":[1,2,3,1],"explain":"win.add(x) — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"i":1},"note":"i→1 — if len(win) > k: win.remove(nums[i - k])","line":6,"array":[1,2,3,1],"explain":"i→1 — if len(win) > k: win.remove(nums[i - k])"},{"ptr":{"i":1},"note":"i→1 — for i, x in enumerate(nums):","line":3,"array":[1,2,3,1],"explain":"Con trỏ i dịch tới 1 — phạm vi xét được thu hẹp"},{"ptr":{"i":2},"note":"i→2 — if x in win: return True","line":4,"array":[1,2,3,1],"explain":"Con trỏ i dịch tới 2 — phạm vi xét được thu hẹp"},{"ptr":{"i":2},"note":"i→2 — win.add(x)","line":5,"array":[1,2,3,1],"explain":"win.add(x) — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"i":2},"note":"i→2 — if len(win) > k: win.remove(nums[i - k])","line":6,"array":[1,2,3,1],"explain":"i→2 — if len(win) > k: win.remove(nums[i - k])"},{"ptr":{"i":2},"note":"i→2 — for i, x in enumerate(nums):","line":3,"array":[1,2,3,1],"explain":"Con trỏ i dịch tới 2 — phạm vi xét được thu hẹp"},{"ptr":{"i":3},"note":"i→3 — if x in win: return True — Kết thúc — đáp án: True ✓ (khớp kỳ vọng)","line":4,"array":[1,2,3,1],"end":true,"answer":true,"explain":"→ Đáp án: True i=3"}],"anim":true}],"thinking":{"forward":"Lưu vị trí gần nhất mỗi giá trị, so khoảng cách k.","reverse":"Cần trùng trong khoảng k → chỉ cần vị trí gần nhất."},"note":"Nhớ vị trí xuất hiện gần nhất của mỗi giá trị; nếu trong phạm vi k → true."},{"no":"242","title":"Valid Anagram","cat":"Hashmap","diff":"Easy","statement":"Xem t có phải hoán vị ký tự của s không.","examples":"s=\"anagram\", t=\"nagaram\" → true · s=\"rat\", t=\"car\" → false","keyIdea":"Hai chuỗi là anagram ⇔ cùng tần suất ký tự.","approaches":[{"name":"So Counter","time":"O(n)","space":"O(1)","idea":"đếm tần suất cả hai và so.","code":"from collections import Counter\ndef is_anagram(s, t):\n    return Counter(s) == Counter(t)","static":["Counter(s) đếm tần suất ký tự của s.","Counter(t) đếm tần suất ký tự của t.","Hai chuỗi là anagram ⇔ hai bộ đếm bằng nhau.","Ví dụ 'anagram'/'nagaram' cùng {'a':3,'n':1,'g':1,'r':1,'m':1} → true."],"_pno":"242","steps":[{"note":"Counter(s) đếm tần suất ký tự của s."},{"note":"Counter(t) đếm tần suất ký tự của t."},{"note":"Hai chuỗi là anagram ⇔ hai bộ đếm bằng nhau."},{"note":"Ví dụ 'anagram'/'nagaram' cùng {'a':3,'n':1,'g':1,'r':1,'m':1} → true."}],"anim":false},{"name":"Sort cả hai","time":"O(n·log n)","space":"O(n)","idea":"sắp xếp rồi so bằng nhau — chậm hơn nhưng rất dễ chứng minh.","code":"def is_anagram(s, t):\n    return sorted(s) == sorted(t)","static":["Sắp xếp các ký tự của s thành danh sách có thứ tự.","Sắp xếp các ký tự của t thành danh sách có thứ tự.","Hai chuỗi là anagram ⇔ hai danh sách đã sắp bằng nhau.","Ví dụ sorted('anagram') == sorted('nagaram') → true."],"_pno":"242","steps":[{"note":"Sắp xếp các ký tự của s thành danh sách có thứ tự."},{"note":"Sắp xếp các ký tự của t thành danh sách có thứ tự."},{"note":"Hai chuỗi là anagram ⇔ hai danh sách đã sắp bằng nhau."},{"note":"Ví dụ sorted('anagram') == sorted('nagaram') → true."}],"anim":false},{"name":"Mảng đếm 26 chữ","time":"O(n)","space":"O(1)","idea":"Khởi tạo mảng 26 phần tử. với s cộng, với t trừ; cuối cùng toàn 0.","code":"def is_anagram(s, t):\n    if len(s) != len(t): return False\n    cnt = [0]*26\n    for a, b in zip(s, t):\n        cnt[ord(a)-97] += 1\n        cnt[ord(b)-97] -= 1\n    return all(x == 0 for x in cnt)","static":["Khởi tạo cnt = [0]*26 đại diện cho 26 chữ cái.","Với mỗi cặp (a, b) = zip(s, t): cnt[a] += 1 và cnt[b] -= 1.","Sau khi duyệt hết: nếu mọi phần tử của cnt bằng 0 → anagram.","Vì len(s) phải bằng len(t) mới có thể là anagram, kiểm tra trước.","Ví dụ 'anagram'/'nagaram': các phép cộng/trừ khử nhau hết → true."],"_pno":"242","steps":[{"note":"Khởi tạo cnt = [0]*26 đại diện cho 26 chữ cái."},{"note":"Với mỗi cặp (a, b) = zip(s, t): cnt[a] += 1 và cnt[b] -= 1."},{"note":"Sau khi duyệt hết: nếu mọi phần tử của cnt bằng 0 → anagram."},{"note":"Vì len(s) phải bằng len(t) mới có thể là anagram, kiểm tra trước."},{"note":"Ví dụ 'anagram'/'nagaram': các phép cộng/trừ khử nhau hết → true."}],"anim":false}],"thinking":{"forward":"Quy nạp tiến: mỗi ký tự của s tăng đếm, mỗi ký tự của t giảm đếm; cuối tất cả đếm bằng 0 thì anagram.","reverse":"Cần so sánh tần suất ký tự hai chuỗi → dùng dict đếm từng ký tự, hoặc sort hai chuỗi rồi so khớp từng vị trí."},"note":"Hai chuỗi là anagram ⇔ cùng tần suất ký tự."},{"no":"290","title":"Word Pattern","cat":"Hashmap","diff":"Easy","statement":"Xem pattern (toàn ký tự, có thể phân biệt) có khớp ánh xạ đều đặn tới các từ không.","examples":"pattern=\"abba\", s=\"dog cat cat dog\" → true · \"abba\",\"dog cat cat fish\" → false","keyIdea":"Giống Isomorphic nhưng với các từ thay cho ký tự — cần hai chiều ánh xạ.","approaches":[{"name":"Hai dict ánh xạ","time":"O(n)","space":"O(n)","idea":"words = s.split(); nếu độ dài khác → false; ánh xạ ký tự↔từ hai chiều.","code":"def word_pattern(pattern, s):\n    words = s.split()\n    if len(pattern) != len(words): return False\n    a = {}; b = {}\n    for p, w in zip(pattern, words):\n        if p in a and a[p] != w: return False\n        if w in b and b[w] != p: return False\n        a[p] = w; b[w] = p\n    return True","static":["Tách s thành danh sách từ words = s.split().","Nếu len(pattern) != len(words) → false ngay.","Duyệt cặp (p, w) = zip(pattern, words): ánh xạ hai chiều p→w và w→p.","Nếu p đã gán tới từ khác w, hoặc w đã gán tới ký tự khác p → false.","Hết cặp mà không vi phạm → true.","Ví dụ 'abba' + 'dog cat cat dog' → true; 'dog cat cat fish' → false."],"_pno":"290","steps":[{"note":"Tách s thành danh sách từ words = s.split()."},{"note":"Nếu len(pattern) != len(words) → false ngay."},{"note":"Duyệt cặp (p, w) = zip(pattern, words): ánh xạ hai chiều p→w và w→p."},{"note":"Nếu p đã gán tới từ khác w, hoặc w đã gán tới ký tự khác p → false."},{"note":"Hết cặp mà không vi phạm → true."},{"note":"Ví dụ 'abba' + 'dog cat cat dog' → true; 'dog cat cat fish' → false."}],"anim":false},{"name":"So set","time":"O(n)","space":"O(n)","idea":"Độ dài bằng nhau và số ánh xạ ký tự↔từ bằng đủ.","code":"def word_pattern(pattern, s):\n    words = s.split()\n    return len(pattern) == len(words) and len(set(zip(pattern, words))) == len(set(pattern)) == len(set(words))","static":["Tách s thành words = s.split(); đếm số từ.","Điều kiện cần: len(pattern) == len(words).","Đếm số cặp ghép (pattern[i], words[i]) phân biệt qua set.","Khớp đủ khi len(set(zip)) == len(set(pattern)) == len(set(words)).","Ví dụ 'abba' + 'dog cat cat dog' → 2 == 2 == 2 → true."],"_pno":"290","steps":[{"note":"Tách s thành words = s.split(); đếm số từ."},{"note":"Điều kiện cần: len(pattern) == len(words)."},{"note":"Đếm số cặp ghép (pattern[i], words[i]) phân biệt qua set."},{"note":"Khớp đủ khi len(set(zip)) == len(set(pattern)) == len(set(words))."},{"note":"Ví dụ 'abba' + 'dog cat cat dog' → 2 == 2 == 2 → true."}],"anim":false},{"name":"encode+decode","time":"O(n)","space":"O(n)","idea":"Mã pattern và chuỗi thành chuỗi SỐ theo vị trí đầu rồi so sánh.","code":"def enc(seq):\n    d = {}; out = []\n    for x in seq:\n        if x not in d: d[x] = len(d)\n        out.append(d[x])\n    return out\ndef word_pattern(pattern, s):\n    return enc(pattern) == enc(s.split())","static":["Hàm enc(seq) gán mỗi phần tử một mã số theo lần xuất hiện đầu tiên.","Quét seq: nếu x chưa có trong d thì gán d[x] = len(d); thêm d[x] vào out.","Mã hoá pattern và words = s.split() thành hai chuỗi số.","So sánh: enc(pattern) == enc(words) — cùng hình dạng lặp lại.","Ví dụ 'abba' → [0,1,1,0], 'dog cat cat dog' → [0,1,1,0] → true."],"_pno":"290","steps":[{"note":"Hàm enc(seq) gán mỗi phần tử một mã số theo lần xuất hiện đầu tiên."},{"note":"Quét seq: nếu x chưa có trong d thì gán d[x] = len(d); thêm d[x] vào out."},{"note":"Mã hoá pattern và words = s.split() thành hai chuỗi số."},{"note":"So sánh: enc(pattern) == enc(words) — cùng hình dạng lặp lại."},{"note":"Ví dụ 'abba' → [0,1,1,0], 'dog cat cat dog' → [0,1,1,0] → true."}],"anim":false}],"thinking":{"forward":"Đối chiếu pattern với từ theo dict hai chiều.","reverse":"Cần pattern khớp danh sách từ → cùng một token phải cùng một từ."},"note":"Hashmap: quy về tra cứu O(1)."},{"no":"350","title":"Intersection of Two Arrays II","cat":"Hashmap","diff":"Easy","statement":"Trả về giao của hai mảng — mỗi phần tử xuất hiện đúng số lần lặp nhỏ nhất giữa hai mảng, thứ tự tự do.","examples":"nums1=[1,2,2,1], nums2=[2,2] → [2,2] · nums1=[4,9,5], nums2=[9,4,9,8,4] → [4,9]","keyIdea":"Đếm tần suất mảng nhỏ bằng Counter, duyệt mảng kia và rút dần — mỗi phần tử giao lấy đúng min(tần suất).","thinking":{"forward":"Đếm tần suất từng giá trị của nums1 vào Counter; duyệt nums2, giá trị nào còn 'tồn kho' thì lấy ra và giảm 1.","reverse":"Muốn có đủ phần tử giao theo đúng số lần lặp → phải biết mỗi giá trị còn dư bao nhiêu lần ở mảng kia, tra cứu O(1) bằng Counter."},"note":"Bài anh em của #349 nhưng yêu cầu số lần lặp (khác 'unique'): Counter với cơ chế trừ dần; dùng latest-trừ để xử lý trùng.","approaches":[{"name":"Counter trừ dần","time":"O(m+n)","space":"O(min(m,n))","idea":"cnt đếm nums1; với mỗi x trong nums2, nếu cnt[x] > 0 thì lấy x và giảm 1 — mỗi phần tử giao lấy đúng số lần lặp chung.","code":"from collections import Counter\ndef intersect(nums1, nums2):\n    cnt = Counter(nums1)\n    out = []\n    for x in nums2:\n        if cnt[x] > 0:\n            out.append(x)\n            cnt[x] -= 1\n    return out","tcex":{"input":{"nums1":[1,2,2,1],"nums2":[2,2]},"kind":"array","display":"nums2","ptrs":["x"],"expected":[2,2],"anim":true},"_pno":"350","steps":[{"note":"cnt = Counter(nums1)","line":3,"array":[2,2],"explain":"Đang thực thi: cnt = Counter(nums1)"},{"note":"out = []","line":4,"array":[2,2],"explain":"Đang thực thi: out = []"},{"note":"for x in nums2:","line":5,"array":[2,2],"explain":"Duyệt: for x in nums2:"},{"ptr":{"x":2},"note":"x→2 — if cnt[x] > 0:","line":6,"array":[2,2],"explain":"Con trỏ x dịch tới 2 — phạm vi xét được thu hẹp"},{"ptr":{"x":2},"note":"x→2 — out.append(x)","line":7,"array":[2,2],"explain":"out.append(x) — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"x":2},"note":"x→2 — cnt[x] -= 1","line":8,"array":[2,2],"explain":"cnt[x] -= 1 — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"x":2},"note":"x→2 — for x in nums2:","line":5,"array":[2,2],"explain":"Con trỏ x dịch tới 2 — phạm vi xét được thu hẹp"},{"ptr":{"x":2},"note":"x→2 — if cnt[x] > 0:","line":6,"array":[2,2],"explain":"Con trỏ x dịch tới 2 — phạm vi xét được thu hẹp"},{"ptr":{"x":2},"note":"x→2 — out.append(x)","line":7,"array":[2,2],"explain":"out.append(x) — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"x":2},"note":"x→2 — cnt[x] -= 1","line":8,"array":[2,2],"explain":"cnt[x] -= 1 — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"x":2},"note":"x→2 — for x in nums2:","line":5,"array":[2,2],"explain":"Con trỏ x dịch tới 2 — phạm vi xét được thu hẹp"},{"ptr":{"x":2},"note":"x→2 — return out — Kết thúc — đáp án: [2, 2] ✓ (khớp kỳ vọng)","line":9,"array":[2,2],"end":true,"answer":[2,2],"explain":"→ Đáp án: [2,2] x=2"}],"anim":true},{"name":"Two-pointer sau sort","time":"O(m·log m + n·log n)","space":"O(1)","idea":"Sort cả hai; so a[i] với b[j]: bé hơn thì tiến con trỏ, bằng nhau thì lấy và tiến cả hai (kết quả sắp tăng).","code":"def intersect(nums1, nums2):\n    a, b = sorted(nums1), sorted(nums2)\n    i = j = 0\n    out = []\n    while i < len(a) and j < len(b):\n        if a[i] < b[j]:\n            i += 1\n        elif a[i] > b[j]:\n            j += 1\n        else:\n            out.append(a[i]); i += 1; j += 1\n    return out","static":["Sort: a = [1, 1, 2, 2], b = [2, 2].","So a[0]=1 với b[0]=2: 1 < 2 → tăng i.","So a[1]=1 với b[0]=2: 1 < 2 → tăng i.","So a[2]=2 với b[0]=2: bằng → thêm 2, tăng cả i và j.","So a[3]=2 với b[1]=2: bằng → thêm 2, tăng cả i và j.","j hết mảng → dừng; out = [2, 2]."],"_pno":"350","steps":[{"note":"Sort: a = [1, 1, 2, 2], b = [2, 2]."},{"note":"So a[0]=1 với b[0]=2: 1 < 2 → tăng i."},{"note":"So a[1]=1 với b[0]=2: 1 < 2 → tăng i."},{"note":"So a[2]=2 với b[0]=2: bằng → thêm 2, tăng cả i và j."},{"note":"So a[3]=2 với b[1]=2: bằng → thêm 2, tăng cả i và j."},{"note":"j hết mảng → dừng; out = [2, 2]."}],"anim":false},{"name":"Counter & (phép giao)","time":"O(m+n)","space":"O(min(m,n))","idea":"Counter(nums1) & Counter(nums2) chính là giao theo min tần suất; .elements() khai triển ra danh sách.","code":"from collections import Counter\ndef intersect(nums1, nums2):\n    return list((Counter(nums1) & Counter(nums2)).elements())","static":["Counter(nums1) = {1: 2, 2: 1} — đếm tần suất mảng 1.","Counter(nums2) = {2: 2} — đếm tần suất mảng 2.","Phép & trên hai Counter lấy min theo từng khoá: {2: 1}.",".elements() khai triển mỗi khoá đủ số lần → [2, 2].","O(m+n) thời gian, O(min(m,n)) bộ nhớ — ngắn nhất về code."],"_pno":"350","steps":[{"note":"Counter(nums1) = {1: 2, 2: 1} — đếm tần suất mảng 1."},{"note":"Counter(nums2) = {2: 2} — đếm tần suất mảng 2."},{"note":"Phép & trên hai Counter lấy min theo từng khoá: {2: 1}."},{"note":".elements() khai triển mỗi khoá đủ số lần → [2, 2]."},{"note":"O(m+n) thời gian, O(min(m,n)) bộ nhớ — ngắn nhất về code."}],"anim":false}]},{"no":"383","title":"Ransom Note","cat":"Hashmap","diff":"Easy","statement":"Xem có thể viết ransomNote từ các ký tự magazine (mỗi ký tự dùng tối đa 1 lần).","examples":"ransomNote=\"a\", magazine=\"b\" → false · \"aa\",\"aab\" → true","keyIdea":"Đếm tần suất ký tự của magazine, trừ dần theo ransomNote.","approaches":[{"name":"Counter trừ","time":"O(n+m)","space":"O(1)","idea":"dùng Counter(magazine); với mỗi ký tự trong ransomNote, nếu thiếu → false, ngược lại giảm 1.","code":"from collections import Counter\ndef can_construct(ransomNote, magazine):\n    c = Counter(magazine)\n    for ch in ransomNote:\n        if c[ch] <= 0: return False\n        c[ch] -= 1\n    return True","static":["Counter(magazine) đếm từng ký tự","Với mỗi ký tự trong ransomNote: trừ 1 khỏi counter","Nếu counter[ch] < 0 → không đủ chữ → false","Đi hết ransomNote → true"],"_pno":"383","steps":[{"note":"Counter(magazine) đếm từng ký tự"},{"note":"Với mỗi ký tự trong ransomNote: trừ 1 khỏi counter"},{"note":"Nếu counter[ch] < 0 → không đủ chữ → false"},{"note":"Đi hết ransomNote → true"}],"anim":false},{"name":"So sánh Counter","time":"O(n+m)","space":"O(1)","idea":"kết quả đúng khi mọi tần suất trong ransomNote ≤ tần suất tương ứng trong magazine.","code":"from collections import Counter\ndef can_construct(ransomNote, magazine):\n    a, b = Counter(ransomNote), Counter(magazine)\n    return all(b[ch] >= a[ch] for ch in a)","static":["Counter(ransomNote) đếm nhu cầu; Counter(magazine) đếm nguồn cung.","Với mỗi ký tự ch trong ransomNote: so tần suất hai bên.","Hợp lệ khi b[ch] >= a[ch] cho mọi ch — nguồn cung đủ nhu cầu.","Ví dụ 'aa' với 'aab': b['a']=2 >= a['a']=2 → true."],"_pno":"383","steps":[{"note":"Counter(ransomNote) đếm nhu cầu; Counter(magazine) đếm nguồn cung."},{"note":"Với mỗi ký tự ch trong ransomNote: so tần suất hai bên."},{"note":"Hợp lệ khi b[ch] >= a[ch] cho mọi ch — nguồn cung đủ nhu cầu."},{"note":"Ví dụ 'aa' với 'aab': b['a']=2 >= a['a']=2 → true."}],"anim":false},{"name":"replace 1 lần","time":"O(m·n)","space":"O(1)","idea":"Với mỗi ký tự, thay 1 lần xuất hiện bằng rỗng trong bản sao magazine.","code":"def can_construct(ransomNote, magazine):\n    m = magazine\n    for ch in ransomNote:\n        if ch not in m: return False\n        m = m.replace(ch, '', 1)\n    return True","static":["Bắt đầu với bản sao m = magazine.","Với mỗi ký tự ch trong ransomNote: nếu ch không còn trong m → false.","Nếu có, xoá đúng một lần xuất hiện của ch trong m (replace 1 lần).","Đi hết ransomNote mà luôn tìm được → true. O(m·n) vì replace quét lại m."],"_pno":"383","steps":[{"note":"Bắt đầu với bản sao m = magazine."},{"note":"Với mỗi ký tự ch trong ransomNote: nếu ch không còn trong m → false."},{"note":"Nếu có, xoá đúng một lần xuất hiện của ch trong m (replace 1 lần)."},{"note":"Đi hết ransomNote mà luôn tìm được → true. O(m·n) vì replace quét lại m."}],"anim":false}],"thinking":{"forward":"Đếm tần suất chữ cái trong magazine, trừ dần khi dùng cho ransomNote.","reverse":"Cần đủ chữ để viết ransomNote → mỗi ký tự trong ransomNote phải có trong magazine với số lượng còn đủ."},"note":"Chuỗi ký tự — dùng Counter (đếm tần suất) thay vì mảng."},{"no":"387","title":"First Unique Character in a String","cat":"Hashmap","diff":"Easy","statement":"Tìm chỉ số của ký tự đầu tiên xuất hiện đúng một lần trong s; không có thì trả -1.","examples":"s=\"leetcode\" → 0 · s=\"loveleetcode\" → 2 · s=\"aabb\" → -1","keyIdea":"Đếm tần suất trước (Counter), quét lại để tìm chỉ số đầu tiên có tần suất 1.","thinking":{"forward":"Lượt 1 đếm tần suất toàn bộ ký tự; lượt 2 đi từ đầu, ký tự nào tần suất bằng 1 thì trả về chỉ số.","reverse":"Muốn ký tự 'đầu tiên' không trùng → phải biết trước toàn bộ tần suất mới kết luận được, nên lượt đếm phải xong trước lượt tìm."},"note":"Chỉ 26 chữ cái thường nên có thể dùng mảng tần suất [0]*26 thay Counter; với ký tự nói chung vẫn dùng Counter.","approaches":[{"name":"Counter hai lượt","time":"O(n)","space":"O(1)","idea":"Quét 1: cnt = Counter(s). Quét 2: chỉ số i đầu tiên có cnt[ch] == 1.","code":"from collections import Counter\ndef first_unique_char(s):\n    cnt = Counter(s)\n    for i, ch in enumerate(s):\n        if cnt[ch] == 1:\n            return i\n    return -1","tcex":{"input":{"s":"loveleetcode"},"kind":"hash","display":"cnt","ptrs":["i"],"expected":2,"anim":true},"_pno":"387","steps":[{"note":"cnt = Counter(s)","line":3,"array":[],"explain":"Đang thực thi: cnt = Counter(s)"},{"note":"for i, ch in enumerate(s):","line":4,"array":[],"hash":{"c":1,"d":1,"e":4,"l":2,"o":2,"t":1,"v":1},"explain":"Duyệt: for i, ch in enumerate(s):"},{"ptr":{"i":0},"note":"i→0 — if cnt[ch] == 1:","line":5,"array":[],"explain":"Con trỏ i dịch tới 0 — phạm vi xét được thu hẹp"},{"ptr":{"i":0},"note":"i→0 — for i, ch in enumerate(s):","line":4,"array":[],"explain":"Con trỏ i dịch tới 0 — phạm vi xét được thu hẹp"},{"ptr":{"i":1},"note":"i→1 — if cnt[ch] == 1:","line":5,"array":[],"explain":"Con trỏ i dịch tới 1 — phạm vi xét được thu hẹp"},{"ptr":{"i":1},"note":"i→1 — for i, ch in enumerate(s):","line":4,"array":[],"explain":"Con trỏ i dịch tới 1 — phạm vi xét được thu hẹp"},{"ptr":{"i":2},"note":"i→2 — if cnt[ch] == 1:","line":5,"array":[],"explain":"Con trỏ i dịch tới 2 — phạm vi xét được thu hẹp"},{"ptr":{"i":2},"note":"i→2 — return i — Kết thúc — đáp án: 2 ✓ (khớp kỳ vọng)","line":6,"array":[],"end":true,"answer":2,"explain":"→ Đáp án: 2 i=2"}],"anim":true},{"name":"Mảng đếm 26 chữ","time":"O(n)","space":"O(1)","idea":"cnt = [0]*26; quét 1 cộng tần suất theo ord(ch)-97; quét 2 trả chỉ số đầu tiên có cnt == 1.","code":"def first_unique_char(s):\n    cnt = [0] * 26\n    for ch in s:\n        cnt[ord(ch) - 97] += 1\n    for i, ch in enumerate(s):\n        if cnt[ord(ch) - 97] == 1:\n            return i\n    return -1","static":["Khởi tạo cnt = [0]*26 — ô thứ ord(ch)-97 đếm tần suất chữ cái.","Quét 1 với s='loveleetcode': cộng 1 cho từng ký tự.","cnt['l'-97]=2, cnt['o'-97]=2, cnt['v'-97]=1, cnt['e'-97]=4, ...","Quét 2 từ đầu s: 'l'(0) tần suất 2, 'o'(1) tần suất 2 — chưa được.","i=2 chữ 'v': cnt[118-97]=1 → trả về 2."],"_pno":"387","steps":[{"note":"Khởi tạo cnt = [0]*26 — ô thứ ord(ch)-97 đếm tần suất chữ cái."},{"note":"Quét 1 với s='loveleetcode': cộng 1 cho từng ký tự."},{"note":"cnt['l'-97]=2, cnt['o'-97]=2, cnt['v'-97]=1, cnt['e'-97]=4, ..."},{"note":"Quét 2 từ đầu s: 'l'(0) tần suất 2, 'o'(1) tần suất 2 — chưa được."},{"note":"i=2 chữ 'v': cnt[118-97]=1 → trả về 2."}],"anim":false},{"name":"Quét hai đầu (tối ưu hằng số)","time":"O(n)","space":"O(1)","idea":"Với mỗi ký tự có tần suất 1, vị trí đầu (s.index) và cuối (s.rindex) trùng nhau; lấy min các vị trí đó — chỉ quét bảng chữ cái.","code":"def first_unique_char(s):\n    best = len(s)\n    for ch in set(s):\n        if s.count(ch) == 1:\n            best = min(best, s.index(ch))\n    return best if best < len(s) else -1","static":["Với mỗi ký tự phân biệt ch trong set(s):","s.count(ch) đếm tần suất; nếu bằng 1 thì ch xuất hiện đúng một lần.","s.index(ch) cho vị trí đầu tiên — chính là vị trí duy nhất của ch.","Lấy min các vị trí hợp lệ; không có ký tự nào → -1.","Ví dụ 'loveleetcode': 'l' tần suất 1 ở vị trí 0, nhưng 'v'(2) nhỏ hơn → kết quả 2."],"_pno":"387","steps":[{"note":"Với mỗi ký tự phân biệt ch trong set(s):"},{"note":"s.count(ch) đếm tần suất; nếu bằng 1 thì ch xuất hiện đúng một lần."},{"note":"s.index(ch) cho vị trí đầu tiên — chính là vị trí duy nhất của ch."},{"note":"Lấy min các vị trí hợp lệ; không có ký tự nào → -1."},{"note":"Ví dụ 'loveleetcode': 'l' tần suất 1 ở vị trí 0, nhưng 'v'(2) nhỏ hơn → kết quả 2."}],"anim":false}]},{"no":"409","title":"Longest Palindrome","cat":"Hashmap","diff":"Easy","statement":"Dùng các ký tự của s để xếp chuỗi đối xứng; trả độ dài dài nhất (dùng được tối đa mỗi ký tự số lần có sẵn).","examples":"s=\"abccccdd\" → 7 (“dccaccd”) · s=\"a\" → 1 · s=\"bb\" → 2","keyIdea":"Palindrom có các ký tự xuất hiện chẵn lần + tối đa 1 ký tự lẻ ở chính giữa; gộp mọi cặp chẵn rồi +1 nếu có ký tự lẻ.","thinking":{"forward":"Đếm tần suất; với mỗi tần suất chẵn dùng hết, tần suất lẻ dùng phần chẵn; nếu còn thừa ký tự lẻ thì đặt 1 ký tự vào giữa.","reverse":"Muốn tối đa độ dài chuỗi đối xứng → mỗi ký tự phải dùng theo cặp đối xứng; chỉ được phép lệch đúng 1 ký tự ở tâm."},"note":"Trường hợp s rỗng → 0; điều kiện 'có ký tự lẻ' chỉ cần một cờ, không cần đếm chính xác bao nhiêu ký tự lẻ.","approaches":[{"name":"Counter + cờ lẻ","time":"O(n)","space":"O(1)","idea":"Với mỗi tần suất v: ln += v//2*2 (phần chẵn); nếu v lẻ thì cờ odd = 1; cuối cùng ln + odd.","code":"from collections import Counter\ndef longest_palindrome(s):\n    cnt = Counter(s)\n    ln = 0; odd = 0\n    for v in cnt.values():\n        ln += v // 2 * 2\n        if v % 2 == 1:\n            odd = 1\n    return ln + odd","tcex":{"input":{"s":"abccccdd"},"kind":"hash","display":"cnt","ptrs":[],"expected":7,"anim":true},"_pno":"409","steps":[{"note":"cnt = Counter(s)","line":3,"array":[],"explain":"Đang thực thi: cnt = Counter(s)"},{"note":"ln = 0; odd = 0","line":4,"array":[],"hash":{"a":1,"b":1,"c":4,"d":2},"explain":"Đang thực thi: ln = 0; odd = 0"},{"note":"for v in cnt.values():","line":5,"array":[],"explain":"Duyệt: for v in cnt.values():"},{"note":"ln += v // 2 * 2","line":6,"array":[],"explain":"ln += v // 2 * 2 — thao tác này làm thay đổi trạng thái chính."},{"note":"if v % 2 == 1:","line":7,"array":[],"explain":"Kiểm tra điều kiện: if v % 2 == 1:"},{"note":"odd = 1","line":8,"array":[],"explain":"Đang thực thi: odd = 1"},{"note":"for v in cnt.values():","line":5,"array":[],"explain":"Duyệt: for v in cnt.values():"},{"note":"ln += v // 2 * 2","line":6,"array":[],"explain":"ln += v // 2 * 2 — thao tác này làm thay đổi trạng thái chính."},{"note":"if v % 2 == 1:","line":7,"array":[],"explain":"Kiểm tra điều kiện: if v % 2 == 1:"},{"note":"odd = 1","line":8,"array":[],"explain":"Đang thực thi: odd = 1"},{"note":"for v in cnt.values():","line":5,"array":[],"explain":"Duyệt: for v in cnt.values():"},{"note":"ln += v // 2 * 2","line":6,"array":[],"explain":"ln += v // 2 * 2 — thao tác này làm thay đổi trạng thái chính."},{"note":"if v % 2 == 1:","line":7,"array":[],"explain":"Kiểm tra điều kiện: if v % 2 == 1:"},{"note":"for v in cnt.values():","line":5,"array":[],"explain":"Duyệt: for v in cnt.values():"},{"note":"ln += v // 2 * 2","line":6,"array":[],"explain":"ln += v // 2 * 2 — thao tác này làm thay đổi trạng thái chính."},{"note":"if v % 2 == 1:","line":7,"array":[],"explain":"Kiểm tra điều kiện: if v % 2 == 1:"},{"note":"for v in cnt.values():","line":5,"array":[],"explain":"Duyệt: for v in cnt.values():"},{"note":"return ln + odd — Kết thúc — đáp án: 7 ✓ (khớp kỳ vọng)","line":9,"array":[],"end":true,"answer":7,"explain":"→ Đáp án: 7"}],"anim":true},{"name":"Set bật/tắt (không cần đếm)","time":"O(n)","space":"O(1)","idea":"Quét ký tự: có trong set thì xoá (ghép được 1 cặp, dài += 2), chưa có thì thêm; hết quét set còn phần tử → +1.","code":"def longest_palindrome(s):\n    pairs = 0; odd = set()\n    for ch in s:\n        if ch in odd:\n            odd.remove(ch); pairs += 2\n        else:\n            odd.add(ch)\n    return pairs + (1 if odd else 0)","tcex":{"input":{"s":"abccccdd"},"kind":"set","display":"odd","ptrs":["ch"],"expected":7,"anim":true},"_pno":"409","steps":[{"note":"pairs = 0; odd = set()","line":2,"array":[],"explain":"Đang thực thi: pairs = 0; odd = set()"},{"note":"for ch in s:","line":3,"array":[],"set":[],"explain":"Duyệt: for ch in s:"},{"ptr":{"ch":"a"},"note":"ch→a — if ch in odd:","line":4,"array":[],"explain":"Con trỏ ch dịch tới a — phạm vi xét được thu hẹp"},{"ptr":{"ch":"a"},"note":"ch→a — odd.add(ch)","line":7,"array":[],"explain":"odd.add(ch) — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"ch":"a"},"note":"ch→a — for ch in s:","line":3,"array":[],"explain":"Con trỏ ch dịch tới a — phạm vi xét được thu hẹp"},{"ptr":{"ch":"b"},"note":"ch→b — if ch in odd:","line":4,"array":[],"explain":"Con trỏ ch dịch tới b — phạm vi xét được thu hẹp"},{"ptr":{"ch":"b"},"note":"ch→b — odd.add(ch)","line":7,"array":[],"explain":"odd.add(ch) — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"ch":"b"},"note":"ch→b — for ch in s:","line":3,"array":[],"explain":"Con trỏ ch dịch tới b — phạm vi xét được thu hẹp"},{"ptr":{"ch":"c"},"note":"ch→c — if ch in odd:","line":4,"array":[],"explain":"Con trỏ ch dịch tới c — phạm vi xét được thu hẹp"},{"ptr":{"ch":"c"},"note":"ch→c — odd.add(ch)","line":7,"array":[],"explain":"odd.add(ch) — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"ch":"c"},"note":"ch→c — for ch in s:","line":3,"array":[],"explain":"Con trỏ ch dịch tới c — phạm vi xét được thu hẹp"},{"ptr":{"ch":"c"} sót. Trong Python dict phải dùng get thay vì Counter để tránh kiểm tra key.","approaches":[{"name":"Prefix sum + dict đếm","time":"O(n)","space":"O(n)","idea":"Đi s = tổng tích luỹ; ans += số lần (s−k) đã xuất hiện trong dict; tăng tần suất s. Khởi tạo {0: 1}.","code":"def subarray_sum(nums, k):\n    mp = {0: 1}\n    s = 0; ans = 0\n    for x in nums:\n        s += x\n        ans += mp.get(s - k, 0)\n        mp[s] = mp.get(s, 0) + 1\n    return ans","tcex":{"input":{"nums":[1,1,1],"k":2},"kind":"hash","display":"mp","ptrs":["x","s"],"expected":2,"anim":true},"_pno":"560","steps":[{"note":"mp = {0: 1}","line":2,"array":[1,1,1],"explain":"Đang thực thi: mp = {0: 1}"},{"note":"s = 0; ans = 0","line":3,"array":[1,1,1],"hash":{"0":1},"explain":"Đang thực thi: s = 0; ans = 0"},{"ptr":{"s":0},"note":"s→0 — for x in nums:","line":4,"array":[1,1,1],"explain":"Con trỏ s dịch tới 0 — phạm vi xét được thu hẹp"},{"ptr":{"x":1,"s":0},"note":"x→1; s→0 — s += x","line":5,"array":[1,1,1],"explain":"s += x — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"x":1,"s":1},"note":"x→1; s→1 — ans += mp.get(s - k, 0)","line":6,"array":[1,1,1],"explain":"ans += mp.get(s - k, 0) — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"x":1,"s":1},"note":"x→1; s→1 — mp[s] = mp.get(s, 0) + 1","line":7,"array":[1,1,1],"explain":"mp[s] = mp.get(s, 0) + 1 — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"x":1,"s":1},"note":"x→1; s→1 — for x in nums:","line":4,"array":[1,1,1],"explain":"Con trỏ x dịch tới 1 — phạm vi xét được thu hẹp"},{"ptr":{"x":1,"s":1},"note":"x→1; s→1 — s += x","line":5,"array":[1,1,1],"explain":"s += x — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"x":1,"s":2},"note":"x→1; s→2 — ans += mp.get(s - k, 0)","line":6,"array":[1,1,1],"explain":"ans += mp.get(s - k, 0) — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"x":1,"s":2},"note":"x→1; s→2 — mp[s] = mp.get(s, 0) + 1","line":7,"array":[1,1,1],"explain":"mp[s] = mp.get(s, 0) + 1 — thao tác này làm
