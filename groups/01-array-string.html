:true},"_pno":"1528","steps":[{"note":"res = ['']*len(s)","line":2,"explain":"Đang thực thi: res = ['']*len(s)"},{"note":"for i, ch in zip(indices, s):","line":3,"explain":"Duyệt: for i, ch in zip(indices, s):"},{"note":"res[i] = ch","line":4,"explain":"Đang thực thi: res[i] = ch"},{"note":"for i, ch in zip(indices, s):","line":3,"explain":"Duyệt: for i, ch in zip(indices, s):"},{"note":"res[i] = ch","line":4,"explain":"Đang thực thi: res[i] = ch"},{"note":"for i, ch in zip(indices, s):","line":3,"explain":"Duyệt: for i, ch in zip(indices, s):"},{"note":"res[i] = ch","line":4,"explain":"Đang thực thi: res[i] = ch"},{"note":"for i, ch in zip(indices, s):","line":3,"explain":"Duyệt: for i, ch in zip(indices, s):"},{"note":"res[i] = ch","line":4,"explain":"Đang thực thi: res[i] = ch"},{"note":"for i, ch in zip(indices, s):","line":3,"explain":"Duyệt: for i, ch in zip(indices, s):"},{"note":"res[i] = ch","line":4,"explain":"Đang thực thi: res[i] = ch"},{"note":"for i, ch in zip(indices, s):","line":3,"explain":"Duyệt: for i, ch in zip(indices, s):"},{"note":"res[i] = ch","line":4,"explain":"Đang thực thi: res[i] = ch"},{"note":"for i, ch in zip(indices, s):","line":3,"explain":"Duyệt: for i, ch in zip(indices, s):"},{"note":"res[i] = ch","line":4,"explain":"Đang thực thi: res[i] = ch"},{"note":"for i, ch in zip(indices, s):","line":3,"explain":"Duyệt: for i, ch in zip(indices, s):"},{"note":"res[i] = ch","line":4,"explain":"Đang thực thi: res[i] = ch"},{"note":"for i, ch in zip(indices, s):","line":3,"explain":"Duyệt: for i, ch in zip(indices, s):"},{"note":"return ''.join(res) — Kết thúc — đáp án: leetcode ✓ (khớp kỳ vọng)","line":5,"end":true,"answer":"leetcode","explain":"→ Đáp án: leetcode"}],"anim":true},{"name":"Sắp xếp cặp (index, char)","time":"O(n·log n)","space":"O(n)","idea":"Ghép cặp (indices[i], s[i]), sort theo chỉ số rồi nối các ký tự — không cần ô chờ.","code":"def restore_string(s, indices):\n    pairs = sorted(zip(indices, s))\n    return ''.join(ch fo  g","line":4,"array":[-5,1,5,0,-7],"explain":"alt += g — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"alt":1,"best":0},"note":"alt→1; best→0 — best = max(best, alt)","line":5,"array":[-5,1,5,0,-7],"explain":"best = max(best, alt) — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"alt":1,"best":1},"note":"alt→1; best→1 — for g in gain:","line":3,"array":[-5,1,5,0,-7],"explain":"Con trỏ alt dịch tới 1 — phạm vi xét được thu hẹp"},{"ptr":{"alt":1,"best":1},"note":"alt→1; best→1 — alt += g","line":4,"array":[-5,1,5,0,-7],"explain":"alt += g — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"alt":1,"best":1},"note":"alt→1; best→1 — best = max(best, alt)","line":5,"array":[-5,1,5,0,-7],"explain":"best = max(best, alt) — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"alt":1,"best":1},"note":"alt→1; best→1 — for g in gain:","line":3,"array":[-5,1,5,0,-7],"explain":"Con trỏ alt dịch tới 1 — phạm vi xét được thu hẹp"},{"ptr":{"alt":1,"best":1},"note":"alt→1; best→1 — alt += g","line":4,"array":[-5,1,5,0,-7],"explain":"alt += g — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"alt":-6,"best":1},"note":"alt→-6; best→1 — best = max(best, alt)","line":5,"array":[-5,1,5,0,-7],"explain":"best = max(best, alt) — thao tác này làm thay đổi trạng thái chính."},{"ptr":{"alt":-6,"best":1},"note":"alt→-6; best→1 — for g in gain:","line":3,"array":[-5,1,5,0,-7],"explain":"Con trỏ alt dịch tới -6 — phạm vi xét được thu hẹp"},{"ptr":{"alt":-6,"best":1},"note":"alt→-6; best→1 — return best — Kết thúc — đáp án: 1 ✓ (khớp kỳ vọng)","line":6,"array":[-5,1,5,0,-7],"end":true,"answer":1,"explain":"→ Đáp án: 1 alt=-6"}],"anim":true},{"name":"itertools.accumulate","time":"O(n)","space":"O(n)","idea":"accumulate(gain) cho dãy độ cao sau từng bước; max với 0.","code":"from itertools import accumulate\ndef largest_altitude(gain):\n    return max(0, max(accumulate(gain)))","static":["accumulate([-5,1,5,0,-7]) = [-5, -4, 1, 1, -6] — các độ cao liên tiếp","max(accumulate(...)) = 1 (đạt tại điểm sau bước thứ 3)","max(0, 1) = 1 — có 0 vì điểm xuất phát ở độ cao 0","Với [-4,-3,-2,-1,4,3,2]: accumulate = [-4,-7,-9,-10,-6,-3,-1]; max(0, -1) = 0","Gọn một dòng nhưng tốn O(n) bộ nhớ"],"_pno":"1732","steps":[{"note":"accumulate([-5,1,5,0,-7]) = [-5, -4, 1, 1, -6] — các độ cao liên tiếp"},{"note":"max(accumulate(...)) = 1 (đạt tại điểm sau bước thứ 3)"},{"note":"max(0, 1) = 1 — có 0 vì điểm xuất phát ở độ cao 0"},{"note":"Với [-4,-3,-2,-1,4,3,2]: accumulate = [-4,-7,-9,-10,-6,-3,-1]; max(0, -1) = 0"},{"note":"Gọn một dòng nhưng tốn O(n) bộ nhớ"}],"anim":false},{"name":"Vét cạn tính từng điểm","time":"O(n²)","space":"O(1)","idea":"Tính độ cao từng điểm bằng sum(gain[:i]) — chậm, dùng kiểm chứng.","code":"def largest_altitude(gain):\n    best = 0\n    for i in range(len(gain)+1):\n        best = max(best, sum(gain[:i]))\n    return best","static":["Điểm i có độ cao = tổng gain[:i] (prefix)","Điểm 0: sum([]) = 0; điểm 1: -5; điểm 2: -4; điểm 3: 1; điểm 4: 1; điểm 5: -6","best = max(0, -5, -4, 1, 1, -6) = 1","Mỗi sum() là O(n) → tổng O(n²)","Chỉ hợp kiểm chứng độ đúng của approach 1"],"_pno":"1732","steps":[{"note":"Điểm i có độ cao = tổng gain[:i] (prefix)"},{"note":"Điểm 0: sum([]) = 0; điểm 1: -5; điểm 2: -4; điểm 3: 1; điểm 4: 1; điểm 5: -6"},{"note":"best = max(0, -5, -4, 1, 1, -6) = 1"},{"note":"Mỗi sum() là O(n) → tổng O(n²)"},{"note":"Chỉ hợp kiểm chứng độ đúng của approach 1"}],"anim":false}],"thinking":{"forward":"Cộng dồn từng gain để có độ cao hiện tại, giữ mốc cao nhất.","reverse":"Cần độ cao đỉnh → đi qua từng điểm, tổng tích luỹ là độ cao tại đó."},"note":"Cộng dồn độ cao, cập nhật max qua từng điểm."},{"no":"1752","title":"Check if Array Is Sorted and Rotated","cat":"Array / String","diff":"Easy","statement":"Mảng nums được tạo bằng cách xoay vòng một mảng tăng dần (không giảm) đã sắp xếp, hoặc chính nó. Xác nhận điều đó.","examples":"[3,4,5,1,2] → true (xoay trái 2 lần của [1,2,3,4,5]) · [2,1,3,4] → false · [1,2,3] → true","keyIdea":"Đếm số chỗ 'giảm' khi quét vòng quanh (kể cặp cuối→đầu); mảng hợp lệ khi có nhiều nhất 1 chỗ giảm.","approaches":[{"name":"Đếm chỗ giảm trên vòng tròn","time":"O(n)","space":"O(1)","idea":"drops = số i mà nums[i] > nums[(i+1)%n]; hợp lệ khi drops <= 1.","code":"def check_rotated_sorted(nums):\n    n = len(nums)\n    drops = sum(1 for i in range(n) if nums[i] > nums[(i+1) % n])\n    return drops <= 1","tcex":{"input":{"nums":[3,4,5,1,2]},"kind":"array","display":"nums","ptrs":["i"],"expected":true,"anim":true},"_pno":"1752","steps":[{"note":"n = len(nums)","line":2,"array":[3,4,5,1,2],"explain":"Đang thực thi: n = len(nums)"},{"read":[{"target":0,"value":3},{"target":1,"value":4},{"target":1,"value":4},{"target":2,"value":5},{"target":2,"value":5},{"target":3,"value":1},{"target":3,"value":1},{"target":4,"value":2},{"target":4,"value":2},{"target":0,"value":3}],"ptr":{"i":0},"note":"So sánh 3 vs 4; i→0 — drops = sum(1 for i in range(n) if nums[i] > nums[(i+1) % n])","line":3,"array":[3,4,5,1,2],"explain":"So sánh 3 vs 4 để chọn hướng xử lý i=0"},{"note":"return drops <= 1 — Kết thúc — đáp án: True ✓ (khớp kỳ vọng)","line":4,"array":[3,4,5,1,2],"end":true,"answer":true,"explain":"→ Đáp án: True"}],"anim":true},{"name":"Tìm điểm gãy rồi kiểm tra vòng quanh","time":"O(n)","space":"O(1)","idea":"Tìm vị trí gãy duy nhất (nums[i] > nums[i+1]); từ đó chạy vòng quanh kiểm tra mọi cặp kề vẫn tăng dần.","code":"def check_rotated_sorted(nums):\n    n = len(nums)\n    for i in range(n-1):\n        if nums[i] > nums[i+1]:\n            return all(nums[(k+1) % n] >= nums[k % n] for k in range(i+1, i+1+n-1))\n    return True","tcex":{"input":{"nums":[2,1,3,4]},"kind":"array","display":"nums","ptrs":["i","k"],"expected":false,"anim":true},"_pno":"1752","steps":[{"note":"n = len(nums)","line":2,"array":[2,1,3,4],"explain":"Đang thực thi: n = len(nums)"},{"note":"for i in range(n-1):","line":3,"array":[2,1,3,4],"explain":"Duyệt: for i in range(n-1):"},{"read":[{"target":0,"value":2},{"target":1,"value":1}],"ptr":{"i":0},"note":"So sánh 2 vs 1; i→0 — if nums[i] > nums[i+1]:","line":4,"array":[2,1,3,4],"explain":"So sánh 2 vs 1 để chọn hướng xử lý i=0"},{"read":[{"target":2,"value":3},{"target":1,"value":1},{"target":3,"value":4},{"target":2,"value":3},{"target":0,"value":2},{"target":3,"value":4}],"ptr":{"i":0},"note":"So sánh 3 vs 1; i→0 — return all(nums[(k+1) % n] >= nums[k % n] for k in range(i+1, i+1+n-1)) — Kết thúc — đáp án: False ✓ (khớp kỳ vọng)","line":5,"array":[2,1,3,4],"end":true,"answer":false,"explain":"So sánh 3 vs 1 để chọn hướng xử lý → Đáp án: False i=0"}],"anim":true},{"name":"So với bản sort rồi xoay","time":"O(n²)","space":"O(n)","idea":"Nếu nums là xoay vòng của bản đã sắp, so nó với mọi phép xoay của sorted(nums).","code":"def check_rotated_sorted(nums):\n    s = sorted(nums)\n    for k in range(len(nums)):\n        if nums == s[k:] + s[:k]: return True\n    return False","static":["s = sorted(nums) là mảng gốc tăng dần","Thử mọi phép xoay trái k của s rồi so với nums","Với [3,4,5,1,2]: s=[1,2,3,4,5]; xoay k=2 cho [3,4,5,1,2] → khớp → true","Với [2,1,3,4]: s=[1,2,3,4]; không phép xoay nào cho [2,1,3,4] → false","O(n²) vì mỗi lần so sánh mảng O(n)"],"_pno":"1752","steps":[{"note":"s = sorted(nums) là mảng gốc tăng dần"},{"note":"Thử mọi phép xoay trái k của s rồi so với nums"},{"note":"Với [3,4,5,1,2]: s=[1,2,3,4,5]; xoay k=2 cho [3,4,5,1,2] → khớp → true"},{"note":"Với [2,1,3,4]: s=[1,2,3,4]; không phép xoay nào cho [2,1,3,4] → false"},{"note":"O(n²) vì mỗi lần so sánh mảng O(n)"}],"anim":false}],"thinking":{"forward":"Mảng xoay-vòng-sắp chỉ 'vỡ' đúng một lần khi quét vòng quanh.","reverse":"Cần xác nhận đã sắp + xoay → đếm số cặp kề giảm (kể cặp cuối-đầu) phải ≤ 1."},"note":"Đếm số chỗ 'giảm' khi quét vòng quanh (kể cặp cuối→đầu); mảng hợp lệ khi có nhiều nhất 1 chỗ giảm."},{"no":"1790","title":"Check if One String Swap Can Make Strings Equal","cat":"Array / String","diff":"Easy","statement":"Xem có đổi chỗ đúng HAI ký tự trong s1 để s1 thành s2 không (hoặc đã bằng nhau sẵn). Mỗi chuỗi chỉ đổi đúng một lần.","examples":"s1='bank', s2='kanb' → true · s1='attack', s2='defend' → false · s1='kelb', s2='kelb' → true","keyIdea":"Sai khác phải đúng 2 vị trí và chúng khớp chéo: s1[i]==s2[j] và s1[j]==s2[i].","approaches":[{"name":"Thu các vị trí khác biệt","time":"O(n)","space":"O(1)","idea":"diff = các i mà s1[i] != s2[i]; hợp lệ khi len(diff)==0, hoặc len(diff)==2 và s1[diff[0]]==s2[diff[1]] và s1[diff[1]]==s2[diff[0]].","code":"def are_almost_equal(s1, s2):\n    diff = [i for i in range(len(s1)) if s1[i] != s2[i]]\n    return len(diff) == 0 or (len(diff) == 2 and s1[diff[0]] == s2[diff[1]] and s1[diff[1]] == s2[diff[0]])","tcex":{"input":{"s1":"bank","s2":"kanb"},"kind":"none","expected":true,"anim":true},"_pno":"1790","steps":[{"note":"diff = [i for i in range(len(s1)) if s1[i] != s2[i]]","line":2,"explain":"diff = [i for i in range(len(s1)) if s1[i] != s2[i]]"},{"note":"return len(diff) == 0 or (len(diff) == 2 and s1[diff[0]] == s2[diff[1]] and s1[diff[1]] == s2[diff[0]]) — Kết thúc — đáp án: True ✓ (khớp kỳ vọng)","line":3,"end":true,"answer":true,"explain":"→ Đáp án: True"}],"anim":true},{"name":"Hai con trỏ phát hiện sai khác","time":"O(n)","space":"O(1)","idea":"Đi qua từng vị trí, ghi nhớ tối đa hai cặp sai; sai thứ ba → false; kiểm tra khớp chéo khi có đúng hai.","code":"def are_almost_equal(s1, s2):\n    a = b = None\n    for i, (x, y) in enumerate(zip(s1, s2)):\n        if x == y: continue\n        if a is None:\n            a = i\n        elif b is None:\n            b = i\n        else:\n            return False\n    return a is None or (b is not None and s1[a] == s2[b] and s1[b] == s2[a])","static":["Duyệt từng vị trí, lưu hai chỉ số sai đầu tiên a, b; sai thứ ba → false","Với 'bank'/'kanb': sai ở vị trí 0 ('b' vs 'k') và 2 ('n' vs 'a')","Kiểm tra chéo: s1[0]='b' == s2[2]='b' và s1[2]='n' == s2[0]='n' → true","Với 'attack'/'defend': sai tới vị trí thứ ba → false ngay","Không tạo mảng diff — O(1) bộ nhớ"],"_pno":"1790","steps":[{"note":"Duyệt từng vị trí, lưu hai chỉ số sai đầu tiên a, b; sai thứ ba → false"},{"note":"Với 'bank'/'kanb': sai ở vị trí 0 ('b' vs 'k') và 2 ('n' vs 'a')"},{"note":"Kiểm tra chéo: s1[0]='b' == s2[2]='b' và s1[2]='n' == s2[0]='n' → true"},{"note":"Với 'attack'/'defend': sai tới vị trí thứ ba → false ngay"},{"note":"Không tạo mảng diff — O(1) bộ nhớ"}],"anim":false},{"name":"Counter + đếm sai khác","time":"O(n)","space":"O(1)","idea":"Hai chuỗi phải có cùng đa tập ký tự (Counter bằng nhau) VÀ số vị trí sai khác ≤ 2.","code":"def are_almost_equal(s1, s2):\n    from collections import Counter\n    if Counter(s1) != Counter(s2): return False\n    return sum(a != b for a, b in zip(s1, s2)) <= 2","static":["Counter(s1) == Counter(s2) đảm bảo cùng bộ ký tự và tần suất","Đếm số vị trí khác nhau: với 'bank'/'kanb' là 2 vị trí","Với 'aa'/'ac': Counter khác → false (không thể đổi 1 lần)","Với 'attack'/'defend': Counter khác ('a','t','k' vs 'd','e','f','n') → false","Điều kiện sai khác ≤ 2 kết hợp Counter là đủ"],"_pno":"1790","steps":[{"note":"Counter(s1) == Counter(s2) đảm bảo cùng bộ ký tự và tần suất"},{"note":"Đếm số vị trí khác nhau: với 'bank'/'kanb' là 2 vị trí"},{"note":"Với 'aa'/'ac': Counter khác → false (không thể đổi 1 lần)"},{"note":"Với 'attack'/'defend': Counter khác ('a','t','k' vs 'd','e','f','n') → false"},{"note":"Điều kiện sai khác ≤ 2 kết hợp Counter là đủ"}],"anim":false}],"thinking":{"forward":"Chỉ hai vị trí được phép sai, và chúng phải 'trao đổi' đúng ký tự.","reverse":"Cần xác nhận đổi 1 lần đủ → đếm và kiểm tra các vị trí lệch, phần còn lại phải giống."},"note":"Sai khác phải đúng 2 vị trí và chúng khớp chéo: s1[i]==s2[j] và s1[j]==s2[i]."},{"no":"1903","title":"Largest Odd Number in String","cat":"Array / String","diff":"Easy","statement":"Cho chuỗi số num. Tìm CHUỖI CON KHÔNG RỖNG có giá trị số LỚN NHẤT mà là số lẻ. Trả chuỗi đó; không có thì ''.","examples":"num='52' → '5' · num='4206' → '' · num='35427' → '35427'","keyIdea":"Số lẻ phải tận cùng bằng chữ số lẻ; giữ tiền tố dài nhất có chữ số cuối lẻ.","approaches":[{"name":"Quét từ phải tìm chữ số lẻ cuối","time":"O(n)","space":"O(1)","idea":"Đi từ cuối về đầu, chữ số lẻ gặp đầu tiên là điểm cắt; trả num[:i+1].","code":"def largest_odd_number(num):\n    for i in range(len(num)-1, -1, -1):\n        if int(num[i]) % 2 == 1:\n            return num[:i+1]\n    return ''","tcex":{"input":{"num":"52"},"kind":"none","expected":"5","anim":true},"_pno":"1903","steps":[{"note":"for i in range(len(num)-1, -1, -1):","line":2,"explain":"Duyệt: for i in range(len(num)-1, -1, -1):"},{"note":"if int(num[i]) % 2 == 1:","line":3,"explain":"Kiểm tra điều kiện: if int(num[i]) % 2 == 1:"},{"note":"for i in range(len(num)-1, -1, -1):","line":2,"explain":"Duyệt: for i in range(len(num)-1, -1, -1):"},{"note":"if int(num[i]) % 2 == 1:","line":3,"explain":"Kiểm tra điều kiện: if int(num[i]) % 2 == 1:"},{"note":"return num[:i+1] — Kết thúc — đáp án: 5 ✓ (khớp kỳ vọng)","line":4,"end":true,"answer":"5","explain":"→ Đáp án: 5"}],"anim":true},{"name":"Regex bắt đuôi chữ số lẻ","time":"O(n)","space":"O(1)","idea":"re.search(r'\\d*[13579]', num) bắt tiền tố dài nhất tận cùng chữ số lẻ.","code":"import re\ndef largest_odd_number(num):\n    m = re.search(r'\\d*[13579]', num)\n    return m.group(0) if m else ''","static":["Pattern r'\\d*[13579]' khớp chuỗi chữ số dài nhất tận cùng bằng chữ số lẻ","Với '52': khớp '5' (dừng ngay khi đuôi 5 lẻ) → trả '5'","Với '35427': regex khớp toàn bộ '35427' (7 lẻ) → trả '35427'","Với '4206': không có đuôi lẻ nào → m = None → ''","Tương đương approach 1 nhưng gọn nhờ regex"],"_pno":"1903","steps":[{"note":"Pattern r'\\d*[13579]' khớp chuỗi chữ số dài nhất tận cùng bằng chữ số lẻ"},{"note":"Với '52': khớp '5' (dừng ngay khi đuôi 5 lẻ) → trả '5'"},{"note":"Với '35427': regex khớp toàn bộ '35427' (7 lẻ) → trả '35427'"},{"note":"Với '4206': không có đuôi lẻ nào → m = None → ''"},{"note":"Tương đương approach 1 nhưng gọn nhờ regex"}],"anim":false},{"name":"Chỉ cần nhìn chữ số cuối","time":"O(n)","space":"O(1)","idea":"Giải thích tại sao chữ số cuối quyết định: một số lẻ khi tận cùng thuộc {1,3,5,7,9}; không cần chuyển nguyên chuỗi thành số.","code":"def largest_odd_number(num):\n    for i in range(len(num)-1, -1, -1):\n        if int(num[i]) % 2 == 1:\n            return num[:i+1]\n    return ''","static":["Số lẻ khi chữ số tận cùng là một trong {1,3,5,7,9}","Chữ số tận cùng càng về PHẢI thì tiền tố càng dài → giá trị càng lớn","Đi từ phải sang, lần gặp chữ số lẻ đầu tiên cho tiền tố dài nhất có thể","Với num='35427': vị trí cuối '7' lẻ ngay → cắt cả chuỗi '35427'","Không cần int(toàn chuỗi) — tránh tràn số với chuỗi rất dài (số có tới 10⁵ chữ số)"],"_pno":"1903","steps":[{"note":"Số lẻ khi chữ số tận cùng là một trong {1,3,5,7,9}"},{"note":"Chữ số tận cùng càng về PHẢI thì tiền tố càng dài → giá trị càng lớn"},{"note":"Đi từ phải sang, lần gặp chữ số lẻ đầu tiên cho tiền tố dài nhất có thể"},{"note":"Với num='35427': vị trí cuối '7' lẻ ngay → cắt cả chuỗi '35427'"},{"note":"Không cần int(toàn chuỗi) — tránh tràn số với chuỗi rất dài (số có tới 10⁵ chữ số)"}],"anim":false}],"thinking":{"forward":"Số lẻ nhận biết bằng chữ số cuối; tiền tố càng dài giá trị càng lớn.","reverse":"Cần chuỗi con số lớn nhất là lẻ → tìm vị trí phải nhất có chữ số lẻ, cắt từ đầu tới đó."},"note":"Số lẻ phải tận cùng bằng chữ số lẻ; giữ tiền tố dài nhất có chữ số cuối lẻ."}]};

const KW=new Set("def return if elif else for while in not and or None True False break continue pass import from as with class lambda".split(" "));
function hlpy(code){
  // token hoá: comment, string, số, keyword, còn lại giữ nguyên
  let out="",i=0;
  const seg=code;
  while(i<seg.length){
    const rest=seg.slice(i);
    let m=rest.match(/^#.*/);
    if(m){out+='<span class="c">'+esc(m[0])+'</span>';i+=m[0].length;continue}
    m=rest.match(/^("""[\s\S]*?"""|'''[\s\S]*?'''|"[^"\n]*"|'[^'\n]*')/);
    if(m){out+='<span class="s">'+esc(m[0])+'</span>';i+=m[0].length;continue}
    m=rest.match(/^\d+(\.\d+)?/);
    if(m){out+='<span class="n">'+esc(m[0])+'</span>';i+=m[0].length;continue}
    m=rest.match(/^[A-Za-z_][A-Za-z0-9_]*/);
    if(m){const w=m[0];out+=KW.has(w)?'<span class="k">'+w+'</span>':esc(w);i+=w.length;continue}
    out+=esc(rest[0]);i++;
  }
  return out;
}

/* ---------- Player v2 (animation thủ công, đa cấu trúc) ---------- */
const isNodeTarget=t=>t&&typeof t==="object"&&"node" in t;
function _pickKind(step){
  if(step.mat!==undefined)return "mat";
  if(step.ll!==undefined)return "ll";
  if(step.tree!==undefined)return "tree";
  if(step.stack!==undefined)return "stack";
  if(step.hash!==undefined)return "hash";
  if(step.set!==undefined)return "set";
  return "array";
}
class Player{
  constructor(host,steps,cfg){
    this.host=host;this.steps=steps;this.cfg=cfg||{};this.idx=0;
    this.ctl=el("div","ctl");
    this.note=el("p","note","");
    this.wrap=el("div","cells-wrap");
    this.box=el("div","cells");this.ptrLayer=el("div","ptrs");
    this.wrap.appendChild(this.box);this.wrap.appendChild(this.ptrLayer);
    this.auxBox=el("div","aux");this.auxBox.style.display="none";
    this.cellEls=[];this.ptrEls=new Map();this.nodeEls=new Map();this.rowEls=[];this.hashEls=[];this.hideCache=new Map();
    // detect kind ổn định từ step đầu có dữ liệu
    this.kind=_pickKind(steps[0]);
    for(const st of steps){const k=_pickKind(st);if(k!=="array"){this.kind=k;break}}
    this.buildCells();this.buildPtrs();this.buildControls();
    // code pane: hiển thị code + sáng dòng hiện tại (nếu step có line)
    this.codePane=null;
    if(this._hasLines()){this.buildCodePane()}
    this.stepTo(0);
    host.innerHTML="";host.appendChild(this.ctl);host.appendChild(this.note);host.appendChild(this.wrap);host.appendChild(this.auxBox);
    if(this.codePane)host.appendChild(this.codePane);
  }
  _hasLines(){for(const s of this.steps){if(s.line!==undefined&&s.line>0)return true}return false}
  buildCodePane(){
    const pre=el("pre","code pane");
    // gắn code nếu cfg.code truyền
    const code=this.cfg&&this.cfg.code;
    if(code)pre.innerHTML=hlpy(code);
    else{pre.textContent="(code đang chạy — bật cfg.code để hiển thị)";pre.style.color="var(--mut)";pre.style.fontSize="12px"}
    this.codePane=pre;
    this.lineEls=[];
    if(code){pre.innerHTML=hlpy(code);this.lineEls=[...pre.querySelectorAll("div,span")]}
  }
  renderCode(s){
    if(!this.codePane)return;
    // bỏ highlight cũ
    this.lineEls.forEach(l=>{l.classList&&l.classList.remove("curline")});
    const ln=s.line;
    if(!ln)return;
    // tìm dòng thứ ln trong code pane — cách đơn giản: đánh dấu theo vị trí
    const pre=this.codePane;
    // chia theo dòng text
    const htmlLines=pre.innerHTML.split("\n");
    // xây bản đồ: dòng thứ k → index thẻ chứa
    if(!this._lineIdx){this._lineIdx={};const all=pre.querySelectorAll("span,div");let k=0;for(let idx=0;idx<all.length;idx++){const t=all[idx];this._lineIdx[k++]=t}}
    const elx=this._lineIdx[ln-1]||this._lineIdx[0];
    if(elx){elx.classList&&elx.classList.add("curline");elx.scrollIntoView&&elx.scrollIntoView({block:"nearest"})}
  }
  /* ---------- dựng khung ---------- */
  buildCells(){
    const k=this.kind;
    if(k==="mat"){ // cần đủ số hàng từ mọi step
      const rows=Math.max(...this.steps.map(s=>s.mat?s.mat.length:0));
      for(let r=0;r<rows;r++){
        const rd=el("div","mrow");
        const cols=Math.max(...this.steps.map(s=>s.mat&&s.mat[r]?s.mat[r].length:0));
        for(let c=0;c<cols;c++){
          const d=el("div","cell mcell");
          d.appendChild(el("span","cv",""));
          d.appendChild(el("span","ci",r+","+c));
          rd.appendChild(d);this.cellEls.push(d);
        }
        this.box.appendChild(rd);
      }
      this.box.classList.add("mat");return;
    }
    if(k==="stack"){
      this.box.classList.add("stack");
      this.stackRow=el("div","stack-row");
      this.stackRow.appendChild(this.box);
      this.stackPtrs=el("div","stack-ptrs");
      this.stackRow.appendChild(this.stackPtrs);
      this.wrap.appendChild(this.stackRow);
      this.topLabel=el("div","topb","top");this.box.appendChild(this.topLabel);
      return;
    }
    if(k==="hash"){this.box.classList.add("hash");return}
    if(k==="set"){this.box.classList.add("set");return}
    if(k==="ll"||k==="tree"){
      this.box.classList.add(k==="tree"?"tree":"ll");
      this.tbox=el("div","tbox");this.tbox.appendChild(this.box);this.wrap.appendChild(this.tbox);
      return;
    }
    // array: dựng từ step đầu
    const c0=this.steps[0];
    const cells=(c0.array||c0.cells||[]);
    cells.forEach((c,i)=>{
      const d=el("div","cell");
      const v=typeof c==="object"?c.value:c;
      if(c&&c.keep)d.classList.add("keep");
      if(c&&c.dead)d.classList.add("dead");
      if(c&&c.zone==="tail")d.classList.add("tail");
      d.appendChild(el("span","cv",v));
      d.appendChild(el("span","ci",String(i)));
      this.box.appendChild(d);this.cellEls.push(d);
    });
  }
  buildPtrs(){
    const names=new Set();
    this.steps.forEach(s=>{if(s.ptr)Object.keys(s.ptr).forEach(x=>names.add(x));});
    names.forEach(n=>{const p=el("span","ptr",n);p.style.display="none";this.ptrLayer.appendChild(p);this.ptrEls.set(n,p)});
  }
  buildControls(){
    const mk=(t,fn,title)=>{const b=el("button","btn",t);b.title=title||"";b.onclick=fn;this.ctl.appendChild(b);return b};
    mk("⏮",()=>this.stepTo(0),"Về đầu");
    mk("◀",()=>this.stepTo(this.idx-1),"Lùi 1 bước");
    mk(">",()=>this.stepTo(this.idx+1),"Tiến 1 bước");
    mk("⏭",()=>this.stepTo(this.steps.length-1),"Tới kết quả");
    this.counter=el("span","sp","");this.ctl.appendChild(this.counter);
    this.range=el("input","rng");this.range.type="range";this.range.min=0;this.range.max=Math.max(0,this.steps.length-1);this.range.value=0;
    this.range.oninput=()=>this.stepTo(+this.range.value);this.ctl.appendChild(this.range);
    // keyboard: ← → Home End khi host được focus
    this._kd=e=>{
      if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
      if(e.key==="ArrowLeft"){this.stepTo(this.idx-1);e.preventDefault()}
      else if(e.key==="ArrowRight"){this.stepTo(this.idx+1);e.preventDefault()}
      else if(e.key==="Home"){this.stepTo(0);e.preventDefault()}
      else if(e.key==="End"){this.stepTo(this.steps.length-1);e.preventDefault()}
    };
    this.host.addEventListener("keydown",this._kd);
    this.host.tabIndex=0;
  }
  /* ---------- highlight helpers ---------- */
  _markTarget(target,cls){
    // target: [i] | [r,c] | {node:id} | node-id | string-key (hash)
    if(!target)return null;
    let idx=-1,elx=null;
    if(Array.isArray(target)){
      if(this.kind==="mat"){const[r,c]=target;const cols=this._matCols();idx=r*cols+c}
      else idx=target[0];
    }else if(typeof target==="object"&&target.node!==undefined)idx=target.node;
    else if(typeof target==="number")idx=target;
    else if(typeof target==="string"&&this.kind==="hash"){
      for(let i=0;i<this.hashEls.length;i++){
        const hk=this.hashEls[i].querySelector(".hk");
        if(hk&&hk.textContent===target){idx=i;break}
      }
    }
    if(idx<0)return null;
    const ce=this.cellEls[idx];
    if(ce)ce.classList.add(cls);
    const ne=this.nodeEls.get(idx);
    if(ne)ne.classList.add(cls);
    return ce||ne||null;
  }
  _matCols(){
    let max=0;
    for(const s of this.steps)if(s.mat)max=Math.max(max,...s.mat.map(r=>r.length));
    return max;
  }
  /* ---------- render dữ liệu node (ll/tree) ---------- */
  renderNodes(s){
    const data=s[this.kind];
    if(!data||!data.nodes){if(this.box)this.box.innerHTML="";this.nodeEls.clear();return}
    if(this.kind==="ll"){
      this._renderLL(data);
    }else{
      this._renderTree(data);
    }
    this._applyNodeHighlights(s);
  }
  _renderLL(data){
    /* dãy node nằm ngang: node đứng yên, cập nhật giá trị + độ rộng value */
    if(!this.llRow){this.llRow=el("div","llrow");this.box.appendChild(this.llRow)}
    this.llRow.innerHTML="";this.nodeEls.clear();
    let cur=data.head!==undefined?data.head:data.root;
    const seen=new Set();
    let guard=0;
    while(cur!==null&&cur!==undefined&&!seen.has(cur)&&guard++<100){
      seen.add(cur);
      const nd=data.nodes[cur];if(!nd)break;
      const nodeEl=el("div","node");
      nodeEl.appendChild(el("span","cv",String(nd.value)));
      nodeEl.appendChild(el("span","nid",String(cur)));
      this.llRow.appendChild(nodeEl);this.nodeEls.set(cur,nodeEl);
      const nxt=nd.next;
      if(nxt!==null&&nxt!==undefined){const a=el("span","arrow","→");this.llRow.appendChild(a)}
      cur=nxt;
    }
  }
  _renderTree(data){
    /* cây: BFS → lưới; node ở hàng = depth, cột = thứ tự trái→phải; cạnh vẽ bằng SVG */
    if(!this.tgrid){
      this.tgrid=el("div","tgrid");
      this.box.appendChild(this.tgrid);
      this.svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
      this.svg.style.position="absolute";this.svg.style.top="0";this.svg.style.left="0";this.svg.style.overflow="visible";
      this.tgrid.appendChild(this.svg);
    }
    const depth={},pos={};
    const bfs=(()=>{
      const root=data.root;
      if(root===null||root===undefined||root===-1)return;
      const layer=[[root,0,0]];
      depth[root]=0;pos[root]=0;
      while(layer.length){
        const item=layer.shift();
        const id=item[0],d=item[1],p=item[2];
        const nd=data.nodes[id];if(!nd)continue;
        const step=(nd.left!==null&&nd.left!==undefined&&nd.left!==-1)?1:0;
        const child=d+1;
        if(nd.left!==null&&nd.left!==undefined&&nd.left!==-1){
          depth[nd.left]=child;pos[nd.left]=p;
          layer.push([nd.left,child,p]);
        }
        if(nd.right!==null&&nd.right!==undefined&&nd.right!==-1){
          depth[nd.right]=child;pos[nd.right]=p+step;
          layer.push([nd.right,child,p+step]);
        }
      }
    })();
    const H=Object.keys(depth).reduce((mx,id)=>Math.max(mx,depth[id]+1),0)||0;
    const W=Object.keys(pos).reduce((mx,id)=>Math.max(mx,pos[id]+1),0)||0;
    const L=H>0?90:72,Wd=W>0?88:72;
    this.tgrid.style.gridTemplateColumns="repeat("+Math.max(1,W)+",88px)";
    /* tạo/cập nhật node theo id */
    for(const id in data.nodes){
      const nd=data.nodes[id];
      if(nd.vis===false){const old=this.nodeEls.get(+id);if(old)old.style.display="none";continue}
      let n=this.nodeEls.get(+id);
      if(!n){
        n=el("div","node tnd");
        n.appendChild(el("span","cv",""));
        n.appendChild(el("span","nid",""));
        n.appendChild(el("span","nstate",""));
        n.appendChild(el("span","nst",""));
        this.nodeEls.set(+id,n);
        this.tgrid.insertBefore(n,this.svg);
      }
      n.querySelector(".cv").textContent=String(nd.value);
      // ẩn id BFS — narrative dùng GIÁ TRỊ làm nhận diện, id chỉ gây nhầm
      n.querySelector(".nid").textContent="";
      const st=n.querySelector(".nstate");
      if(nd.state!==undefined&&nd.state!==null&&nd.state!==""){st.textContent=String(nd.state);st.style.display=""}
      else st.style.display="none";
      n.style.gridRow=(depth[+id]!==undefined?depth[+id]:0)+1;
      n.style.gridColumn=(pos[+id]!==undefined?pos[+id]:0)+1;
      n.style.display="";
    }
    /* ẩn node cũ không còn trong dữ liệu */
    this.nodeEls.forEach((n,id)=>{
      if(!(id in data.nodes))n.style.display="none";
    });
    /* dây nối cha→con (SVG) */
    const arcs=[];
    for(const id in data.nodes){
      const nd=data.nodes[id];
      const px=(pos[+id]||0)*Wd+44,py=(depth[+id]||0)*L+44;
      if(nd.left!==null&&nd.left!==undefined&&nd.left!==-1&&data.nodes[nd.left]){
        const lx=(pos[nd.left]||0)*Wd+44,ly=(depth[nd.left]||0)*L+44;
        arcs.push("M"+px+" "+py+" L"+lx+" "+ly);
      }
      if(nd.right!==null&&nd.right!==undefined&&nd.right!==-1&&data.nodes[nd.right]){
        const rx=(pos[nd.right]||0)*Wd+44,ry=(depth[nd.right]||0)*L+44;
        arcs.push("M"+px+" "+py+" L"+rx+" "+ry);
      }
    }
    const tw=Math.max(88,(W-1)*Wd+88),th=Math.max(88,(H-1)*L+88);
    this.svg.setAttribute("width",tw);
    this.svg.setAttribute("height",th);
    this.svg.setAttribute("viewBox","0 0 "+tw+" "+th);
    this.svg.innerHTML=arcs.map(d=>"<path d='"+d+"' stroke='#2f3c5c' stroke-width='2' fill='none'/>").join("");
    this.box.style.minWidth=tw+"px";
  }
  _swapPairs(s){
    if(!s.swap)return[];
    const pairs=Array.isArray(s.swap)&&s.swap.length&&Array.isArray(s.swap[0])?s.swap:[s.swap];
    return pairs.filter(p=>p&&p.length===2);
  }
  _applyNodeHighlights(s){
    this.nodeEls.forEach(n=>{n.classList.remove("rd","wr","sw","act");const b=n.querySelector(".nst");if(b)b.style.display="none"});
    // badge "đọc"/"ghi" trên node đang tương tác (tree/ll)
    if(s.read)[].concat(s.read).forEach(r=>{
      const hit=this._markTarget(r.target,"rd");
      if(hit){const b=hit.querySelector&&hit.querySelector(".nst");if(b){b.textContent="đọc";b.style.display=""}}
    });
    if(s.write&&s.write.dest!==undefined&&!s.write.bake){
      const hit=this._markTarget(s.write.dest,"wr");
      if(hit){const b=hit.querySelector&&hit.querySelector(".nst");if(b){b.textContent="ghi";b.style.display=""}}
    }
    this._swapPairs(s).forEach(([a,b])=>{this._markTarget(a,"sw");this._markTarget(b,"sw")});
    // ptr → node-id: highlight + badge trên node
    if(s.ptr&&this.kind!=="array"&&this.kind!=="mat"){
      const names=Object.keys(s.ptr);
      const active=new Set();
      Object.values(s.ptr).forEach((v,vi)=>{
        const id=typeof v==="number"?v:(isNodeTarget(v)?v.node:-1);
        if(id<0)return;
        active.add(id);
        const n=this.nodeEls.get(id);
        if(n)n.classList.add("act");
        let b=n&&n.querySelector(".ptr-tag");
        if(n&&!b){b=el("span","ptr-tag",names[vi]||"?");b.style.cssText="position:absolute;top:-14px;left:50%;transform:translateX(-50%);z-index:3;white-space:nowrap";n.appendChild(b)}
        if(b)b.textContent=names[vi]||"?";
      });
      /* ẩn badge của node không còn con trỏ */
      this.nodeEls.forEach((n,id)=>{
        if(active.has(id))return;
        const b=n.querySelector(".ptr-tag");
        if(b)b.style.display="none";
      });
    }
  }
  /* ---------- render dữ liệu cell (array/mat/stack/hash/set) ---------- */
  renderCells(s){
    this.cellEls.forEach(x=>x.classList.remove("rd","wr","sw","act"));
    if(this.kind==="mat"){
      const cols=this._matCols();
      if(s.mat)s.mat.forEach((row,r)=>row.forEach((v,c)=>{const i=r*cols+c;const ce=this.cellEls[i];if(ce){const cv=ce.querySelector(".cv");if(cv)cv.textContent=String(v)}}));
      // write colored → tô xanh lục cho đúng ô
      this.cellEls.forEach(x=>x.classList.remove("colored"));
      if(s.write&&s.write.dest&&Array.isArray(s.write.dest)&&s.write.colored){
        const[r,c]=s.write.dest;const ce=this.cellEls[r*cols+c];
        if(ce)ce.classList.add("colored");
      }
    }else if(this.kind==="array"){
      const src=s.display||s.array;
      if(Array.isArray(src))src.forEach((v,p)=>{const cv=this.cellEls[p]&&this.cellEls[p].querySelector(".cv");if(cv&&cv.textContent!==String(v))cv.textContent=v});
    }else if(this.kind==="stack"){
      this.box.innerHTML="";this.cellEls=[];
      const arr=Array.isArray(s.stack)?s.stack:[];
      arr.forEach(v=>{const d=el("div","cell scol");d.appendChild(el("span","cv",v));this.cellEls.push(d);this.box.appendChild(d)});
      this.box.appendChild(this.topLabel);
    }else if(this.kind==="hash"){
      this.box.innerHTML="";this.cellEls=[];this.hashEls=[];
      const pairs=typeof s.hash==="object"&&!Array.isArray(s.hash)?Object.entries(s.hash):s.hash||[];
      pairs.forEach(([k,v])=>{const hp=el("div","hpair");hp.appendChild(el("span","hk",k));hp.appendChild(el("span","hv",v));this.cellEls.push(hp);this.hashEls.push(hp);this.box.appendChild(hp)});
    }else if(this.kind==="set"){
      this.box.innerHTML="";this.cellEls=[];
      const arr=s.set||[];
      arr.forEach(v=>{const d=el("div","sbadge");d.appendChild(el("span","cv",v));this.cellEls.push(d);this.box.appendChild(d)});
    }
    // highlight cell
    if(s.read)[].concat(s.read).forEach(r=>{this._markTarget(r.target,"rd")});
    if(s.write&&s.write.dest!==undefined&&!s.write.bake)this._markTarget(s.write.dest,"wr");
    const swapPairs=this._swapPairs(s);
    swapPairs.forEach(([a,b])=>{this._markTarget(a,"sw");this._markTarget(b,"sw")});
    if(s.cells)s.cells.forEach((c,i)=>{if(c&&c.active&&this.cellEls[i])this.cellEls[i].classList.add("act")});
    // stack: highlight top (ô cuối) + con trỏ dọc bên phải
    if(this.kind==="stack"){
      const top=this.cellEls[this.cellEls.length-1];
      if(top)top.classList.add("top");
      this.renderStackPtrs(s);
      return;
    }
    // hash highlight theo cặp
    if(this.kind==="hash"){
      this.hashEls.forEach(x=>x.classList.remove("rd","wr","sw"));
      if(s.read)[].concat(s.read).forEach(r=>{const c=this._markTarget(r.target,"rd");if(c&&c.classList)c.classList.add("rd")});
      if(s.write&&!s.write.bake)this._markTarget(s.write.dest,"wr");
      swapPairs.forEach(([a,b])=>{this._markTarget(a,"sw");this._markTarget(b,"sw")});
    }
    // ptr trên cell: định vị
    this.ptrEls.forEach(p=>{p.style.display="none";p.style.top="1px"});
    if(s.ptr&&(this.kind==="array"||this.kind==="mat")){
      let n=0;
      const names=Object.keys(s.ptr);
      Object.values(s.ptr).forEach(pos=>{
        const nm=names[n++]||"?";
        const p=this.ptrEls.get(nm);if(!p)return;
        p.style.display="block";
        if(Array.isArray(pos)&&this.kind==="mat"){
          const[r,c]=pos;p.style.left=(c*44+8)+"px";p.style.top=(r*40+1)+"px";
        }
        else if(typeof pos==="number")p.style.left=(pos*49+8)+"px";
      });
    }
  }
  renderStackPtrs(s){
    if(!this.stackPtrs)return;
    this.stackPtrs.innerHTML="";
    if(!s.ptr)return;
    Object.keys(s.ptr).forEach(name=>{
      const pos=s.ptr[name];
      const tag=el("span","sph");
      tag.appendChild(el("span","ptr-tag",name));
      this.stackPtrs.appendChild(tag);
    });
  }
  /* ---------- aux (mảng phụ bên cạnh, vd nums2 / rotated) ---------- */
  renderAux(s){
    const a=s.aux;
    this.auxBox.style.display=a?"flex":"none";
    this.auxBox.innerHTML="";
    if(!a)return;
    const rows=Array.isArray(a)?a:[a];
    rows.forEach(aux=>{
      const lbl=el("span","alabel",aux.label||"aux");
      this.auxBox.appendChild(lbl);
      const vals=aux.values||[];
      const ac=el("div","acells");
      const amap=[];
      vals.forEach(v=>{
        const d=el("div","acell");
        d.appendChild(el("span","cv",String(v)));
        ac.appendChild(d);amap.push(d);
      });
      this.auxBox.appendChild(ac);
      const tgt=pos=>Array.isArray(pos)&&pos.length===1?pos[0]:(typeof pos==="number"?pos:-1);
      const hlAux=(i,cls)=>{if(i>=0&&i<amap.length)amap[i].classList.add(cls)};
      if(s.read)[].concat(s.read).forEach(r=>{if(r&&!isNodeTarget(r.target))hlAux(tgt(r.target),"rd")});
      if(s.write&&!s.write.bake&&!isNodeTarget(s.write.dest))hlAux(tgt(s.write.dest),"wr");
      if(s.swap)[].concat(s.swap).forEach(pair=>{if(pair&&pair.length)[0,1].forEach(k=>{if(!isNodeTarget(pair[k]))hlAux(tgt(pair[k]),"sw")})});
    });
  }
  /* ---------- note + end ---------- */
  renderNote(s){
    // ưu tiên narrative (explain) do content viết; fallback note động
    const txt = (s.explain && s.explain.trim()) ? s.explain : s.note;
    this.note.textContent=txt;
    this.note.classList.toggle("fin",!!s.end);
    const old=this.host.querySelector(".result");if(old)old.remove();
    if(s.end){const r=el("span","result",s.k!==undefined?" · k = "+s.k:(s.answer!==undefined?" · đáp án: "+s.answer:""));if(r.textContent)this.note.appendChild(r)}
  }
  stepTo(i){
    this.idx=Math.max(0,Math.min(this.steps.length-1,i));
    const s=this.steps[this.idx];
    if(this.kind==="ll"||this.kind==="tree")this.renderNodes(s);
    else this.renderCells(s);
    this.renderAux(s);
    this.renderCode(s);
    this.renderNote(s);
    this.counter.textContent=(this.idx+1)+" / "+this.steps.length;
    this.range.value=this.idx;
  }
}

/* ---------- renderer ---------- */
function render(){
  if(!DATA){document.getElementById("content").textContent="(Dữ liệu chưa được nhúng — chạy build script trước)";return}
  const g=DATA.group;
  document.title=g.title+" — Top Interview 150";
  document.getElementById("grpChip").textContent=g.count+" bài";
  document.getElementById("grpTitle").textContent=g.title;
  document.getElementById("grpDesc").textContent=g.desc||"";
  const toc=document.getElementById("toc");
  toc.innerHTML="";
  DATA.problems.forEach(p=>{
    const a=el("a","grp");a.href="#p"+p.no;
    a.appendChild(el("span","ic",p.done?"✅":"📄"));
    const d=el("span");d.appendChild(el("b","",p.no+" · "+p.title));
    d.appendChild(el("small","",p.cat+" · "+p.diff));
    a.appendChild(d);toc.appendChild(a);
  });
  const main=document.getElementById("content");
  main.innerHTML="";
  DATA.problems.forEach(p=>main.appendChild(renderProblem(p)));
  const foot=document.getElementById("foot");
  foot.textContent="Top Interview 150 · "+g.title+" · nội dung tiếng Việt · giải Python có test thật · tạo 2026-08-15";
}
function renderProblem(p){
  const s=el("section","card");s.id="p"+p.no;
  const top=el("div","sec-top");
  top.appendChild(el("h2","",p.no+" · "+p.title));
  top.appendChild(el("span","tag "+(p.diff||"easy").toLowerCase(),p.diff||"Easy"));
  top.appendChild(el("span","tag",p.cat));
  s.appendChild(top);
  s.appendChild(el("p","stmt",p.statement));
  if(p.examples)s.appendChild(el("p","ex",p.examples));
  if(p.keyIdea)s.appendChild(el("div","idea ✨ Ý tưởng chính: "+p.keyIdea));
  p.approaches.forEach((ap,i)=>{
    const sol=el("div","sol");
    const h=el("h4");
    h.appendChild(el("span","",["①","②","③"][i]+" "+ap.name));
    if(ap.time&&ap.space)h.appendChild(el("span","meta",ap.time+" · "+ap.space));
    sol.appendChild(h);
    if(ap.idea)sol.appendChild(el("p","stmt",ap.idea));
    if(ap.code){const pre=el("pre","code");pre.innerHTML=hlpy(ap.code);sol.appendChild(pre)}
    if(ap.steps){
      if(ap.anim){const run=el("div","run");sol.appendChild(run);requestAnimationFrame(()=>new Player(run,ap.steps,{problem:p.no,approach:ap.name,code:ap.code}))}
      else{
        sol.appendChild(el("p","steps-desc","Các bước (tự luyện: che code rồi viết lại):"));
        const box=el("div","steps");
        ap.steps.forEach((st,j)=>{const l=el("div","step-line");l.appendChild(el("span","sno",String(j+1)));l.appendChild(el("span","",st.note));box.appendChild(l)});
        sol.appendChild(box);
      }
    }
    s.appendChild(sol);
  });
  return s;
}
document.addEventListener("DOMContentLoaded",render);
